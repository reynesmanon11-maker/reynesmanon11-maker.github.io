:root {
  --papier: #f3f6f1; --carte: #ffffff; --carte-2: #f8faf6; --encre: #23201c; --doux: #676b63; --trait: #e3e8dd; --trait-fort: #cfd6c8;
  --accent: #2f7150; --accent-fond: #e9f1ea; --accent-texte: #ffffff;
  --alerte: #96590c; --alerte-fond: #f8f1e5; --rouge: #9d3b2c; --rouge-fond: #f7e9e6;
  --etab: #7c827a; --perso: #55606e;
  --n-6e: #7cb342; --n-5e: #8e24aa; --n-4e: #3faea6; --n-3e: #e8b400;
  --n-2nde: #4f93d4; --n-1re: #8f76cf; --n-Tle: #d56a97; --n-Autre: #8a8f87;
  --rayon: 16px; --rayon-s: 10px;
  --ombre: 0 1px 2px rgba(35, 32, 28, .05), 0 6px 20px rgba(35, 32, 28, .05);
  --ombre-forte: 0 10px 40px rgba(35, 32, 28, .18);
  --police: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav-h: 0px;
  --barre: #2f4355; --barre-texte: #dfe7ee; --barre-actif: #3cccb2;
  --pense-bete: #fdf5c4; --pense-bete-trait: #eadb87;
  color-scheme: light;
}
:root[data-accent="ambre"] { --accent: #9a5c0c; --accent-fond: #f7efe2; }
:root[data-accent="terracotta"] { --accent: #a9592a; --accent-fond: #f6ece4; }
:root[data-accent="bleu"] { --accent: #2f5d9e; --accent-fond: #e7eef8; }
:root[data-accent="violet"] { --accent: #66499c; --accent-fond: #efeaf7; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #1b1f1c; --carte: #242923; --carte-2: #20241f; --encre: #e7eae3; --doux: #a3a99f; --trait: #353b33; --trait-fort: #464e43;
    --accent: #86c7a2; --accent-fond: #22302a; --accent-texte: #14201a;
    --alerte: #dcab6b; --alerte-fond: #322a1d; --rouge: #e09486; --rouge-fond: #3a2622;
    --etab: #9aa096; --perso: #a9b4c2;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3); --ombre-forte: 0 10px 40px rgba(0, 0, 0, .5);
    --barre: #1c2833; --barre-texte: #c8d3dd; --barre-actif: #3cccb2;
    --pense-bete: #37331d; --pense-bete-trait: #5a5330;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-accent="ambre"] { --accent: #dcab6b; --accent-fond: #332a1d; }
  :root:not([data-theme="light"])[data-accent="terracotta"] { --accent: #e3a07a; --accent-fond: #36281f; }
  :root:not([data-theme="light"])[data-accent="bleu"] { --accent: #9bb8e8; --accent-fond: #222c3a; }
  :root:not([data-theme="light"])[data-accent="violet"] { --accent: #bfa9e8; --accent-fond: #2c2638; }
}
:root[data-theme="dark"] {
  --papier: #1b1f1c; --carte: #242923; --carte-2: #20241f; --encre: #e7eae3; --doux: #a3a99f; --trait: #353b33; --trait-fort: #464e43;
  --accent: #86c7a2; --accent-fond: #22302a; --accent-texte: #14201a;
  --alerte: #dcab6b; --alerte-fond: #322a1d; --rouge: #e09486; --rouge-fond: #3a2622;
  --etab: #9aa096; --perso: #a9b4c2;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3); --ombre-forte: 0 10px 40px rgba(0, 0, 0, .5);
  --barre: #1c2833; --barre-texte: #c8d3dd; --barre-actif: #3cccb2;
  --pense-bete: #37331d; --pense-bete-trait: #5a5330;
  color-scheme: dark;
}
:root[data-theme="dark"][data-accent="ambre"] { --accent: #dcab6b; --accent-fond: #332a1d; }
:root[data-theme="dark"][data-accent="terracotta"] { --accent: #e3a07a; --accent-fond: #36281f; }
:root[data-theme="dark"][data-accent="bleu"] { --accent: #9bb8e8; --accent-fond: #222c3a; }
:root[data-theme="dark"][data-accent="violet"] { --accent: #bfa9e8; --accent-fond: #2c2638; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier); color: var(--encre); font-family: var(--police);
  font-size: 15px; line-height: 1.45; min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}
:root[data-densite="compacte"] body { font-size: 14px; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 650; }
h2 { font-size: 1.05rem; font-weight: 620; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -.2em; }
.visuellement-cache { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- En-tête et navigation ---------- */
.entete {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--papier) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--trait);
  padding-top: env(safe-area-inset-top, 0px);
}
.entete-int { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.marque { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 1.02rem; text-decoration: none; color: var(--encre); white-space: nowrap; }
.marque img { width: 40px; height: 40px; border-radius: 10px; }
/* L'identité et la barre de menus, à la manière de l'espace professeur de Pronote. */
.identite { margin: 0; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; font-size: .82rem; color: var(--doux); }
.identite b { color: var(--encre); font-size: .9rem; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.identite span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-haut { background: var(--barre); }
.nav-haut-int { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav-haut a, .nav-bas a { text-decoration: none; font-weight: 560; display: flex; align-items: center; gap: 7px; }
.nav-haut a { color: var(--barre-texte); padding: 9px 14px 7px; border-bottom: 3px solid transparent; white-space: nowrap; font-size: .92rem; }
.nav-haut a:hover { color: #fff; background: color-mix(in srgb, #fff 9%, var(--barre)); }
.nav-haut a[aria-current="page"] { color: #fff; background: color-mix(in srgb, #fff 13%, var(--barre)); border-bottom-color: var(--barre-actif); }
.nav-bas a { color: var(--doux); border-radius: 999px; }
.sous-barre { background: var(--carte); border-bottom: 1px solid var(--trait); }
.sous-barre-int { max-width: 1280px; margin: 0 auto; padding: 5px 16px; display: flex; align-items: center; gap: 10px; min-height: 38px; flex-wrap: wrap; }
.rubrique { font-weight: 650; }
.derniere-synchro { color: var(--doux); font-size: .82rem; }
.btn-rond.petit { width: 28px; height: 28px; }
.btn-rond.petit .ic { width: 1em; height: 1em; }
.btn-rond[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); }
.entete-droite { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pastille-synchro {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--trait); background: var(--carte);
  border-radius: 999px; padding: 5px 12px; font-size: .82rem; color: var(--doux); white-space: nowrap; max-width: 42vw; overflow: hidden; text-overflow: ellipsis;
}
.pastille-synchro .point { width: 8px; height: 8px; border-radius: 50%; background: var(--etab); flex: none; }
.pastille-synchro[data-etat="ok"] .point { background: var(--accent); }
.pastille-synchro[data-etat="cours"] .point { background: var(--alerte); animation: pulse 1s infinite alternate; }
.pastille-synchro[data-etat="erreur"] .point { background: var(--rouge); }
.pastille-synchro[data-etat="demo"] .point { background: var(--alerte); }
@keyframes pulse { to { opacity: .35; } }
.btn-rond {
  border: 1px solid var(--trait); background: var(--carte); border-radius: 999px; width: 36px; height: 36px; flex: none;
  display: grid; place-items: center; color: var(--doux);
}
.btn-rond:hover { border-color: var(--accent); color: var(--accent); }
.nav-bas {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--carte);
  border-top: 1px solid var(--trait); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  justify-content: space-around;
}
.nav-bas a { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 10px; border-radius: 12px; min-width: 64px; }
.nav-bas a .ic { width: 22px; height: 22px; }
.nav-bas a[aria-current="page"] { color: var(--accent); background: var(--accent-fond); }
@media (max-width: 760px) {
  :root { --nav-h: 66px; }
  .nav-haut { display: none; }
  .nav-bas { display: flex; }
  .nav-bas a { min-width: 0; flex: 1; padding: 6px 4px; }
  .marque span { display: none; }
  .identite { font-size: .74rem; }
  .identite b { font-size: .8rem; }
  .derniere-synchro { display: none; } /* la pastille de synchronisation le dit déjà */
  .organiser .module-tete { flex-wrap: wrap; }
  .organiser .module-tete .droite { width: 100%; margin-left: 0; }
  .organiser .reglage-module { flex-wrap: nowrap; gap: 6px; }
  .organiser .reglage-module .btn-rond { width: 34px; height: 34px; }
}
/* Pendant la mise en route, la navigation ne mène nulle part : on la retire. */
body.sans-nav .nav-haut, body.sans-nav .nav-bas, body.sans-nav .sous-barre { display: none !important; }
body.sans-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- Page ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
.titre-page { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.titre-page p { color: var(--doux); margin-top: 4px; }
.outils { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bandeau {
  border-radius: 14px; padding: 12px 16px; background: var(--alerte-fond); border-left: 3px solid var(--alerte);
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between;
}
.bandeau.info { background: var(--accent-fond); border-left-color: var(--accent); }
.bandeau strong { color: var(--alerte); }
.bandeau.info strong { color: var(--accent); }
.vide { color: var(--doux); font-style: italic; }
.aide { color: var(--doux); font-size: .84rem; }
.petit { font-size: .84rem; }

/* ---------- Boutons, champs ---------- */
.btn {
  border: 1px solid var(--trait-fort); background: var(--carte); border-radius: 999px; padding: 7px 15px; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--encre); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.plein { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); font-weight: 600; }
.btn.plein:hover { color: var(--accent-texte); filter: brightness(1.07); }
.btn.mini { padding: 3px 11px; font-size: .8rem; }
.btn.discret { border-color: transparent; background: transparent; color: var(--doux); }
.btn.discret:hover { color: var(--accent); background: var(--accent-fond); }
.btn.danger:hover { color: var(--rouge); border-color: var(--rouge); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.google { background: var(--carte); border-color: var(--trait-fort); font-weight: 600; padding: 9px 18px; }
.lien { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.champ { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; color: var(--doux); min-width: 0; }
.champ > span { font-weight: 550; }
.champ.aussi { border: 0; padding: 0; margin: 0; }
.champ.aussi legend { font-weight: 550; padding: 0; margin-bottom: 4px; }
.champ.aussi .outils { gap: 6px 16px; }
input[type="text"], input[type="url"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], select, textarea {
  border: 1px solid var(--trait-fort); background: var(--carte); border-radius: 10px; padding: 8px 10px; color: var(--encre); width: 100%; max-width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 17px; height: 17px; }
.coche { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; color: var(--encre); }
.coche input { margin: 2px 0 0; flex: none; }
.coche.faite > span { text-decoration: line-through; color: var(--doux); }
.grille-champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.segmente { display: inline-flex; border: 1px solid var(--trait-fort); border-radius: 999px; padding: 2px; background: var(--carte); flex-wrap: wrap; }
.segmente button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: .84rem; color: var(--doux); }
.segmente button[aria-pressed="true"] { background: var(--accent); color: var(--accent-texte); font-weight: 600; }
main > .segmente { align-self: flex-start; }

/* ---------- Cartes et modules ---------- */
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 16px 18px; box-shadow: var(--ombre); min-width: 0; }
.tableau { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; grid-auto-flow: row dense; align-items: start; }
.module { grid-column: span 3; display: flex; flex-direction: column; gap: 12px; }
.module.taille-S { grid-column: span 2; }
.module.taille-L { grid-column: span 6; }
@media (max-width: 1100px) { .module, .module.taille-S { grid-column: span 3; } }
@media (max-width: 760px) { .module, .module.taille-S, .module.taille-L { grid-column: span 6; } }
.module-tete { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.module-tete h2 { display: flex; align-items: center; gap: 8px; }
.module-tete h2 .ic { color: var(--accent); }
.module-tete .droite { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.module-corps { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.poignee { display: none; border: 0; background: none; padding: 4px; color: var(--doux); cursor: grab; touch-action: none; border-radius: 8px; }
.organiser .poignee { display: inline-flex; }
.organiser .module { outline: 2px dashed var(--trait-fort); outline-offset: 3px; }
.organiser .module-corps { opacity: .55; pointer-events: none; max-height: 170px; overflow: hidden; }
.reglage-module { display: none; gap: 4px; align-items: center; flex-wrap: wrap; }
.organiser .reglage-module { display: flex; }
.module.glisse { position: relative; z-index: 30; box-shadow: var(--ombre-forte); opacity: .96; cursor: grabbing; }
.module.fantome { visibility: hidden; }
.modules-caches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.resume { font-size: 1.02rem; color: var(--doux); }
.resume b { color: var(--encre); font-weight: 600; }

/* ---------- Lignes de cours ---------- */
.liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cours {
  --niv: var(--n-Autre);
  border: 1px solid var(--trait); border-left: 4px solid var(--niv); border-radius: 12px; padding: 10px 12px; background: var(--carte);
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.cours.annule { opacity: .6; }
.cours.annule .heure { text-decoration: line-through; }
.cours.passe { background: var(--carte-2); }
.cours-haut { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: .86rem; color: var(--doux); }
.heure { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--encre); }
.classe-pastille {
  --niv: var(--n-Autre);
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-weight: 650; font-size: .84rem;
  background: color-mix(in srgb, var(--niv) 18%, var(--carte)); color: color-mix(in srgb, var(--niv) 62%, var(--encre));
}
.etiquette { border-radius: 6px; padding: 0 7px; font-size: .76rem; border: 1px solid var(--trait); color: var(--doux); white-space: nowrap; }
.etiquette.ok { background: var(--accent-fond); color: var(--accent); border-color: transparent; }
.etiquette.attente { background: var(--alerte-fond); color: var(--alerte); border-color: transparent; }
.etiquette.rouge { background: var(--rouge-fond); color: var(--rouge); border-color: transparent; }
.cours-plan { display: flex; flex-direction: column; gap: 3px; }
.segment { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; font-size: .93rem; }
.segment .quoi { min-width: 0; }
.segment-modifier { all: unset; cursor: pointer; color: inherit; font: inherit; text-decoration: underline dotted var(--doux); text-underline-offset: 3px; overflow-wrap: anywhere; }
.segment-modifier:hover, .segment-modifier:focus-visible { color: var(--accent); text-decoration-color: var(--accent); }
.segment-modifier:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.segment-modifier svg { width: 14px; height: 14px; vertical-align: -2px; opacity: .7; }
.deroule { margin: 2px 0 6px; padding-left: 1.2em; font-size: .88rem; color: var(--doux); }
.deroule li.ici { color: var(--encre); font-weight: 600; }
.deroule li.fait { text-decoration: line-through; opacity: .6; }
.deroule li.ensuite { opacity: .6; }
.deroule li.peut-etre { opacity: .8; font-style: italic; }
.segment .ou { color: var(--accent); font-size: .84rem; }
.segment .part { color: var(--doux); font-size: .78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.segment.eval .quoi { font-weight: 650; }
.segment.libre .quoi { color: var(--alerte); font-style: italic; }
.cours-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.annonce { font-size: .84rem; background: var(--accent-fond); border-radius: 8px; padding: 5px 9px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.annonce.tard { background: var(--alerte-fond); }
.avert { font-size: .82rem; color: var(--alerte); background: var(--alerte-fond); border-radius: 8px; padding: 5px 9px; }
.evt { display: flex; gap: 10px; align-items: baseline; font-size: .88rem; color: var(--doux); padding: 2px 4px 2px 12px; border-left: 3px solid var(--etab); }
.evt.perso { border-left-color: var(--perso); }
.evt.libre { border-left-style: dashed; border-left-color: var(--trait-fort); font-style: italic; }
.evt .heure { font-weight: 500; color: var(--doux); }

/* ---------- Progression comparée ---------- */
.peloton { display: flex; flex-direction: column; gap: 12px; }
.piste { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.barre { position: relative; height: 10px; border-radius: 999px; background: var(--trait); overflow: hidden; }
.barre i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--niv, var(--accent)); }
.barre .crans { position: absolute; inset: 0; display: flex; }
.barre .crans span { flex: 1; border-right: 2px solid var(--carte); }
.piste .detail { grid-column: 2; font-size: .82rem; color: var(--doux); margin-top: -3px; }

/* ---------- Tâches ---------- */
.taches-ligne { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.taches-ligne > * { flex: 0 0 auto; scroll-snap-align: start; max-width: 260px; border: 1px solid var(--trait); border-radius: 12px; padding: 8px 10px; background: var(--carte-2); }
.taches-echeances { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.taches-echeances > div { background: var(--carte-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.taches-echeances h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); }
@media (max-width: 760px) { .taches-echeances { grid-template-columns: minmax(0, 1fr); } }
.ajout-tache { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.tache-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.retard { color: var(--rouge); font-weight: 600; }
.compteur { font-size: 2.6rem; font-weight: 650; line-height: 1; color: var(--alerte); font-variant-numeric: tabular-nums; }
.compteur.ok { color: var(--accent); }

/* ---------- Semaine ---------- */
.semaine-outils { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.semaine-outils h2 { font-size: 1.15rem; min-width: 0; }
.grille {
  --px: 1.05px; display: grid; grid-template-columns: 52px minmax(0, 1fr); background: var(--carte);
  border: 1px solid var(--trait); border-radius: var(--rayon); overflow: hidden;
}
.grille-heures { position: relative; border-right: 1px solid var(--trait); }
.grille-heures span { position: absolute; right: 6px; font-size: .72rem; color: var(--doux); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.grille-jours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); overflow-x: auto; scroll-snap-type: x mandatory; }
.colonne-jour { position: relative; border-right: 1px solid var(--trait); scroll-snap-align: start; min-width: 0; }
.colonne-jour:last-child { border-right: 0; }
.colonne-jour .tete-jour {
  position: sticky; top: 0; height: 50px; overflow: hidden; padding: 6px 8px; border-bottom: 1px solid var(--trait); background: var(--carte);
  font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); z-index: 2;
}
.colonne-jour.auj .tete-jour { color: var(--accent); font-weight: 650; }
.colonne-jour .corps-jour { position: relative; }
.ligne-heure { position: absolute; left: 0; right: 0; border-top: 1px solid var(--trait); }
.ligne-heure.demi { border-top-style: dotted; opacity: .6; }
.maintenant { position: absolute; left: 0; right: 0; border-top: 2px solid var(--rouge); z-index: 3; }
.bloc {
  --niv: var(--n-Autre);
  position: absolute; border-radius: 8px; padding: 3px 6px; font-size: .74rem; line-height: 1.25; overflow: hidden; cursor: pointer;
  background: color-mix(in srgb, var(--niv) 17%, var(--carte)); border-left: 3px solid var(--niv); color: var(--encre);
  text-align: left; border-top: 0; border-right: 0; border-bottom: 0;
}
.bloc b { display: block; font-size: .78rem; }
.bloc .sous { color: var(--doux); }
.bloc.annule { opacity: .5; text-decoration: line-through; }
.bloc.etab { --niv: var(--etab); background: color-mix(in srgb, var(--etab) 12%, var(--carte)); }
.bloc.perso { --niv: var(--perso); background: repeating-linear-gradient(135deg, var(--carte-2) 0 6px, var(--carte) 6px 12px); border: 1px dashed var(--trait-fort); border-left: 3px solid var(--niv); }
.bloc.libre-prevu { box-shadow: inset 0 -3px 0 var(--alerte); }
.bandeau-journee { margin: 3px 4px; border-radius: 6px; padding: 2px 6px; font-size: .72rem; background: var(--accent-fond); color: var(--accent); }
.bandeau-journee.vac { background: var(--alerte-fond); color: var(--alerte); }
@media (max-width: 760px) {
  .grille-jours { grid-auto-columns: 86%; }
}
.jours-liste { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 12px; align-items: start; }
.a-prevoir { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
.a-prevoir > b { font-size: .8rem; }
@media (max-width: 1100px) { .jours-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .jours-liste { grid-template-columns: minmax(0, 1fr); } }
.jour-liste h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); padding-bottom: 5px; border-bottom: 1px solid var(--trait); margin-bottom: 8px; }
.jour-liste.auj h3 { color: var(--accent); border-bottom-color: var(--accent); }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--doux); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; background: var(--c); }

/* ---------- Classes ---------- */
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start; }
.classe-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.file { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.etape { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--trait); border-radius: 10px; }
.etape.faite { opacity: .55; }
.etape.encours { border-color: var(--accent); background: var(--accent-fond); }
.etape .meta { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .78rem; color: var(--doux); }
.mini-outils { display: flex; gap: 2px; }
.mini-outils button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--doux); }
.mini-outils button:hover { background: var(--accent-fond); color: var(--accent); }
.jalons-apercu { display: flex; gap: 3px; flex-wrap: wrap; }
.jalons-apercu span { font-size: .7rem; border-radius: 5px; padding: 0 5px; background: var(--carte-2); border: 1px solid var(--trait); }
.jalons-apercu span.fait { background: var(--accent-fond); color: var(--accent); border-color: transparent; }

/* ---------- Feuille (dialogue) ---------- */
dialog.feuille {
  border: 0; padding: 0; border-radius: 20px; background: var(--carte); color: var(--encre); width: min(640px, calc(100vw - 32px));
  max-height: min(88vh, 900px); box-shadow: var(--ombre-forte);

<script type="text/x-carnet-module" data-module="carnet/js/app.js">
// Démarrage, navigation et rendu. Chaque changement d'état redessine la page courante ; un champ
// en cours de saisie n'est jamais écrasé (le rendu attend qu'on le quitte).
import { actions, brancher } from 'carnet/js/actions.js';
import { html, icone, toast, fermerFeuille, redessinerFeuille, feuilleOuverte } from 'carnet/js/ui.js';
import { etat, calc, charger, abonner, changer, reglerLocal, surModification, definirSynchro, relireDocs } from 'carnet/js/etat.js';
import { stockageDurable } from 'carnet/js/stockage.js';
import * as G from 'carnet/js/google.js';
import { synchroniser, messageErreur } from 'carnet/js/synchro.js';
import { rendreAccueil, surGlisser, enOrganisation } from 'carnet/js/vues/accueil.js';
import { rendreSemaine } from 'carnet/js/vues/semaine.js';
import { rendreClasses } from 'carnet/js/vues/classes.js';
import { rendreTaches } from 'carnet/js/vues/taches.js';
import { rendreCahier } from 'carnet/js/vues/cahier.js';
import { rendreReglages, apparence } from 'carnet/js/vues/reglages.js';
import { rendreDemarrer, reprendreConnexion } from 'carnet/js/vues/demarrer.js';
import { ouvrirCreneau } from 'carnet/js/vues/creneau.js';
import { activerGlisser } from 'carnet/js/dnd.js';
import { surChangementInstallation } from 'carnet/js/installation.js';
import 'carnet/js/vues/partage.js';
import { proposerImportLien } from 'carnet/js/vues/importlien.js';
import { CONFIG } from 'carnet/config.js';
import { identite } from 'carnet/js/identite.js';
import { dateLongue, heureDe, heureLisible, jourDe } from 'carnet/js/dates.js';

// Les mêmes rubriques, et les mêmes mots, que l'espace professeur de Pronote.
const VUES = { accueil: rendreAccueil, semaine: rendreSemaine, cahier: rendreCahier, classes: rendreClasses, taches: rendreTaches, reglages: rendreReglages, demarrer: rendreDemarrer };
const TITRES = { accueil: "Page d'accueil", semaine: 'Emploi du temps', cahier: 'Cahier de textes', classes: 'Progressions', taches: 'Mes travaux', reglages: 'Mes données', demarrer: 'Mise en route' };
const main = document.getElementById('vue');
let routePrecedente = '';

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [vue, param] = h.split('/');
  return { vue: VUES[vue] ? vue : 'accueil', param: param ? decodeURIComponent(param) : '' };
}

function appliquerApparence() {
  const r = document.documentElement, l = etat.local;
  if (l.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', l.theme || 'light');
  r.setAttribute('data-accent', l.accent || 'vert');
  r.setAttribute('data-densite', l.densite || 'confort');
  const sombre = l.theme === 'dark' || (l.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const b = document.getElementById('bouton-theme');
  if (b) {
    const t = sombre ? 'Revenir au thème clair' : 'Passer au thème sombre';
    b.setAttribute('aria-label', t); b.title = t;
    b.innerHTML = String(icone(sombre ? 'soleil' : 'lune'));
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(r).getPropertyValue('--papier').trim() || '#f3f6f1';
}

/** « le samedi 24 octobre à 15h39 », « aujourd'hui à 8h12 ». */
function quandLisible(ms) {
  const tz = calc().fuseau, d = new Date(ms);
  const jour = jourDe(d, tz), auj = jourDe(new Date(), tz);
  return `${jour === auj ? "aujourd'hui" : `le ${dateLongue(jour)}`} à ${heureLisible(heureDe(d, tz))}`;
}

function rendreEntete(vue) {
  document.body.classList.toggle('sans-nav', !etat.local.mode);
  document.querySelectorAll('[data-route]').forEach((a) => {
    if (a.dataset.route === vue) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  // L'identité, comme en tête de Pronote : établissement, espace professeur, nom.
  const id = document.getElementById('identite');
  if (id) {
    const { etablissement, nom } = etat.local.mode ? identite() : {};
    id.hidden = !etablissement && !nom;
    id.querySelector('b').textContent = etablissement || '';
    id.querySelector('span').textContent = nom ? `Espace professeur · ${nom}` : 'Espace professeur';
  }
  // La barre sous le menu : la rubrique, le réglage de la page d'accueil, la dernière synchronisation.
  const rubrique = document.getElementById('rubrique');
  if (rubrique) rubrique.textContent = TITRES[vue] || '';
  const perso = document.getElementById('bouton-personnaliser');
  if (perso) { perso.hidden = vue !== 'accueil'; perso.setAttribute('aria-pressed', String(enOrganisation())); }
  const derniere = document.getElementById('derniere-synchro');
  if (derniere) {
    const l = etat.local;
    derniere.textContent = l.mode === 'google' && l.derniereSynchro ? `Dernière synchronisation ${quandLisible(l.derniereSynchro)}`
      : l.mode === 'local' && etat.brut.lu ? `Emploi du temps lu ${quandLisible(etat.brut.lu)}`
      : l.mode === 'demo' ? 'Mode démo : un emploi du temps fictif' : '';
  }
  const p = document.getElementById('pastille-synchro');
  if (!p) return;
  const s = etat.synchro, mode = etat.local.mode;
  let etatP = s.etat, texte = s.message;
  if (mode === 'demo') { etatP = 'demo'; texte = 'Mode démo'; }
  else if (!mode) { etatP = 'repos'; texte = 'Pas encore configuré'; }
  else if (mode === 'local' && s.etat === 'repos') { etatP = 'ok'; texte = 'Sur cet appareil'; }
  else if (mode === 'google' && !G.connecte() && s.etat !== 'cours') { etatP = 'connexion'; texte = 'Se reconnecter à Google'; }
  if (!etat.durable && mode) texte += ' · non mémorisé';
  p.dataset.etat = etatP === 'connexion' ? 'erreur' : etatP;
  p.querySelector('.texte').textContent = texte || '…';
  p.title = mode === 'google' ? 'Toucher pour synchroniser' : texte;
}

// Un rendu remplace la page : on rend au champ qui avait le focus sa valeur, son curseur et son
// défilement, pour qu'une frappe en cours ne soit jamais perdue ni interrompue.
function capturerFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !main.contains(a)) return null;
  const texte = a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /^(text|search|url|email|number|date)$/.test(a.type));
  return { id: a.id, texte, valeur: texte ? a.value : null, debut: texte ? a.selectionStart : null, fin: texte ? a.selectionEnd : null, defil: a.scrollTop };
}
function restaurerFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  if (f.texte && el.value !== f.valeur) el.value = f.valeur;
  el.focus({ preventScroll: true });
  if (f.texte && f.debut != null) { try { el.setSelectionRange(f.debut, f.fin); } catch { /* type sans sélection */ } }
  el.scrollTop = f.defil || 0;
}

function rendre() {
  if (!etat.pret) return;
  appliquerApparence();
  let r = route();
  if (!etat.local.mode && r.vue !== 'demarrer') { location.replace('#/demarrer'); r = { vue: 'demarrer', param: '' }; }
  rendreEntete(r.vue);
  const focus = capturerFocus();
  const cle = `${r.vue}/${r.param}`;
  const memeVue = cle === routePrecedente;
  const defilement = memeVue ? window.scrollY : 0;
  try {
    main.innerHTML = String(VUES[r.vue](r));
  } catch (e) {
    console.error(e);
    main.innerHTML = String(html`<div class="bandeau"><span><strong>Cet écran n'a pas pu s'afficher.</strong> ${e.message}</span><a class="btn mini" href="#/accueil">Accueil</a></div>`);
  }
  if (!memeVue) {
    document.title = `${TITRES[r.vue]} · Carnet de bord`;
    window.scrollTo(0, 0);
  } else {
    if (defilement) window.scrollTo(0, defilement);
    restaurerFocus(focus);
  }
  routePrecedente = cle;
  redessinerFeuille();
}

// ---------- Actions communes ----------
actions['fermer-feuille'] = () => fermerFeuille();
actions['theme'] = () => {
  const sombre = etat.local.theme === 'dark' || (etat.local.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  apparence({ theme: sombre ? 'light' : 'dark' });
};
actions['synchro'] = async () => {
  if (etat.local.mode === 'demo') { toast('Mode démo : rien à synchroniser.'); return; }
  if (!etat.local.mode) { location.hash = '#/demarrer'; return; }
  if (etat.local.mode === 'google' && !G.connecte()) {
    try { await G.connecter({ indice: etat.local.compte && etat.local.compte.email }); } catch (e) { toast(messageErreur(e)); return; }
  }
  await synchroniser();
  if (etat.synchro.etat === 'erreur') toast(etat.synchro.message);
};

// ---------- Synchronisation automatique ----------
let minuteurSynchro;
surModification.appel = () => {
  if (etat.local.mode !== 'google') return;
  clearTimeout(minuteurSynchro);
  minuteurSynchro = setTimeout(() => { if (G.connecte()) synchroniser(); }, 3000);
};

// ---------- Liens profonds : #valider=CLE et #creneau=CLE (depuis Google Agenda), #importer=… ----------
function lienProfond() {
  const imp = location.hash.match(/^#importer=([A-Za-z0-9_-]+)/);
  if (imp) {
    // Les données du lien ne restent ni dans l'adresse, ni dans l'historique.
    history.replaceState(null, '', '#/accueil');
    setTimeout(() => proposerImportLien(imp[1]), 50);
    return true;
  }
  const m = location.hash.match(/^#(valider|creneau)=([^&]+)/);
  if (!m) return false;
  const cle = decodeURIComponent(m[2]);
  history.replaceState(null, '', '#/accueil');
  setTimeout(() => ouvrirCreneau(cle, { valider: m[1] === 'valider' }), 50);
  return true;
}

// ---------- Retour de chez Google (connexion par redirection) ----------
async function apresRetourGoogle(r) {
  if (r.erreur) {
    toast(r.erreur === 'access_denied' ? 'Connexion Google annulée.'
      : r.erreur === 'etat' ? "Cette connexion Google n'a pas été lancée par le Carnet : elle est ignorée. Recommencez depuis le Carnet."
      : `Google n'a pas accordé la connexion (${r.erreur}).`);
    return;
  }
  if (r.suite === 'demarrer') { await reprendreConnexion(r.manquantes); return; }
  if (etat.local.mode === 'google') {
    await synchroniser();
    if (etat.synchro.etat === 'erreur') toast(etat.synchro.message);
  }
}

async function demarrer() {
  brancher(document);
  activerGlisser(main, { surFin: surGlisser });
  abonner(rendre);
  await charger();
  // Avant tout affichage : un jeton revenu de Google ne doit pas rester dans l'adresse.
  const retourGoogle = G.retourDeGoogle();
  etat.durable = await stockageDurable();
  if (CONFIG.apercu && !etat.local.mode) actions['demarrer-demo']();
  if (etat.local.mode === 'demo') definirSynchro('demo', 'Mode démo');
  lienProfond();
  rendre();
  window.addEventListener('hashchange', () => { if (!lienProfond()) { if (feuilleOuverte()) fermerFeuille(); rendre(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => appliquerApparence());
  // L'installation devient possible (ou vient d'avoir lieu) : le bouton « Installer » apparaît ou s'en va.
  surChangementInstallation(() => changer());
  // Le temps passe : « à valider », « en cours », la ligne rouge de l'heure.
  setInterval(() => { if (document.visibilityState === 'visible') changer(); }, 60 * 1000);
  // Synchronisation régulière tant que l'appli est ouverte et connectée.
  setInterval(() => { if (etat.local.mode === 'google' && G.connecte() && document.visibilityState === 'visible') synchroniser(); }, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { relireDocs(); changer(); } });
  window.addEventListener('online', () => { if (etat.local.mode === 'google' && G.connecte()) synchroniser(); });
  if (etat.local.mode === 'local' && etat.local.ics && etat.local.ics.url) synchroniser();
  if (retourGoogle) apresRetourGoogle(retourGoogle);
  // Dans un cadre isolé (aperçu intégré), le simple accès au service worker peut lever une erreur.
  let sw = null;
  // Le fichier unique (carnet-complet.html) n'a pas de service worker : il n'a rien à mettre en cache.
  try { if (location.protocol !== 'file:' && !CONFIG.apercu && !globalThis.CARNET_UN_FICHIER) sw = navigator.serviceWorker || null; } catch { /* pas de service worker */ }
  if (sw) {
    // Une nouvelle version a pris la main : on recharge tout de suite, sauf si l'on est en train
    // d'écrire (une feuille ouverte, un champ actif) — alors on le propose.
    const avaitUneVersion = !!sw.controller;
    let recharge = false;
    sw.addEventListener('controllerchange', () => {
      if (!avaitUneVersion || recharge) return;
      const occupe = feuilleOuverte() || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if (occupe) { toast('Une nouvelle version du Carnet est prête.', { action: { libelle: 'Recharger', faire: () => location.reload() } }); return; }
      recharge = true;
      location.reload();
    });
    sw.register('sw.js').then((reg) => {
      // Une appli restée ouverte cherche aussi les mises à jour, une fois par heure.
      setInterval(() => { reg.update().catch(() => {}); }, 60 * 60 * 1000);
    }).catch(() => { /* aperçu sans service worker : l'appli marche en ligne */ });
  }
}

demarrer().catch((e) => {
  console.error(e);
  main.textContent = `Le Carnet n'a pas pu démarrer : ${e.message}`;
});
export { reglerLocal };
</script>
<script type="text/x-carnet-module" data-module="carnet/js/actions.js">
// Registre des actions de l'interface. Un élément porte data-action="nom" (clic),
// data-change="nom" (changement de valeur), data-saisie="nom" (frappe) ou data-envoi="nom"
// (formulaire) ; chaque vue enregistre ses gestionnaires ici. Un seul écouteur par type
// d'événement pour toute la page, même après un nouveau rendu.
export const actions = {};
export const changements = {};
export const saisies = {};
export const envois = {};

export function brancher(racine = document) {
  racine.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const f = actions[el.dataset.action];
    if (!f) return;
    if (el.tagName === 'A' && el.getAttribute('href') && !el.getAttribute('href').startsWith('#')) return;
    e.preventDefault();
    f(el, e);
  });
  racine.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (el && changements[el.dataset.change]) changements[el.dataset.change](el, e);
  });
  racine.addEventListener('input', (e) => {
    const el = e.target.closest('[data-saisie]');
    if (el && saisies[el.dataset.saisie]) saisies[el.dataset.saisie](el, e);
  });
  racine.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-envoi]');
    if (!f || !envois[f.dataset.envoi]) return;
    e.preventDefault();
    envois[f.dataset.envoi](f, e);
  });
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/ui.js">
// Petits outils d'affichage. Tout passe par le gabarit `html` qui échappe chaque valeur insérée :
// un titre de cours ou une description d'agenda vient de Pronote ou de Google, jamais du code de
// l'appli, et ne doit pas pouvoir y injecter de balises. `brut()` marque le HTML déjà sûr.

class Brut {
  constructor(s) { this.s = s; }
  toString() { return this.s; }
}
export const brut = (s) => new Brut(String(s));

const ECHAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
export const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ECHAP[c]);

function rendu(v) {
  if (v == null) return '';
  // Un booléen s'écrit en toutes lettres : aria-pressed="${actif}" doit donner "true" ou "false".
  // (Les conditions s'écrivent avec ? : '' — jamais avec && — pour ne pas afficher « false ».)
  if (typeof v === 'boolean') return String(v);
  if (v instanceof Brut) return v.s;
  if (Array.isArray(v)) return v.map(rendu).join('');
  return esc(v);
}

/** Gabarit : html`<p>${texte}</p>` → Brut, avec chaque valeur échappée. */
export function html(chaines, ...valeurs) {
  let s = chaines[0];
  for (let i = 0; i < valeurs.length; i++) s += rendu(valeurs[i]) + chaines[i + 1];
  return new Brut(s);
}

export const icone = (nom, titre) => brut(`<svg class="ic" aria-hidden="${titre ? 'false' : 'true'}"${titre ? ` role="img" aria-label="${esc(titre)}"` : ''}><use href="#i-${esc(nom)}"/></svg>`);

export const $ = (sel, racine = document) => racine.querySelector(sel);
export const $$ = (sel, racine = document) => [...racine.querySelectorAll(sel)];

let minuteurToast;
export function toast(message, { action, duree = 3200 } = {}) {
  let t = $('.toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    document.body.appendChild(t);
  }
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = message;
  t.appendChild(span);
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.libelle;
    b.addEventListener('click', () => { action.faire(); t.remove(); });
    t.appendChild(b);
  }
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.remove(), action ? duree * 2 : duree);
}

// ---------- Feuille : une boîte de dialogue qui se redessine avec l'état ----------
let feuille = null;
let rendreFeuille = null;

/** Ouvre une feuille. `contenu()` renvoie { titre, corps, pied } ; il est rappelé à chaque changement d'état. */
export function ouvrirFeuille(contenu, { classe = '', surFermeture } = {}) {
  if (!feuille) {
    feuille = document.createElement('dialog');
    feuille.className = 'feuille';
    feuille.addEventListener('close', () => {
      const f = feuille._surFermeture;
      rendreFeuille = null;
      touches.clear();
      // Le formulaire est encore là : de quoi enregistrer ce qui a été tapé avant de fermer.
      if (f) f(feuille.querySelector('form'));
      feuille.innerHTML = '';
    });
    // Ce que l'on tape est noté : un redessin (synchronisation, autre fenêtre) ne l'efface pas.
    const noter = (e) => {
      const el = e.target, k = cleChamp(el);
      if (!k) return;
      if (el.type === 'radio' && el.form) for (const r of el.form.querySelectorAll(`input[type=radio][name="${el.name}"]`)) touches.set(cleChamp(r), r === el && el.checked);
      else touches.set(k, valeurChamp(el));
    };
    feuille.addEventListener('input', noter);
    feuille.addEventListener('change', noter);
    feuille.addEventListener('click', (e) => { if (e.target === feuille) feuille.close(); });
    document.body.appendChild(feuille);
  }
  feuille.className = `feuille ${classe}`;
  feuille._surFermeture = surFermeture;
  rendreFeuille = contenu;
  touches.clear();
  redessinerFeuille(true);
  if (!feuille.open) {
    if (typeof feuille.showModal === 'function') feuille.showModal();
    else feuille.setAttribute('open', '');
  }
  const premier = feuille.querySelector('[autofocus]');
  if (premier) premier.focus();
}

export function redessinerFeuille(force = false) {
  if (!feuille || !rendreFeuille) return;
  // Ne pas écraser un champ en cours de saisie dans la feuille.
  const actif = document.activeElement;
  if (!force && actif && feuille.contains(actif) && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName)) return;
  const { titre, corps, pied } = rendreFeuille();
  const defilement = feuille.querySelector('.feuille-corps')?.scrollTop || 0;
  feuille.innerHTML = String(html`<div class="feuille-int">
    <div class="feuille-tete"><h2>${titre}</h2><button class="btn-rond" data-action="fermer-feuille" aria-label="Fermer">${icone('croix')}</button></div>
    <div class="feuille-corps">${corps}</div>
    ${pied ? html`<div class="feuille-pied">${pied}</div>` : ''}
  </div>`);
  const c = feuille.querySelector('.feuille-corps');
  if (c) c.scrollTop = defilement;
  for (const el of feuille.querySelectorAll('input[name], textarea[name], select[name]')) {
    const k = cleChamp(el);
    if (!touches.has(k)) continue;
    if (el.type === 'checkbox' || el.type === 'radio') el.checked = touches.get(k); else el.value = touches.get(k);
  }
}

// Les champs touchés depuis l'ouverture de la feuille : formulaire, nom (et valeur, pour une case).
const touches = new Map();
function cleChamp(el) {
  if (!el || !el.name || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return '';
  return `${(el.form && el.form.id) || ''}|${el.name}|${el.type === 'checkbox' || el.type === 'radio' ? el.value : ''}`;
}
const valeurChamp = (el) => (el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value);

export function fermerFeuille() { if (feuille && feuille.open) feuille.close(); }
export const feuilleOuverte = () => !!(feuille && feuille.open);

/** Copie du texte, avec repli par sélection quand le presse-papiers est refusé. */
export async function copier(texte, element) {
  try { await navigator.clipboard.writeText(texte); return true; } catch {
    if (element) {
      const r = document.createRange(); r.selectNodeContents(element);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    return false;
  }
}

/** Charge un script externe une seule fois. */
const scripts = new Map();
export function chargerScript(src) {
  if (!scripts.has(src)) {
    scripts.set(src, new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.defer = true;
      s.onload = ok; s.onerror = () => { scripts.delete(src); ko(new Error(`Impossible de charger ${src}`)); };
      document.head.appendChild(s);
    }));
  }
  return scripts.get(src);
}

/** Télécharge un texte comme fichier. */
export function telecharger(nom, texte, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([texte], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/etat.js">
// L'état de l'appli et ses calculs dérivés.
//   docs   : les données de l'enseignant (synchronisées entre appareils)
//   local  : les préférences de CET appareil (thème, disposition du tableau de bord, mode)
//   brut   : les derniers événements lus (Pronote, agendas perso), gardés pour le hors-ligne
import { lire, ecrire as ecrireStockage, fusionnerEcrire } from 'carnet/js/stockage.js';
import { vue, fusionner, purger, fusionImport } from 'carnet/js/donnees.js';
import { interpreter, deduireNoms, niveauDe } from 'carnet/js/pronote.js';
import { construireCreneaux, planifier, coupures, dureeSeanceProbable, persoUtiles } from 'carnet/js/moteur.js';
import { FUSEAU_APPAREIL, aujourdhui, lundiDe, jourDe } from 'carnet/js/dates.js';

export const LOCAL_DEFAUT = {
  theme: 'light', accent: 'vert', densite: 'confort',
  disposition: null,
  mode: null,
  ics: { url: '' },
  vueSemaine: null,
  persoVisible: true,
  installPlusTard: 0,
  dernierIncident: null,
  compte: null,
  derniereLecture: null,
  derniereEcriture: null,
};

export const etat = {
  pret: false,
  docs: {},
  local: { ...LOCAL_DEFAUT },
  brut: { pronote: [], perso: [], agendas: {}, lu: null },
  synchro: { etat: 'repos', message: '' },
  sale: false,
  durable: true,
  version: 0,
};

const abonnes = new Set();
export const abonner = (fn) => { abonnes.add(fn); return () => abonnes.delete(fn); };
let memo = null, prevu = false;
export const surModification = { appel: null };

export function changer() {
  etat.version++;
  memo = null;
  if (prevu) return;
  prevu = true;
  const lancer = () => { prevu = false; abonnes.forEach((f) => f()); };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(lancer); else queueMicrotask(lancer);
}

// On écrit tout de suite (regroupé à la fin de l'instruction en cours, pas plus tard) : un
// téléphone peut fermer la page juste après « Enregistrer », la validation ne doit pas se perdre.
let sauvegardePrevue = false;
function sauver() {
  if (sauvegardePrevue) return;
  sauvegardePrevue = true;
  queueMicrotask(() => {
    sauvegardePrevue = false;
    ecrireDocs();
    ecrireStockage('local', etat.local);
  });
}
if (typeof addEventListener === 'function') {
  addEventListener('pagehide', () => { ecrireDocs(); ecrireStockage('local', etat.local); });
}

// Deux fenêtres du Carnet sur le même appareil partagent la même mémoire : chacune écrit en
// fusionnant document par document (le plus récent gagne), et prévient l'autre, qui relit.
const canal = typeof BroadcastChannel === 'function' ? new BroadcastChannel('carnet-de-bord') : null;
let ecraserProchain = false;
async function ecrireDocs() {
  const ecraser = ecraserProchain; ecraserProchain = false;
  if (ecraser) { await ecrireStockage('docs', etat.docs); if (canal) canal.postMessage('docs'); return; }
  const ecrit = await fusionnerEcrire('docs', etat.docs, (stocke, ici) => purger(fusionner(ici, stocke || {})));
  adopter(ecrit);
  if (canal) canal.postMessage('docs');
}
/** Reprend ce qu'une autre fenêtre a écrit de plus récent. */
function adopter(stocke) {
  if (!stocke || typeof stocke !== 'object') return;
  const fus = purger(fusionner(etat.docs, stocke));
  if (Object.keys(fus).some((k) => fus[k] !== etat.docs[k])) { etat.docs = fus; changer(); }
}
export async function relireDocs() {
  if (etat.pret) adopter(await lire('docs'));
}
if (canal) canal.onmessage = (e) => { if (e.data === 'docs') relireDocs(); };

export async function charger() {
  const [docs, local, brut] = await Promise.all([lire('docs'), lire('local'), lire('brut')]);
  if (docs && typeof docs === 'object') etat.docs = docs;
  if (local && typeof local === 'object') etat.local = { ...LOCAL_DEFAUT, ...local };
  if (brut && typeof brut === 'object') etat.brut = { ...etat.brut, ...brut };
  etat.pret = true;
  changer();
}

// ---------- Écritures ----------
const vivant = (d) => d && !d._x;

export function ecrireDoc(chemin, donnees) {
  etat.docs[chemin] = { ...donnees, _m: Date.now() };
  etat.sale = true;
  sauver(); changer();
  if (surModification.appel) surModification.appel(chemin);
}

export function modifierDoc(chemin, fn) {
  const actuel = etat.docs[chemin];
  const d = vivant(actuel) ? structuredClone(actuel) : {};
  delete d._m;
  fn(d);
  ecrireDoc(chemin, d);
}

export function supprimerDoc(chemin) {
  etat.docs[chemin] = { _x: 1, _m: Date.now() };
  etat.sale = true;
  sauver(); changer();
  if (surModification.appel) surModification.appel(chemin);
}

export function fusionnerDocs(autres) {
  etat.docs = purger(fusionner(etat.docs, autres));
  sauver(); changer();
}

/** Un import choisi par l'utilisateur : voir fusionImport. */
export function importerDocs(importes) {
  etat.docs = purger(fusionImport(etat.docs, importes));
  etat.sale = true;
  sauver(); changer();
  if (surModification.appel) surModification.appel('import');
}

export function remplacerDocs(docs) {
  etat.docs = docs;
  ecraserProchain = true;
  etat.sale = true;
  sauver(); changer();
}

export function reglerLocal(patch) {
  etat.local = { ...etat.local, ...patch };
  sauver(); changer();
}

export function definirBrut(patch) {
  etat.brut = { ...etat.brut, ...patch };
  ecrireStockage('brut', etat.brut);
  changer();
}

export function definirSynchro(etatSynchro, message = '') {
  etat.synchro = { etat: etatSynchro, message };
  changer();
}

export const reglages = () => vue(etat.docs).reglages;
export const modifierReglages = (fn) => modifierDoc('reglages', fn);

// ---------- Calculs dérivés ----------

/** Tout ce que les vues lisent, recalculé seulement quand l'état change. */
export function calc() {
  if (memo) return memo;
  const v = vue(etat.docs);
  const fuseau = v.reglages.fuseau || FUSEAU_APPAREIL;
  const cours = (etat.brut.pronote || []).map((e) => interpreter(e)).filter(Boolean);
  const dureeSeance = Number(v.reglages.dureeSeance) || dureeSeanceProbable(cours);
  const exclus = v.reglages.exclus || [];
  const tousCreneaux = construireCreneaux(cours, { fuseau, dureeSeance, exclus });
  const creneaux = tousCreneaux.filter((c) => v.classes[c.code] && !v.classes[c.code].masquee);
  const inconnus = [...new Set(tousCreneaux.filter((c) => !v.classes[c.code]).map((c) => c.code))];
  const maintenant = new Date();
  const auj = aujourdhui(fuseau);
  const plan = planifier(v, creneaux, { auj, maintenant, delaiAnnonce: Number(v.reglages.annonceJours) || 7 });
  const etablissement = cours.filter((c) => c.type === 'etablissement');
  memo = {
    v, fuseau, cours, creneaux, tousCreneaux, inconnus, plan, auj, maintenant, dureeSeance, etablissement,
    coupures: coupures(cours, tousCreneaux),
    perso: etat.local.persoVisible ? persoUtiles(etat.brut.perso || [], { creneaux: tousCreneaux, etablissement, v }) : [],
  };
  return memo;
}

export const nomClasse = (code, v = calc().v) => (v.classes[code] && v.classes[code].nom) || code;
export const niveauClasse = (code, v = calc().v) => (v.classes[code] && v.classes[code].niveau) || niveauDe(code, nomClasse(code, v));

/** Variable CSS de couleur d'un niveau : choisie dans les réglages, sinon celle du thème. */
export function couleurNiveau(niveau, v = calc().v) {
  // La couleur choisie pour Google Agenda (mise en route) vaut aussi dans le Carnet : une seule par niveau.
  const perso = (v.reglages.couleurs && v.reglages.couleurs[niveau]) || (v.reglages.ecriture && v.reglages.ecriture.couleurs && v.reglages.ecriture.couleurs[niveau]);
  return perso || `var(--n-${niveau || 'Autre'})`;
}

/** Les classes que Pronote fait apparaître, avec de quoi les présenter au démarrage. */
export function classesDetectees() {
  const { cours, fuseau } = calc();
  const noms = deduireNoms(cours);
  const par = {};
  for (const c of cours) {
    if (c.type !== 'cours') continue;
    const x = (par[c.code] ||= { code: c.code, nom: noms[c.code] || c.code, cours: 0, demi: false, inclusions: new Set(), matieres: new Set(), semaines: new Set() });
    x.cours++;
    if (c.demi) x.demi = true;
    (c.inclusions || []).forEach((i) => x.inclusions.add(i));
    if (c.matiere) x.matieres.add(c.matiere);
    x.semaines.add(lundiDe(jourDe(c.debut, fuseau)));
  }
  return Object.values(par).map((x) => ({
    code: x.code, nom: x.nom, niveau: niveauDe(x.code, x.nom), demi: x.demi,
    inclusions: [...x.inclusions], matieres: [...x.matieres],
    parSemaine: Math.round((x.cours / Math.max(1, x.semaines.size)) * 10) / 10 || x.cours,
  })).sort((a, b) => a.niveau.localeCompare(b.niveau) || a.nom.localeCompare(b.nom));
}

<script type="text/x-carnet-module" data-module="carnet/js/stockage.js">
// Mémoire de l'appareil : IndexedDB quand il est disponible, sinon la mémoire de la page
// (navigation privée, aperçu intégré, données de site bloquées). Rien ne casse sans stockage :
// l'appli fonctionne, elle oublie seulement en se fermant — et le dit.

const BASE = 'carnet-de-bord', MAGASIN = 'kv';
let base = null, enMemoire = null;

function ouvrir() {
  if (base) return base;
  base = new Promise((ok) => {
    try {
      if (!('indexedDB' in globalThis)) throw new Error('pas d’IndexedDB');
      const req = indexedDB.open(BASE, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(MAGASIN);
      req.onsuccess = () => ok(req.result);
      req.onerror = () => ok(null);
      req.onblocked = () => ok(null);
    } catch { ok(null); }
  });
  return base;
}

const memoire = () => (enMemoire ||= new Map());

export async function stockageDurable() {
  return !!(await ouvrir());
}

export async function lire(cle) {
  const db = await ouvrir();
  if (!db) return memoire().get(cle);
  return new Promise((ok) => {
    try {
      const r = db.transaction(MAGASIN).objectStore(MAGASIN).get(cle);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ok(undefined);
    } catch { ok(memoire().get(cle)); }
  });
}

export async function ecrire(cle, valeur) {
  const db = await ouvrir();
  if (!db) { memoire().set(cle, valeur); return; }
  return new Promise((ok) => {
    try {
      const t = db.transaction(MAGASIN, 'readwrite');
      t.objectStore(MAGASIN).put(valeur, cle);
      t.oncomplete = () => ok();
      t.onerror = () => { memoire().set(cle, valeur); ok(); };
    } catch { memoire().set(cle, valeur); ok(); }
  });
}

/**
 * Lit, fusionne et réécrit dans une seule transaction : deux fenêtres du Carnet ouvertes en même
 * temps (l'appli installée et un onglet) ne s'écrasent plus l'une l'autre. Rend la valeur écrite.
 */
export async function fusionnerEcrire(cle, valeur, fusion) {
  const db = await ouvrir();
  if (!db) { const v = fusion(memoire().get(cle), valeur); memoire().set(cle, v); return v; }
  return new Promise((ok) => {
    try {
      const t = db.transaction(MAGASIN, 'readwrite'), magasin = t.objectStore(MAGASIN);
      let ecrit = valeur;
      const r = magasin.get(cle);
      r.onsuccess = () => { ecrit = fusion(r.result, valeur); magasin.put(ecrit, cle); };
      t.oncomplete = () => ok(ecrit);
      t.onerror = () => { memoire().set(cle, valeur); ok(valeur); };
    } catch { memoire().set(cle, valeur); ok(valeur); }
  });
}

export async function effacerTout() {
  enMemoire = new Map();
  const db = await ouvrir();
  if (!db) return;
  return new Promise((ok) => {
    try {
      const t = db.transaction(MAGASIN, 'readwrite');
      t.objectStore(MAGASIN).clear();
      t.oncomplete = () => ok();
      t.onerror = () => ok();
    } catch { ok(); }
  });
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/google.js">
// Google : connexion (Google Identity Services, jeton d'accès dans le navigateur, sans serveur),
// Agenda (lecture des agendas, écriture des cours dans les agendas créés par l'appli, et des
// rendez-vous perso quand on les crée, modifie ou supprime dans le Carnet) et Drive (un fichier
// caché, propre à l'appli, pour retrouver ses données sur chaque appareil).
//
// Autorisations demandées :
//   calendar.calendarlist.readonly  voir la liste des agendas (pour trouver celui de Pronote)
//   calendar.events                 lire les cours et les rendez-vous ; modifier un rendez-vous
//                                   perso, mais seulement quand on le fait soi-même dans le Carnet
//   calendar.app.created            créer SES agendas « Carnet », leur donner une couleur, y écrire
//   drive.appdata                   un dossier caché, propre à l'appli, invisible dans Drive
// Le jeton vit en mémoire, une heure ; il n'est jamais écrit sur l'appareil.
import { CONFIG } from 'carnet/config.js';
import { chargerScript } from 'carnet/js/ui.js';
import { installee, surAndroid, adresseAppli } from 'carnet/js/installation.js';

export const PORTEES = [
  'openid', 'email',
  'https://www.googleapis.com/auth/calendar.calendarlist.readonly',
  'https://www.googleapis.com/auth/calendar.events',
  'https://www.googleapis.com/auth/calendar.app.created',
  'https://www.googleapis.com/auth/drive.appdata',
];
const CAL = 'https://www.googleapis.com/calendar/v3';
const DRIVE = 'https://www.googleapis.com/drive/v3';
const DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3';

let jeton = null, expiration = 0, manquantes = [];

export class ErreurGoogle extends Error {
  constructor(code, message, statut) { super(message); this.code = code; this.statut = statut; }

export const googleConfigure = () => !!CONFIG.googleClientId;
export const connecte = () => !!jeton && Date.now() < expiration - 60000;

export const PORTEE_EVENEMENTS = 'https://www.googleapis.com/auth/calendar.events';
export const peutModifierRendezVous = () => connecte() && !manquantes.includes(PORTEE_EVENEMENTS);
export function oublierJeton() { jeton = null; expiration = 0; }

const CLE_RETOUR = 'carnet-connexion-google', CLE_METHODE = 'carnet-methode-connexion';
const lireLocal = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const ecrireLocal = (k, v) => {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { /* stockage refusé */ }
};

/**
 * Comment se connecter. Dans un onglet, et dans l'appli installée sur ordinateur, une fenêtre
 * Google s'ouvre par-dessus le Carnet. Dans l'appli installée sur Android, une telle fenêtre revient
 * mal : la page part plutôt chez Google, puis revient (« redirection »). Si l'une coince, on peut
 * choisir l'autre (le choix est gardé sur l'appareil).
 */
export function methodeConnexion() {
  const m = lireLocal(CLE_METHODE) || CONFIG.connexion;
  if (m === 'fenetre' || m === 'redirection') return m;
  return installee() && surAndroid() ? 'redirection' : 'fenetre';
}

/**
 * Se connecter. En fenêtre : à appeler pendant un geste de l'utilisateur (sinon le navigateur la
 * bloque), et la promesse rend la main une fois connecté. En redirection : la page part chez Google
 * et la promesse ne rend jamais la main ; au retour, retourDeGoogle() dit quoi faire (`suite`).
 */
export async function connecter({ consentement = false, indice, suite = 'synchro' } = {}) {
  if (!googleConfigure()) throw new ErreurGoogle('non-configure', "La connexion Google n'est pas encore configurée pour cette adresse.");
  if (methodeConnexion() === 'redirection') return rediriger({ consentement, indice, suite });

  if (!g || !g.accounts || !g.accounts.oauth2) throw new ErreurGoogle('gis', 'Le service de connexion Google ne répond pas.');
  return new Promise((ok, ko) => {
    const client = g.accounts.oauth2.initTokenClient({
      client_id: CONFIG.googleClientId,
      scope: PORTEES.join(' '),
      include_granted_scopes: true,
      prompt: consentement ? 'consent' : '',

      callback: (r) => {
        if (!r || r.error) { ko(new ErreurGoogle(r && r.error || 'refus', (r && (r.error_description || r.error)) || 'Connexion refusée.')); return; }
        jeton = r.access_token;

        manquantes = PORTEES.filter((p) => p.startsWith('https://') && !g.accounts.oauth2.hasGrantedAllScopes(r, p));
        ok({ manquantes });
      },
      error_callback: (e) => ko(new ErreurGoogle((e && e.type) || 'fenetre', e && e.type === 'popup_failed_to_open'
        ? 'Le navigateur a bloqué la fenêtre de connexion Google : autorisez les fenêtres pour cette page.'
        : 'Fenêtre de connexion fermée.')),
    });

  });
}

function rediriger({ consentement, indice, suite }) {
  const etat = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join('');
  ecrireLocal(CLE_RETOUR, JSON.stringify({ etat, suite, le: Date.now() }));
  const p = new URLSearchParams({
    client_id: CONFIG.googleClientId,
    redirect_uri: adresseAppli(),
    response_type: 'token',
    scope: PORTEES.join(' '),
    include_granted_scopes: 'true',
    state: etat,
  });
  if (consentement) p.set('prompt', 'consent');
  if (indice) p.set('login_hint', indice);
  location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${p}`);
  return new Promise(() => {}); // la page s'en va chez Google
}

/**
 * Au démarrage : la page revient-elle de chez Google (#access_token=… ou #error=…) ? Si oui, garde
 * le jeton en mémoire, retire tout de suite le jeton de l'adresse, et renvoie { suite, manquantes }
 * ou { suite, erreur }. Sinon, null. Un retour qui ne porte pas le numéro tiré au départ (state)
 * est refusé : il ne vient pas d'une connexion lancée par ce Carnet.
 */
export function retourDeGoogle() {
  const h = location.hash.slice(1);
  if (!/(^|&)(access_token|error)=/.test(h)) return null;
  const p = new URLSearchParams(h);
  let attendu = null;
  try { attendu = JSON.parse(lireLocal(CLE_RETOUR) || 'null'); } catch { attendu = null; }
  ecrireLocal(CLE_RETOUR, null);

export function deconnecter() {

  if (jeton && g && g.accounts && g.accounts.oauth2) { try { g.accounts.oauth2.revoke(jeton, () => {}); } catch { /* déjà révoqué */ } }

export const attendre = (ms) => new Promise((r) => setTimeout(r, ms));

// Les refus de Google qui veulent dire « pas si vite » : on peut réessayer un peu plus tard.
const LIMITE = /rate ?limit|usage ?limits?|quota/i;
export const estLimite = (e) => !!e && (e.statut === 429 || (e.statut === 403 && LIMITE.test(e.message || '')));

async function api(url, { methode = 'GET', corps, params, brut, type } = {}) {
  if (!connecte()) throw new ErreurGoogle('jeton', 'La connexion Google a expiré.');
  const u = new URL(url);

  for (let essai = 0; ; essai++) {

      method: methode,

      body: corps == null ? undefined : (brut ? corps : JSON.stringify(corps)),

    if (limite && essai < 3) { await attendre(700 * 2 ** essai + Math.random() * 300); continue; }
    if (!r.ok) {

  }

async function toutesLesPages(url, params, cle = 'items') {
  const res = [];
  let page;
  for (let n = 0; n < 40; n++) {
    const r = await api(url, { params: { ...params, pageToken: page } });
    res.push(...((r && r[cle]) || []));

// ---------- Compte ----------
export async function compte() {
  try { const r = await api('https://www.googleapis.com/oauth2/v3/userinfo'); return { email: r && r.email }; } catch { return { email: null }; }
}

// ---------- Agenda ----------
export async function listerAgendas() {
  const { elements } = await toutesLesPages(`${CAL}/users/me/calendarList`, { maxResults: 250 });
  return elements.map((c) => ({
    id: c.id, nom: c.summaryOverride || c.summary || c.id, description: c.description || '',
    couleur: c.backgroundColor || '', role: c.accessRole, principal: !!c.primary, cache: !!c.hidden, selectionne: c.selected !== false,
  }));

export async function listerEvenements(id, { timeMin, timeMax, prive } = {}) {

    timeMin, timeMax, singleEvents: 'true', orderBy: 'startTime', maxResults: 2500, showDeleted: 'false',
    ...(prive ? { privateExtendedProperty: prive } : {}),

export const creerAgenda = (nom, description, fuseau) => api(`${CAL}/calendars`, { methode: 'POST', corps: { summary: nom, description, timeZone: fuseau } });
export const colorerAgenda = (id, fond, texte = '#ffffff') => api(`${CAL}/users/me/calendarList/${encodeURIComponent(id)}`, {
  methode: 'PATCH', params: { colorRgbFormat: 'true' }, corps: { backgroundColor: fond, foregroundColor: texte, selected: true },

export const supprimerAgenda = (id) => api(`${CAL}/calendars/${encodeURIComponent(id)}`, { methode: 'DELETE' });
/** Renomme un agenda créé par l'appli : c'est ainsi qu'on réutilise un agenda vide plutôt que d'en créer un. */
export const renommerAgenda = (id, nom) => api(`${CAL}/calendars/${encodeURIComponent(id)}`, { methode: 'PATCH', corps: { summary: nom } });

export const remplacerEvenement = (cal, id, corps) => api(`${CAL}/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(id)}`, { methode: 'PUT', params: { sendUpdates: 'none' }, corps });
/** Ne change que les champs donnés : un rendez-vous garde ses invités, ses rappels, sa visio. */
export const modifierEvenement = (cal, id, champs) => api(`${CAL}/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(id)}`, { methode: 'PATCH', params: { sendUpdates: 'none' }, corps: champs });
export async function supprimerEvenement(cal, id) {

  catch (e) { if (e.code !== 'absent') throw e; }

// ---------- Drive : dossier caché de l'appli ----------
export async function trouverFichier(nom) {
  const r = await api(`${DRIVE}/files`, { params: { spaces: 'appDataFolder', q: `name='${nom}' and trashed=false`, fields: 'files(id,name,modifiedTime)', pageSize: 10 } });
  const f = (r && r.files) || [];
  return f.sort((a, b) => String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0] || null;
}
export const lireFichier = (id) => api(`${DRIVE}/files/${encodeURIComponent(id)}`, { params: { alt: 'media' } });
export async function creerFichier(nom, contenu) {
  const bord = `carnet${Math.random().toString(36).slice(2)}`;
  const corps = [
    `--${bord}`, 'Content-Type: application/json; charset=UTF-8', '', JSON.stringify({ name: nom, parents: ['appDataFolder'], mimeType: 'application/json' }),
    `--${bord}`, 'Content-Type: application/json; charset=UTF-8', '', JSON.stringify(contenu), `--${bord}--`, '',
  ].join('\r\n');
  return api(`${DRIVE_UP}/files`, { methode: 'POST', params: { uploadType: 'multipart', fields: 'id,modifiedTime' }, corps, brut: true, type: `multipart/related; boundary=${bord}` });

export const ecrireFichier = (id, contenu) => api(`${DRIVE_UP}/files/${encodeURIComponent(id)}`, {
  methode: 'PATCH', params: { uploadType: 'media', fields: 'id,modifiedTime' }, corps: JSON.stringify(contenu), brut: true, type: 'application/json; charset=UTF-8',
});

/** Exécute des tâches asynchrones, n à la fois. */
export async function parPaquets(taches, n = 4, surProgres) {
  let i = 0, faites = 0;
  const erreurs = [];
  const ouvrier = async () => {
    while (i < taches.length) {
      const t = taches[i++];
      try { await t(); } catch (e) { erreurs.push(e); if (e.code === 'jeton') throw e; }
      faites++;
      if (surProgres) surProgres(faites, taches.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(n, taches.length) }, ouvrier));
  return erreurs;
}
