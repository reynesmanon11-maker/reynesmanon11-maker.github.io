    const fa = (calc().v.classes[autre] || {}).file || [];
    if (fa.some((it) => it.eid === eid)) continue;
    const ka = reperes.apres ? fa.findIndex((it) => it.eid === reperes.apres) : -1;
    const kb = ka < 0 && reperes.avant ? fa.findIndex((it) => it.eid === reperes.avant) : -1;
    insererDans(autre, eid, ka >= 0 ? fa[ka].u : kb >= 0 && kb + 1 < fa.length ? fa[kb + 1].u : null);
  }
  if (!enFermant) fermerFeuille();
  const et = aussi.length ? ` et pour ${aussi.map((k) => nomClasse(k)).join(', ')}` : '';
  const pre = enFermant ? 'Enregistré en fermant : ' : '';
  const maj = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  if (nouvelle && jour) { toast(maj(`${pre}étape prévue pour le cours du ${dateCourte(jour)}${et} ; la suite glisse d'un cran.`)); return; }
  const seule = separer ? ` pour la ${[code, ...pour].map((k) => nomClasse(k)).join(', ')} seulement` : '';
  toast(maj(pre + (nouvelle ? `étape ajoutée${et}.` : aussi.length ? `étape enregistrée${seule}, ajoutée aussi pour ${aussi.map((k) => nomClasse(k)).join(', ')}.` : `étape enregistrée${seule}.`)));
}
// Retirer une étape ne touche que la classe ouverte : les autres classes du niveau la gardent.
actions['etape-supprimer'] = (el) => {
  if (!edition) return;
  if (el.dataset.confirme !== '1') { el.dataset.confirme = '1'; el.textContent = `Retirer de la ${nomClasse(edition.code)} ? Toucher encore`; return; }
  const { code, u } = edition;
  edition.fait = true; // pas d'enregistrement en fermant : on retire
  fermerFeuille();
  retirerEtape(code, u);
};

const deplacerEtape = (code, i, sens) => modifierDoc(`classes/${code}`, (cl) => {
  const j = i + sens;
  if (j < 0 || j >= cl.file.length) return;
  [cl.file[i], cl.file[j]] = [cl.file[j], cl.file[i]];
});
actions['etape-monter'] = (el) => deplacerEtape(el.dataset.code, Number(el.dataset.i), -1);
actions['etape-descendre'] = (el) => deplacerEtape(el.dataset.code, Number(el.dataset.i), 1);
actions['etape-retirer'] = (el) => {
  if (el.dataset.confirme !== '1') { el.dataset.confirme = '1'; el.innerHTML = 'Retirer ?'; setTimeout(() => { if (el.isConnected) { el.dataset.confirme = ''; el.innerHTML = String(icone('croix')); } }, 3000); return; }
  retirerEtape(el.dataset.code, el.dataset.u);
};
// Reprendre la suite d'une autre classe : les étapes se placent juste après l'étape commune.
actions['suite-reprendre'] = (el) => {
  const { code, apres } = el.dataset, eids = el.dataset.eids.split(',').filter(Boolean);
  const file = (calc().v.classes[code] || {}).file || [];
  const k = file.findIndex((it) => it.eid === apres);
  const avantU = k >= 0 && k + 1 < file.length ? file[k + 1].u : null;
  for (const eid of eids) insererDans(code, eid, avantU);
  toast(`${eids.length > 1 ? `${eids.length} étapes reprises` : 'Étape reprise'} pour la ${nomClasse(code)} : chaque classe garde ensuite sa version.`);
};
actions['suite-refuser'] = (el) => {
  const { code } = el.dataset, eids = el.dataset.eids.split(',').filter(Boolean);
  modifierDoc(`classes/${code}`, (cl) => { cl.refusees = [...new Set([...(cl.refusees || []), ...eids])]; });
  toast(`La ${nomClasse(code)} ne vous le proposera plus.`);
};

/** Retire l'étape de la file d'une classe seulement ; « Annuler » la remet à sa place. Le texte de l'étape n'est jamais effacé. */
function retirerEtape(code, u) {
  const avant = structuredClone((calc().v.classes[code] || {}).file || []);
  modifierDoc(`classes/${code}`, (cl) => { cl.file = (cl.file || []).filter((it) => it.u !== u); });
  toast(`Étape retirée de la ${nomClasse(code)} (les autres classes la gardent).`, { action: { libelle: 'Annuler', faire: () => modifierDoc(`classes/${code}`, (cl) => { cl.file = avant; }) } });
}
changements['etape-reprendre'] = (el) => {
  if (!el.value) return;
  const eid = el.value, code = el.dataset.code;
  modifierDoc(`classes/${code}`, (cl) => { cl.file = [...(cl.file || []), { u: nouvelId('u'), eid }]; });
  toast('Étape ajoutée à la fin de la file.');
};

// Même file pour une autre classe du niveau : on garde ce qu'elle a déjà, on ajoute ce qui manque, dans l'ordre.
actions['file-copier'] = (el) => {
  const code = el.dataset.code, c = calc();
  const autres = Object.keys(c.v.classes).filter((k) => k !== code && c.v.classes[k].niveau === c.v.classes[code].niveau);
  ouvrirFeuille(() => ({
    titre: `La file de la ${nomClasse(code)} pour…`,
    corps: html`<p class="aide">Les étapes absentes sont ajoutées dans le même ordre. Les validations déjà faites ne bougent pas.</p>
      ${autres.map((k) => html`<label class="coche"><input type="checkbox" name="cible" value="${k}" checked><span>${nomClasse(k)}</span></label>`)}`,
    pied: html`<button class="btn" data-action="fermer-feuille">Annuler</button><button class="btn plein" data-action="file-copier-ok" data-code="${code}">Appliquer</button>`,
  }));
};
actions['file-copier-ok'] = (el) => {
  const c = calc(), source = c.v.classes[el.dataset.code].file || [];
  const cibles = [...document.querySelectorAll('dialog.feuille input[name="cible"]:checked')].map((x) => x.value);
  for (const k of cibles) {
    modifierDoc(`classes/${k}`, (cl) => {
      const existants = new Map((cl.file || []).map((it) => [it.eid, it]));
      cl.file = source.map((it) => existants.get(it.eid) || { u: nouvelId('u'), eid: it.eid });
      for (const it of cl.file) existants.delete(it.eid);
      cl.file.push(...existants.values());
    });
  }
  fermerFeuille();
  toast(`File appliquée à ${cibles.length} classe${cibles.length > 1 ? 's' : ''}.`);
};

// Point de départ : où en était la classe quand le suivi a commencé.
actions['classe-depart'] = (el) => {
  const code = el.dataset.code;
  ouvrirFeuille(() => {
    const c = calc(), cl = c.v.classes[code], file = (cl.file || []).filter((it) => c.v.etapes[it.eid]);
    const actuel = cl.depart ? file.findIndex((it) => it.u === cl.depart.u) : 0;
    return {
      titre: `Point de départ · ${nomClasse(code)}`,
      corps: html`<p class="aide">Pour une classe reprise en cours d'année : la première étape PAS encore faite au début du suivi. Les validations de cours, elles, priment toujours.</p>
        <div class="liste">${file.map((it, i) => html`<label class="coche"><input type="radio" name="depart" value="${i}"${i === Math.max(0, actuel) ? ' checked' : ''}><span>${c.v.etapes[it.eid].titre}</span></label>`)}
        <label class="coche"><input type="radio" name="depart" value="${file.length}"${actuel >= file.length ? ' checked' : ''}><span>Toute la file était déjà faite</span></label></div>`,
      pied: html`<button class="btn" data-action="fermer-feuille">Annuler</button><button class="btn plein" data-action="classe-depart-ok" data-code="${code}">Enregistrer</button>`,
    };
  });
};
actions['classe-depart-ok'] = (el) => {
  const code = el.dataset.code, c = calc();
  const file = (c.v.classes[code].file || []).filter((it) => c.v.etapes[it.eid]);
  const i = Number(document.querySelector('dialog.feuille input[name="depart"]:checked')?.value || 0);
  modifierDoc(`classes/${code}`, (cl) => { cl.depart = arretDe({ i, f: 0 }, file); });
  fermerFeuille();
  toast('Point de départ enregistré.');
};

// Fiche de la classe : nom, niveau, effectif, masquer.
actions['classe-modifier'] = (el) => {
  const code = el.dataset.code;
  ouvrirFeuille(() => {
    const cl = calc().v.classes[code];
    return {
      titre: `Classe ${code}`,
      corps: html`<form class="section-feuille" data-envoi="classe-enregistrer" data-code="${code}" id="form-classe">
        <div class="grille-champs">
          <label class="champ"><span>Nom affiché</span><input type="text" name="nom" value="${cl.nom || code}" required></label>
          <label class="champ"><span>Niveau</span><select name="niveau">${['6e', '5e', '4e', '3e', '2nde', '1re', 'Tle', 'Autre'].map((n) => html`<option${n === cl.niveau ? ' selected' : ''}>${n}</option>`)}</select></label>
          <label class="champ"><span>Effectif (pour les photocopies)</span><input type="number" name="effectif" min="0" max="60" value="${cl.effectif || ''}"></label>
        </div></form>`,
      pied: html`<button class="btn danger" data-action="classe-masquer" data-code="${code}">Ne plus suivre</button><button class="btn" data-action="fermer-feuille">Annuler</button><button class="btn plein" type="submit" form="form-classe">Enregistrer</button>`,
    };
  });
};
envois['classe-enregistrer'] = (f) => {
  const code = f.dataset.code;
  modifierDoc(`classes/${code}`, (cl) => { cl.nom = f.nom.value.trim() || code; cl.niveau = f.niveau.value; cl.effectif = Math.max(0, Number(f.effectif.value) || 0); });
  fermerFeuille();
  toast('Classe enregistrée.');
};
actions['classe-masquer'] = (el) => { modifierDoc(`classes/${el.dataset.code}`, (cl) => { cl.masquee = true; }); fermerFeuille(); toast('Classe masquée. Elle reste récupérable en bas de la page.'); };
actions['classe-afficher'] = (el) => modifierDoc(`classes/${el.dataset.code}`, (cl) => { cl.masquee = false; });
actions['classe-ajouter'] = () => {
  const c = calc();
  const libres = c.inconnus;
  ouvrirFeuille(() => ({
    titre: 'Ajouter une classe',
    corps: html`${libres.length ? html`<p>Pronote montre ces classes, pas encore suivies :</p><div class="outils">${libres.map((k) => html`<button class="btn" data-action="suivre-classe" data-code="${k}">${icone('plus')} ${k}</button>`)}</div>` : html`<p class="aide">Toutes les classes de l'emploi du temps sont déjà suivies.</p>`}
      <p class="aide">Une classe n'apparaît ici que si elle a des cours dans l'emploi du temps lu.</p>`,
  }));
};
// Suivre les classes que Pronote montre, ou ne plus les proposer.
export function suivre(codes) {
  const detectees = classesDetectees();
  for (const code of codes) {
    if (calc().v.classes[code]) { modifierDoc(`classes/${code}`, (cl) => { cl.masquee = false; }); continue; }
    const d = detectees.find((x) => x.code === code) || { nom: code, niveau: niveauDe(code) };
    ecrireDoc(`classes/${code}`, { code, nom: d.nom, niveau: d.niveau, effectif: 0, file: [], annonces: {} });
  }
}
actions['suivre-classe'] = (el) => { suivre([el.dataset.code]); fermerFeuille(); toast(`${el.dataset.code} est suivie : ajoutez-lui des étapes.`); };
actions['suivre-toutes'] = () => { const l = calc().inconnus; suivre(l); toast(`${l.length} classe(s) suivie(s).`); };
actions['ignorer-inconnues'] = () => {
  const l = calc().inconnus;
  modifierReglages((r) => { r.exclus = [...new Set([...(r.exclus || []), ...l])]; });
  toast('Ces cours ne seront plus proposés (réversible dans les réglages).');
};
export { redessinerFeuille };
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/taches.js">
// Mes travaux : les tâches écrites à la main, et ce que le Carnet déduit tout seul de la progression
// (cours à valider, cours sans contenu, évaluations à annoncer, photocopies).
import { actions, envois } from 'carnet/js/actions.js';
import { html, icone, toast } from 'carnet/js/ui.js';
import { calc, ecrireDoc, supprimerDoc, nomClasse } from 'carnet/js/etat.js';
import { dateCourte, jourRelatif, ajouteJours } from 'carnet/js/dates.js';
import { aPreparer, seancesLisible } from 'carnet/js/moteur.js';
import { nouvelId } from 'carnet/js/donnees.js';
import { pastille } from 'carnet/js/vues/commun.js';

export function rendreTaches() {
  const c = calc();
  const toutes = Object.entries(c.v.taches).map(([id, t]) => ({ id, ...t }));
  const tri = (a, b) => String(a.pour || '9999').localeCompare(String(b.pour || '9999')) || String(a.cree || '').localeCompare(String(b.cree || ''));
  const aFaire = toutes.filter((t) => !t.fait).sort(tri), faites = toutes.filter((t) => t.fait).sort(tri);
  const ligne = (t) => html`<li class="tache-ligne">
    <label class="coche${t.fait ? ' faite' : ''}"><input type="checkbox" data-change="tache-faite" data-id="${t.id}"${t.fait ? ' checked' : ''}><span>${t.texte}
      ${t.classe || t.pour ? html`<br><span class="aide">${t.classe ? nomClasse(t.classe) : ''}${t.classe && t.pour ? ' · ' : ''}${t.pour ? html`<span class="${!t.fait && t.pour < c.auj ? 'retard' : ''}">pour ${jourRelatif(t.pour, c.auj)}</span>` : ''}</span>` : ''}</span></label>
    <span class="mini-outils"><button data-action="tache-supprimer" data-id="${t.id}" aria-label="Supprimer « ${t.texte} »">${icone('corbeille')}</button></span></li>`;

  const aValider = c.creneaux.filter((x) => (c.plan.parCreneau[x.cle] || {}).aValider);
  const limite = ajouteJours(c.auj, 14);
  const vides = c.creneaux.filter((x) => x.fin > c.maintenant && x.jour <= limite && ((c.plan.parCreneau[x.cle] || {}).libre || 0) > 0.01);
  const annonces = c.creneaux.filter((x) => x.jour >= c.auj).flatMap((x) => (c.plan.annonces[x.cle] || []).map((a) => ({ x, a })));
  const prep = aPreparer(c.v, c.plan, c.creneaux, { auj: c.auj, jours: 7 }).filter((p) => !(c.v.coches[p.id] && c.v.coches[p.id].fait));

  return html`
    <div class="titre-page"><div><h1>Mes travaux</h1><p>Vos tâches, et ce que le Carnet déduit de votre progression.</p></div></div>
    <div class="classes">
      <section class="carte"><h2>Mes tâches</h2>
        <form class="section-feuille" data-envoi="tache-ajouter" style="margin-top:10px">
          <input type="text" name="texte" id="tache-texte" placeholder="ex. demander les clés du labo" aria-label="Nouvelle tâche" autocomplete="off" required>
          <div class="grille-champs">
            <label class="champ"><span>Classe</span><select name="classe"><option value="">Toutes</option>${Object.keys(c.v.classes).sort().map((k) => html`<option value="${k}">${nomClasse(k)}</option>`)}</select></label>
            <label class="champ"><span>Pour le</span><input type="date" name="pour"></label>
          </div>
          <div><button class="btn plein" type="submit">${icone('plus')} Ajouter</button></div>
        </form>
        ${aFaire.length ? html`<ul class="liste" style="margin-top:12px">${aFaire.map(ligne)}</ul>` : html`<p class="vide" style="margin-top:12px">Rien en attente.</p>`}
        ${faites.length ? html`<details style="margin-top:12px"><summary class="aide">${faites.length} tâche${faites.length > 1 ? 's' : ''} faite${faites.length > 1 ? 's' : ''}</summary>
          <ul class="liste" style="margin-top:8px">${faites.map(ligne)}</ul><button class="btn mini" data-action="taches-effacer-faites" style="margin-top:8px">Effacer les tâches faites</button></details>` : ''}
      </section>
      <section class="carte"><h2>Déduit de la progression</h2>
        <div class="section-feuille" style="margin-top:10px">
          <h3 class="aide">Cours à valider (${aValider.length})</h3>
          ${aValider.length ? html`<div class="outils">${aValider.map((x) => html`<button class="btn mini" data-action="valider" data-cle="${x.cle}">${nomClasse(x.code)} · ${dateCourte(x.jour)}</button>`)}</div>` : html`<p class="vide petit">Tout est validé.</p>`}
          <h3 class="aide">Cours sans contenu d'ici deux semaines (${vides.length})</h3>
          ${vides.length ? html`<ul class="liste">${vides.map((x) => html`<li class="tache-ligne"><span>${dateCourte(x.jour)} ${pastille(x.code)} ${(c.plan.parCreneau[x.cle].libre >= 0.99) ? 'rien de prévu' : `reste ${seancesLisible(c.plan.parCreneau[x.cle].libre)}`}</span><a class="btn mini" href="#/classes/${x.code}">Préparer</a></li>`)}</ul>` : html`<p class="vide petit">Tout est prévu.</p>`}
          <h3 class="aide">Évaluations à annoncer (${annonces.length})</h3>
          ${annonces.length ? html`<ul class="liste">${annonces.map(({ x, a }) => html`<li class="annonce${a.tard ? ' tard' : ''}"><span>${pastille(a.code)} ${a.titre} (${dateCourte(a.jourEval)}) — ${a.tard ? 'dès' : ''} ${jourRelatif(x.jour, c.auj)}</span><button class="btn mini" data-action="annonce-faite" data-code="${a.code}" data-u="${a.u}">Fait</button></li>`)}</ul>` : html`<p class="vide petit">Rien à annoncer.</p>`}
          <h3 class="aide">À photocopier ou sortir cette semaine (${prep.length})</h3>
          ${prep.length ? html`<ul class="liste">${prep.map((p) => html`<li><label class="coche"><input type="checkbox" data-change="coche" data-id="${p.id}"><span>${dateCourte(p.jour)} · ${nomClasse(p.code)} — ${c.v.etapes[p.eid].titre}<br><span class="aide">${[p.pages ? (p.effectif ? `${p.effectif * p.pages} copies` : `${p.pages} p./élève`) : '', p.afaire].filter(Boolean).join(' · ')}</span></span></label></li>`)}</ul>` : html`<p class="vide petit">Rien.</p>`}
        </div>
      </section>
    </div>`;
}

envois['tache-ajouter'] = (f) => {
  const texte = f.texte.value.trim();
  if (!texte) return;
  ecrireDoc(`taches/${nouvelId('t')}`, { texte, classe: f.classe.value, pour: f.pour.value, fait: false, cree: new Date().toISOString() });
  f.reset();
  toast('Tâche ajoutée.');
};
actions['tache-supprimer'] = (el) => { supprimerDoc(`taches/${el.dataset.id}`); toast('Tâche supprimée.'); };
actions['taches-effacer-faites'] = () => {
  const faites = Object.entries(calc().v.taches).filter(([, t]) => t.fait);
  for (const [id] of faites) supprimerDoc(`taches/${id}`);
  toast(`${faites.length} tâche(s) effacée(s).`);
};
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/cahier.js">
// Le cahier de textes, rangé comme celui de Pronote : pour chaque cours, le contenu de la séance
// et le travail à faire pour le cours suivant, prêts à recopier. Le sens est Carnet → Pronote :
// Pronote n'exporte pas son cahier de textes (le lien iCal ne contient que l'emploi du temps), et
// le lire supposerait le mot de passe Pronote, que le Carnet ne demande jamais. Le texte suit donc
// ce qui a vraiment été fait : on dit où la classe s'est arrêtée (« Où en est-on ? »), puis on
// copie ; copier vaut « saisi », avec de quoi annuler.
import { actions } from 'carnet/js/actions.js';
import { html, icone, toast, copier } from 'carnet/js/ui.js';
import { calc, etat, changer, reglerLocal, ecrireDoc, supprimerDoc } from 'carnet/js/etat.js';
import { ajouteJours, dateCourte, dateLongue, jourMois, lundiDe } from 'carnet/js/dates.js';
import { semaineUtile } from 'carnet/js/moteur.js';
import { pastille, styleNiveau, horaires, textePronote, travailCours, etiquetteEtat } from 'carnet/js/vues/commun.js';

let lundiAffiche = null;

/** L'adresse de Pronote (réglée dans Mes données, ou devinée dans le lien iCal) : https://…/pronote/ */
export function adressePronote() {
  const r = calc().v.reglages;
  if (r.adressePronote) return r.adressePronote;
  const m = String((etat.local.ics && etat.local.ics.url) || '').match(/^(https:\/\/[^/?#]+\/pronote\/)/i);
  return m ? m[1] : '';
}
export const cleCahier = (cle) => `cdt_${cle}`;
export const estSaisi = (v, cle) => !!(v.coches[cleCahier(cle)] && v.coches[cleCahier(cle)].fait);

/** Les cours passés (ou commencés) dont le cahier de textes reste à saisir, du plus ancien au plus récent. */
export function cahiersNonSaisis() {
  const c = calc();
  const debut = c.v.reglages.debut || '0000-01-01';
  return c.creneaux.filter((cr) => {
    if (cr.annule || cr.debut > c.maintenant || cr.jour < debut || estSaisi(c.v, cr.cle)) return false;
    const pc = c.plan.parCreneau[cr.cle];
    return pc && (pc.etat === 'valide' || pc.etat === 'prevu') && (pc.segments || []).some((s) => !s.recul);
  }).sort((a, b) => a.debut - b.debut);
}

/** Le texte complet d'un cours : contenu, puis le travail à faire. */
export function texteCahier(cr, quoi = 'tout') {
  const contenu = textePronote(cr);
  const t = travailCours(cr);
  const travail = t ? `${t.pour ? `Pour le ${dateLongue(t.pour)} : ` : ''}${t.texte}` : '';
  if (quoi === 'contenu') return contenu;
  if (quoi === 'travail') return travail;
  return [contenu, travail ? `Travail à faire — ${travail}` : ''].filter(Boolean).join('\n\n');
}

export function ligneCahier(cr, { date = true } = {}) {
  const c = calc();
  const pc = c.plan.parCreneau[cr.cle] || {};
  const contenu = textePronote(cr);
  const t = travailCours(cr);
  const saisi = estSaisi(c.v, cr.cle);
  return html`<li class="cdt${saisi ? ' saisi' : ''}${cr.annule ? ' annule' : ''}" style="${styleNiveau(cr.code)}">
    <div class="cours-haut"><span class="heure">${date ? `${dateCourte(cr.jour)} · ` : ''}${horaires(cr)}</span>${pastille(cr.code)}${cr.salle ? html`<span>salle ${cr.salle}</span>` : ''}${etiquetteEtat(cr)}
      ${pc.aValider ? html`<span class="aide">contenu prévu, pas encore validé</span>` : ''}</div>
    ${cr.annule ? html`<p class="vide petit">${cr.statut || 'Cours annulé'}.</p>` : html`
    <div class="cdt-bloc"><h4>Contenu de la séance</h4>
      ${contenu ? html`<pre class="pronote-texte">${contenu}</pre>` : html`<p class="vide petit">Rien de prévu pour ce cours.</p>`}</div>
    ${t ? html`<div class="cdt-bloc"><h4>Travail à faire${t.pour ? html` pour le ${dateCourte(t.pour)}` : ''}</h4><pre class="pronote-texte">${t.texte}</pre></div>` : ''}
    <div class="cours-actions">
      ${pc.aValider ? html`<button class="btn mini plein" data-action="valider" data-cle="${cr.cle}">${icone('valider')} Où en est-on ?</button>` : ''}
      ${contenu ? html`<button class="btn mini${pc.aValider ? '' : ' plein'}" data-action="cdt-copier" data-cle="${cr.cle}" data-quoi="tout" title="Le contenu et le travail à faire, d'un coup">${icone('copier')} Copier pour Pronote</button>` : ''}
      ${contenu && t ? html`<button class="btn mini discret" data-action="cdt-copier" data-cle="${cr.cle}" data-quoi="contenu">Contenu seul</button><button class="btn mini discret" data-action="cdt-copier" data-cle="${cr.cle}" data-quoi="travail">Travail seul</button>` : ''}
      ${adressePronote() ? html`<a class="btn mini discret" href="${adressePronote()}" target="_blank" rel="noopener">${icone('ouvrir')} Ouvrir Pronote</a>` : ''}
      <label class="coche cdt-saisi"><input type="checkbox" data-change="coche" data-id="${cleCahier(cr.cle)}"${saisi ? ' checked' : ''}><span>Saisi dans Pronote</span></label>
    </div>`}
  </li>`;
}

function semaine() {
  const c = calc();
  if (!lundiAffiche) lundiAffiche = semaineUtile(c.tousCreneaux, c.auj);
  return lundiAffiche;
}

export function rendreCahier() {
  const c = calc();
  const vue = etat.local.vueCahier || 'a-saisir';
  const nonSaisis = cahiersNonSaisis();
  let corps;
  if (vue === 'a-saisir') {
    // Le plus récent d'abord : c'est celui qu'on saisit en sortant de cours.
    corps = nonSaisis.length
      ? html`<ul class="liste cdt-liste">${[...nonSaisis].reverse().map((cr) => ligneCahier(cr))}</ul>
        ${nonSaisis.length > 1 ? html`<div class="outils"><button class="btn mini discret" data-action="cdt-tout-saisi">${icone('valider')} Tout marquer comme saisi (${nonSaisis.length})</button></div>` : ''}`
      : html`<p class="vide">${icone('valider')} Tous les cahiers de textes sont saisis. Les prochains apparaîtront ici après chaque cours.</p>`;
  } else {
    const lundi = semaine();
    const jours = [0, 1, 2, 3, 4, 5].map((k) => ajouteJours(lundi, k));
    corps = html`<div class="semaine-outils">
        <button class="btn-rond" data-action="cdt-avant" aria-label="Semaine précédente">${icone('gauche')}</button>
        <h2>Semaine du ${jourMois(lundi)} au ${jourMois(ajouteJours(lundi, 4))}</h2>
        <button class="btn-rond" data-action="cdt-apres" aria-label="Semaine suivante">${icone('droite')}</button>
        ${lundi !== semaineUtile(c.tousCreneaux, c.auj) ? html`<button class="btn mini" data-action="cdt-auj">Revenir à cette semaine</button>` : ''}
      </div>
      ${jours.map((j) => {
        const crs = c.creneaux.filter((x) => x.jour === j).sort((a, b) => a.debut - b.debut);
        if (!crs.length) return '';
        return html`<section class="jour-cdt${j === c.auj ? ' auj' : ''}"><h3>${dateLongue(j)}</h3><ul class="liste cdt-liste">${crs.map((cr) => ligneCahier(cr, { date: false }))}</ul></section>`;
      })}
      ${jours.every((j) => !c.creneaux.some((x) => x.jour === j)) ? html`<p class="vide">Pas de cours suivi cette semaine.</p>` : ''}`;
  }
  return html`
    <div class="titre-page"><div><h1>Cahier de textes</h1><p>Après le cours : <b>Où en est-on ?</b> (le texte suit ce qui a vraiment été fait, même si la séance a débordé ou s'est arrêtée plus tôt), puis <b>Copier pour Pronote</b> et coller dans Pronote. Le texte s'écrit une fois par étape et vaut pour toutes les classes du niveau.</p></div></div>
    <div class="segmente" role="group" aria-label="Affichage">
      <button data-action="cdt-vue" data-vue="a-saisir" aria-pressed="${vue === 'a-saisir'}">Non saisis${nonSaisis.length ? ` (${nonSaisis.length})` : ''}</button>
      <button data-action="cdt-vue" data-vue="semaine" aria-pressed="${vue === 'semaine'}">Par semaine</button>
    </div>
    ${corps}
    <p class="aide">Le texte d'une étape se règle dans Progressions (crayon de l'étape) : « Texte pour le cahier de textes » et « Travail à faire ». Il vaut pour toutes les classes du niveau.</p>`;
}

actions['cdt-vue'] = (el) => reglerLocal({ vueCahier: el.dataset.vue });
// Pour repartir de zéro (ce qui a été saisi dans Pronote avant le Carnet) : un second toucher confirme.
actions['cdt-tout-saisi'] = (el) => {
  if (el.dataset.confirme !== '1') { el.dataset.confirme = '1'; el.textContent = 'Vraiment tout ? Toucher encore pour confirmer'; return; }
  const l = cahiersNonSaisis();
  for (const cr of l) ecrireDoc(`coches/${cleCahier(cr.cle)}`, { fait: true });
  toast(`${l.length} cours marqué${l.length > 1 ? 's' : ''} comme saisi${l.length > 1 ? 's' : ''}.`);
};
actions['cdt-avant'] = () => { lundiAffiche = ajouteJours(semaine(), -7); changer(); };
actions['cdt-apres'] = () => { lundiAffiche = ajouteJours(semaine(), 7); changer(); };
actions['cdt-auj'] = () => { lundiAffiche = null; changer(); };
actions['cdt-copier'] = async (el) => {
  const cr = calc().tousCreneaux.find((x) => x.cle === el.dataset.cle);
  if (!cr) return;
  const ok = await copier(texteCahier(cr, el.dataset.quoi), el.closest('.cdt')?.querySelector('.pronote-texte'));
  if (!ok) { toast('La copie a été refusée : le texte est sélectionné, faites Ctrl+C.'); return; }
  // Copier pour Pronote, c'est le saisir : le cours quitte la liste, « Annuler » l'y remet.
  const cle = cleCahier(cr.cle), deja = estSaisi(calc().v, cr.cle);
  if (el.dataset.quoi === 'tout' && !deja) {
    ecrireDoc(`coches/${cle}`, { fait: true });
    toast('Copié : collez-le dans Pronote. Marqué « saisi ».', { action: { libelle: 'Annuler', faire: () => supprimerDoc(`coches/${cle}`) } });
  } else toast('Copié : collez-le dans le cahier de textes de Pronote.');
};
export { lundiDe };
</script>

        <label class="champ"><span>Adresse de votre Pronote</span><input type="url" id="regler-pronote" value="${r.adressePronote || ''}" placeholder="https://…index-education.net/pronote/" data-change="regler-pronote"></label>

      <p class="aide">« Importer » accepte une sauvegarde du Carnet, l'export du « Carnet de bord SVT » de claude.ai, ou la progression d'un collègue. Les étapes et les validations importées remplacent celles d'ici ; vos réglages, et le nom et l'effectif de vos classes, restent.</p>
    </section>

    <section class="carte section-feuille"><h2>Ce que le Carnet fait de vos données</h2>
      <p class="aide"><a href="confidentialite.html">Règles de confidentialité complètes</a></p>
      <ul class="petit">
        <li>Il lit l'<b>emploi du temps</b> exporté par Pronote — jamais votre mot de passe, ni notes, ni élèves.</li>
        <li>Vos classes, étapes et validations restent <b>sur cet appareil</b>${mode === 'google' ? html` et dans un <b>dossier caché de votre Google Drive</b>, que seule l'appli peut lire` : ''}. Aucun serveur du Carnet ne les reçoit.</li>
        ${mode === 'google' ? html`<li>Dans Google Agenda, il <b>lit</b> les agendas choisis et écrit vos cours <b>dans les siens</b> (« Carnet · … »). Dans vos agendas perso, il ne change un rendez-vous que <b>quand vous le faites vous-même</b> dans le Carnet.</li>` : ''}
        <li>Aucune donnée d'élève n'est demandée ni stockée.</li>
      </ul>
    </section>
  </div>`;
}

const apparence = (patch) => {
  reglerLocal(patch);
  try { localStorage.setItem('carnet-apparence', JSON.stringify({ theme: etat.local.theme, accent: etat.local.accent, densite: etat.local.densite })); } catch { /* sans stockage */ }
};
actions['regler-theme'] = (el) => apparence({ theme: el.dataset.valeur });
actions['retirer-inutiles'] = async (el) => {
  if (!G.connecte()) { try { await G.connecter(); } catch (e) { toast(messageErreur(e)); return; } }
  el.disabled = true;
  try { const n = await retirerInutiles(); toast(`${n} agenda${n > 1 ? 's' : ''} supprimé${n > 1 ? 's' : ''}.`); } catch (e) { toast(messageErreur(e)); }
};
changements['regler-etablissement'] = (el) => modifierReglages((r) => { r.etablissement = el.value.trim(); });
changements['regler-nom'] = (el) => modifierReglages((r) => { r.nomAffiche = el.value.trim(); });
changements['regler-pronote'] = (el) => {
  const v = el.value.trim();
  if (v && !/^https:\/\//i.test(v)) { toast('L’adresse de Pronote commence par https://'); return; }
  modifierReglages((r) => { r.adressePronote = v; });
};
actions['regler-ab'] = (el) => {
  const c = calc();
  const lundi = semaineUtile(c.tousCreneaux, c.auj);
  modifierReglages((r) => { r.semaineAB = el.dataset.valeur ? { lundi, lettre: el.dataset.valeur } : null; });
};
actions['regler-accent'] = (el) => apparence({ accent: el.dataset.valeur });
actions['regler-densite'] = (el) => apparence({ densite: el.dataset.valeur });
export { apparence };

actions['synchro-forcee'] = async () => {
  if (!G.connecte()) { try { await G.connecter(); } catch (e) { toast(messageErreur(e)); return; } }
  await synchroniser();
};
actions['changer-source'] = () => { allerDemarrage('pronote', 'google'); location.hash = '#/demarrer'; };
actions['passer-google'] = () => { allerDemarrage('connexion', 'google'); location.hash = '#/demarrer'; };
actions['google-deconnecter'] = () => {
  G.deconnecter();
  reglerLocal({ mode: 'local', compte: null });
  definirSynchro('repos', '');
  toast('Déconnecté. Vos données restent sur cet appareil et dans votre Google Drive.');
};
actions['relire-ical'] = async () => {
  try { toast(`Emploi du temps relu : ${bilanLecture(await lireLienIcal(etat.local.ics.url))}`); } catch (e) { toast(e.message); }
};
changements['reimporter-ics'] = async (el) => {
  const f = el.files && el.files[0];
  if (!f) return;
  try { toast(bilanLecture(lireTexteIcal(await f.text()))); } catch (e) { toast(e.message); }
};

const ecriture = (patch) => { modifierReglages((r) => { r.ecriture = { ...(r.ecriture || {}), ...patch }; }); };
changements['ecriture-actif'] = (el) => ecriture({ actif: el.checked, parNiveau: (reglages().ecriture || {}).parNiveau !== false });
changements['ecriture-mode'] = (el) => ecriture({ parNiveau: el.value === 'niveau' });
changements['ecriture-eval'] = (el) => ecriture({ couleurEval: el.value });
changements['ecriture-rappel'] = (el) => ecriture({ rappel: Number(el.value) });
changements['ecriture-semaines'] = (el) => ecriture({ semaines: Number(el.value) });
changements['ecriture-etab'] = (el) => ecriture({ etablissement: el.checked });
actions['tout-retirer'] = (el) => {
  if (el.dataset.confirme !== '1') { el.dataset.confirme = '1'; el.textContent = 'Sûr ? Les agendas « Carnet » seront supprimés.'; return; }
  (async () => {
    if (!G.connecte()) { try { await G.connecter(); } catch (e) { toast(messageErreur(e)); return; } }
    try { await toutRetirer(); toast('Agendas du Carnet supprimés de Google Agenda.'); } catch (e) { toast(messageErreur(e)); }
  })();
};

changements['regler-debut'] = (el) => { if (el.value) modifierReglages((r) => { r.debut = el.value; }); };
changements['regler-duree'] = (el) => modifierReglages((r) => { r.dureeSeance = el.value ? Number(el.value) : null; });
changements['regler-annonce'] = (el) => modifierReglages((r) => { r.annonceJours = Number(el.value); });
actions['reprendre-exclus'] = () => modifierReglages((r) => { r.exclus = []; });

actions['exporter'] = () => {
  telecharger(`carnet-de-bord-${calc().auj}.json`, exporter(etat.docs));
  toast('Sauvegarde téléchargée.');
};
changements['importer'] = async (el) => {
  const f = el.files && el.files[0];
  if (!f) return;
  try {
    const { docs, origine } = importer(await f.text());
    importerDocs(docs);
    toast(origine === 'carnet-claude' ? 'Carnet SVT importé.' : 'Sauvegarde importée.');
  } catch (e) { toast(e.message); }
  el.value = '';
};
actions['tout-effacer'] = () => {
  ouvrirFeuille(() => ({
    titre: 'Tout effacer sur cet appareil ?',
    corps: html`<p>Classes, étapes, validations, tâches et réglages disparaîtront de <b>cet appareil</b>.</p>
      ${etat.local.mode === 'google' ? html`<p class="aide">La copie de votre Google Drive n'est pas touchée : en vous reconnectant, tout revient. Ni les agendas « Carnet » de Google.</p>` : html`<p class="aide">Pensez à « Sauvegarder (fichier) » d'abord si vous voulez les garder.</p>`}`,
    pied: html`<button class="btn" data-action="fermer-feuille">Annuler</button><button class="btn plein" data-action="tout-effacer-ok">Tout effacer</button>`,
  }));
};
actions['tout-effacer-ok'] = async () => {
  G.deconnecter();
  await effacerTout();
  try { localStorage.removeItem('carnet-apparence'); } catch { /* sans stockage */ }
  remplacerDocs({});
  definirBrut({ pronote: [], perso: [], agendas: {}, lu: null });
  reglerLocal({ mode: null, compte: null, ics: { url: '' }, disposition: null });
  fermerFeuille();
  location.hash = '#/demarrer';
};
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/demarrer.js">
// Mise en route, pas à pas : se connecter, trouver l'agenda Pronote, choisir ses classes, régler
// ce qui s'écrit dans Google Agenda, puis démarrer. Chaque écran dit ce qu'il fait et ce qu'il
// ne fait pas : c'est un collègue qui découvre l'outil qui le lit, pas son auteur.
import { actions, changements, envois } from 'carnet/js/actions.js';
import { html, icone, toast, ouvrirFeuille, fermerFeuille } from 'carnet/js/ui.js';
import { etat, calc, reglerLocal, remplacerDocs, fusionnerDocs, importerDocs, ecrireDoc, modifierReglages, reglages, definirBrut, classesDetectees, definirSynchro } from 'carnet/js/etat.js';
import { evenementsDemo, donneesDemo, validationsDemo } from 'carnet/js/demo.js';
import { importer } from 'carnet/js/donnees.js';
import { estLienIcal, estQrConnexionPronote } from 'carnet/js/pronote.js';
import { CONFIG } from 'carnet/config.js';
import { FUSEAU_APPAREIL, aujourdhui, lundiDe } from 'carnet/js/dates.js';
import * as G from 'carnet/js/google.js';
import { lireAgendas, agendasPronote, lireLienIcal, lireTexteIcal, bilanLecture, synchroniser, messageErreur, recupererDrive } from 'carnet/js/synchro.js';
import { COULEURS_NIVEAUX, COULEURS_EVENEMENT, DESCRIPTION_AGENDA } from 'carnet/js/agenda.js';
import { installation } from 'carnet/js/installation.js';
import { ouvrirImportProgression } from 'carnet/js/vues/programmation.js';

let etape = 'accueil';
let voie = null; // 'google' | 'local'
let attente = false; // false, 'fenetre' (Google est ouvert) ou 'lecture' (le Carnet lit les agendas)
const NUANCIER = ['#7cb342', '#8e24aa', '#e8b400', '#4fae7a', '#3faea6', '#2f7150', '#4f93d4', '#8f76cf', '#d56a97', '#a8660f', '#b15f2c', '#8a8f87'];

const PARCOURS = {
  google: ['Connexion', 'Agenda Pronote', 'Classes', 'Google Agenda', 'Vie perso', 'Progression'],
  local: ['Emploi du temps', 'Classes', 'Progression'],
};
const ETAPES = {
  google: ['connexion', 'pronote', 'classes', 'agenda', 'perso', 'progression'],
  local: ['source', 'classes', 'progression'],
};

function fil() {
  if (!voie) return '';
  const k = ETAPES[voie].indexOf(etape);
  return html`<p class="etapes-demarrage">${PARCOURS[voie].map((n, i) => html`<span${i === k ? ' aria-current="step"' : ''}>${i + 1}. ${n}</span>${i < PARCOURS[voie].length - 1 ? ' ›' : ''}`)}</p>`;
}

function ecranAccueil() {
  const google = G.googleConfigure();
  return html`<div class="titre-page"><div><h1>Carnet de bord</h1>
      <p>Votre emploi du temps Pronote, votre agenda perso et la progression de chaque classe, au même endroit — sur le téléphone comme sur l'ordinateur.</p></div></div>
    <div class="choix">
      <button data-action="demarrer-google" ${google ? '' : 'disabled'}>${icone('google')}<strong>Avec mon compte Google</strong>
        <span>${google ? "Le Carnet lit l'agenda Pronote que vous avez ajouté à Google Agenda, et y écrit chaque cours avec ce qui est prévu. Vos données vous suivent d'un appareil à l'autre." : 'Pas encore activé sur cette adresse.'}</span></button>
      <button data-action="demarrer-demo">${icone('organiser')}<strong>Essayer avec un exemple</strong>
        <span>Six classes fictives, des demi-groupes, une semaine de cours. Tout se touche, rien n'est envoyé nulle part.</span></button>
      <button data-action="demarrer-local">${icone('lien')}<strong>Sans compte Google</strong>
        <span>À partir du lien iCal de Pronote ou d'un fichier .ics. Les données restent sur cet appareil.</span></button>
    </div>
    ${google ? '' : html`<p class="aide">La connexion Google s'active une seule fois, par la personne qui publie le Carnet : <a href="brancher-google.html">comment l'activer</a>.</p>`}
    <p class="aide">Le Carnet ne demande jamais votre mot de passe Pronote et ne lit ni notes ni élèves : seulement l'emploi du temps que Pronote exporte. <a href="confidentialite.html">Confidentialité : ce que le Carnet fait de vos données</a>.</p>
    <p class="outils">${installation() ? html`<button class="btn" data-action="installer">${icone('telecharger')} Installer l'appli sur cet appareil</button>` : ''}
      <button class="btn" data-action="partager">${icone('partager')} L'ouvrir sur un téléphone, ou la partager</button></p>`;
}

function ecranConnexion() {
  return html`${fil()}<section class="carte section-feuille"><h2>Se connecter à Google</h2>
    <p>Le Carnet demandera à Google l'autorisation de :</p>
    <ul>
      <li><b>lire</b> vos agendas (dont celui de Pronote), et <b>modifier vos rendez-vous perso</b> quand vous les ajoutez, déplacez ou supprimez vous-même dans le Carnet — jamais tout seul, jamais l'agenda de Pronote ;</li>
      <li><b>créer ses propres agendas</b> « Carnet », leur donner une couleur et y écrire vos cours ;</li>
      <li>garder ses données dans un <b>dossier caché de votre Google Drive</b>, propre à l'appli.</li>
    </ul>
    <p class="aide">Tant que l'appli n'est pas vérifiée par Google, Google affiche l'adresse du site (${location.hostname}) au lieu de « Carnet de bord », puis prévient qu'il ne l'a pas validée : touchez « Paramètres avancés », puis « Accéder à ${location.hostname} (non sécurisé) ». Cochez ensuite toutes les autorisations.</p>
    ${CONFIG.phaseEssai !== false ? html`<p class="aide">Pendant la phase d'essai, la connexion est réservée aux adresses inscrites. Si Google affiche « Accès bloqué », envoyez votre adresse Gmail à ${CONFIG.responsable || 'la personne qui vous a donné le lien'}.</p>` : ''}
    <div>${attente === 'lecture'
      ? html`<button class="btn google" disabled>${icone('google')} Lecture de vos agendas…</button>`
      : html`<button class="btn google" data-action="google-connecter">${icone('google')} ${attente ? 'Recommencer la connexion' : 'Se connecter avec Google'}</button>`}</div>
    ${attente === 'fenetre' ? html`<p class="aide">La page de Google est ouverte : terminez-y la connexion. Fermée par erreur ? Recommencez.</p>` : ''}
    <p class="aide">${G.methodeConnexion() === 'redirection' ? 'Le Carnet va passer par la page de Google, puis revenir ici.' : "Une fenêtre Google va s'ouvrir par-dessus le Carnet."}
      Ça coince ? <button class="lien" data-action="connexion-autre-methode">Essayer l'autre façon</button></p>
  </section>`;
}

function noticeLienPronote() {
  return html`<ol class="notice">
    <li><span>Dans Pronote (espace professeur, sur ordinateur), ouvrez votre <b>emploi du temps</b>.</span></li>
    <li><span>Cliquez sur l'icône <b>iCal</b> (en haut à droite de la réglette des semaines), puis copiez le lien proposé. Sur l'application mobile, l'icône iCal est en bas à droite.</span></li>
    <li><span>Collez-le ci-dessous — ou scannez-le s'il s'affiche en QR code sur un autre écran.</span></li>
  </ol>
  <form class="ajout-tache" data-envoi="lien-pronote"><input type="url" name="lien" id="lien-pronote" placeholder="https://…index-education.net/pronote/ical/…" aria-label="Lien iCal de Pronote" autocomplete="off"><button class="btn plein" type="submit">OK</button></form>
  <div class="outils"><button class="btn" data-action="scanner-qr">${icone('qr')} Scanner un QR code</button></div>
  <p class="aide">Le QR code de connexion de l'application Pronote, lui, ouvre votre compte entier (notes, élèves) : le Carnet n'en a pas besoin et le refusera.</p>`;
}

function ecranPronote() {
  const agendas = Object.entries(etat.brut.agendas || {}).map(([id, a]) => ({ id, ...a }));
  const probables = agendasPronote(agendas);
  const choisi = (reglages().source || {}).agendaPronote || (probables[0] && probables[0].id) || '';
  return html`${fil()}<section class="carte section-feuille"><h2>Votre agenda Pronote</h2>
    ${probables.length ? html`<p>Le Carnet a trouvé ${probables.length > 1 ? 'ces agendas qui ressemblent' : 'cet agenda qui ressemble'} à un export Pronote :</p>
      <div class="liste">${probables.map((a) => html`<label class="coche"><input type="radio" name="agenda-pronote" value="${a.id}" data-change="choisir-pronote"${a.id === choisi ? ' checked' : ''}><span><b>${a.nom}</b><br><span class="aide">${a.description || a.id}</span></span></label>`)}</div>`
    : html`<div class="bandeau"><span><strong>Aucun agenda Pronote dans votre Google Agenda.</strong> Ajoutons-le : Google ira le relire tout seul plusieurs fois par jour.</span></div>${noticeLienPronote()}`}
    <details><summary class="aide">Choisir un autre agenda</summary>
      <select data-change="choisir-pronote" aria-label="Agenda Pronote" style="margin-top:8px"><option value="">—</option>${agendas.map((a) => html`<option value="${a.id}"${a.id === choisi ? ' selected' : ''}>${a.nom}</option>`)}</select></details>
    ${probables.length ? html`<details><summary class="aide">Mon agenda Pronote n'est pas dans la liste</summary>${noticeLienPronote()}</details>` : ''}
    <div class="outils"><button class="btn" data-action="google-relire" ${attente ? 'disabled' : ''}>${icone('synchro')} Chercher à nouveau</button>
      <button class="btn plein" data-action="pronote-ok" ${choisi ? '' : 'disabled'}>Continuer</button></div>
  </section>`;
}

function ecranSource() {
  return html`${fil()}<section class="carte section-feuille"><h2>Votre emploi du temps</h2>
    ${noticeLienPronote()}
    <p class="aide">Pronote n'autorise pas un site à lire ce lien directement : sans relais, seul l'import d'un fichier marche. Le fichier est une photo à l'instant T — il faudra le réimporter quand l'emploi du temps change. Avec un compte Google, la mise à jour est automatique.</p>
    <label class="btn">${icone('fichier')} Importer un fichier .ics<input type="file" accept=".ics,text/calendar" data-change="fichier-ics" class="visuellement-cache"></label>
  </section>`;
}

function ecranClasses() {
  const d = classesDetectees();
  const existantes = calc().v.classes;
  if (!d.length) {
    return html`${fil()}<section class="carte section-feuille"><h2>Vos classes</h2><p class="vide">Aucun cours trouvé dans cet emploi du temps pour l'instant.</p>
      <p class="aide">Un agenda tout juste ajouté à Google peut mettre quelques minutes à se remplir.</p>
      <div class="outils"><button class="btn" data-action="google-relire">${icone('synchro')} Relire</button><button class="btn plein" data-action="classes-ok">Continuer quand même</button></div></section>`;
  }
  return html`${fil()}<section class="carte section-feuille"><h2>Vos classes</h2>
    <p>Trouvées dans Pronote. Le nom affiché peut être changé ; l'effectif sert à compter les photocopies.</p>
    <form data-envoi="classes-ok" id="form-classes"><div class="defile-x"><table class="tableau-classes"><thead><tr><th>Suivre</th><th>Pronote</th><th>Nom affiché</th><th>Niveau</th><th>Effectif</th><th></th></tr></thead><tbody>
      ${d.map((x) => {
        const ex = existantes[x.code];
        return html`<tr><td><input type="checkbox" name="suivre" value="${x.code}" ${!ex || !ex.masquee ? 'checked' : ''} aria-label="Suivre ${x.code}"></td>
          <td>${x.code}</td>

          <td><select name="niveau-${x.code}" aria-label="Niveau de ${x.code}">${['6e', '5e', '4e', '3e', '2nde', '1re', 'Tle', 'Autre'].map((n) => html`<option${n === (ex ? ex.niveau : x.niveau) ? ' selected' : ''}>${n}</option>`)}</select></td>
          <td><input type="number" name="effectif-${x.code}" min="0" max="60" value="${ex && ex.effectif ? ex.effectif : ''}" style="width:5.5em" aria-label="Effectif de ${x.code}"></td>
          <td class="aide">${x.parSemaine} h/sem.${x.demi ? ' · ½ groupes' : ''}${x.inclusions.length ? ' · ULIS' : ''}</td></tr>`;

    <div class="outils" style="margin-top:12px"><button class="btn plein" type="submit">Continuer</button></div></form>

function ecranAgenda() {
  const e = reglages().ecriture || { actif: true, parNiveau: true };
  const mode = e.actif === false ? 'aucun' : e.parNiveau === false ? 'unique' : 'niveau';

  return html`${fil()}<section class="carte section-feuille"><h2>Ce que le Carnet écrit dans Google Agenda</h2>
    <p>Chaque cours, avec ce qui est prévu (« 503 · Activité 5 · reprendre à Protocole »). Touchez-le dans Google Agenda : un lien ouvre le Carnet sur ce cours.</p>
    <div class="liste">
      <label class="coche"><input type="radio" name="mode-ecriture" value="niveau" data-change="mode-ecriture"${mode === 'niveau' ? ' checked' : ''}><span><b>Un agenda par niveau</b>, chacun sa couleur<br><span class="aide">« Carnet · 6e », « Carnet · 5e »… et « Carnet · Établissement » pour les réunions.</span></span></label>
      <label class="coche"><input type="radio" name="mode-ecriture" value="unique" data-change="mode-ecriture"${mode === 'unique' ? ' checked' : ''}><span><b>Un seul agenda</b> « Carnet de bord »</span></label>
      <label class="coche"><input type="radio" name="mode-ecriture" value="aucun" data-change="mode-ecriture"${mode === 'aucun' ? ' checked' : ''}><span><b>Ne rien écrire</b> — le Carnet seulement</span></label>
    </div>
    ${mode === 'niveau' ? html`<h3>Couleurs</h3><div class="liste">${niveaux.map((n) => html`<div class="outils"><span style="min-width:3.5em"><b>${n}</b></span>
      <span class="nuancier">${NUANCIER.map((c) => html`<button type="button" style="--c:${c}" aria-label="${c}" aria-pressed="${couleurs[n] === c}" data-action="couleur-niveau" data-niveau="${n}" data-couleur="${c}"></button>`)}</span>
      <input type="color" value="${couleurs[n]}" data-change="couleur-niveau-libre" data-niveau="${n}" aria-label="Autre couleur pour ${n}"></div>`)}</div>` : ''}
    ${mode !== 'aucun' ? html`<div class="grille-champs">

// Lecture d'un QR code par la caméra (BarcodeDetector : Chrome sur Android, notamment).
let flux = null, minuteurQr = null;
function arreterCamera() { clearInterval(minuteurQr); if (flux) flux.getTracks().forEach((t) => t.stop()); flux = null; }
actions['scanner-qr'] = async () => {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { toast('Ce navigateur ne sait pas lire les QR codes : collez le lien.'); return; }
  let detecteur;
  try {
    const formats = await window.BarcodeDetector.getSupportedFormats();
    if (!formats.includes('qr_code')) throw new Error('qr');
    detecteur = new window.BarcodeDetector({ formats: ['qr_code'] });
    flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch { arreterCamera(); toast("Caméra indisponible ou refusée : collez le lien."); return; }
  ouvrirFeuille(() => ({ titre: 'Scanner le QR code', corps: html`<video class="video-qr" id="video-qr" autoplay playsinline muted></video><p class="aide">Visez le QR code du lien iCal. Rien n'est enregistré.</p>` }), { surFermeture: arreterCamera });
  const video = document.getElementById('video-qr');
  video.srcObject = flux;
  minuteurQr = setInterval(async () => {
    try {
      const codes = await detecteur.detect(video);
      if (codes.length) { const texte = codes[0].rawValue; arreterCamera(); fermerFeuille(); lienRecu(texte); }

  }, 300);

<script type="text/x-carnet-module" data-module="carnet/js/vues/creneau.js">
// La feuille d'un cours : ce qui est prévu, ce qu'il faut annoncer ou préparer, le texte pour
// le cahier de textes, et surtout « où vous êtes-vous arrêtés ? » — un toucher sur le dernier
// jalon atteint, ou « Comme prévu ». Pensé pour la fin d'une heure, le téléphone à la main.
import { actions, changements, saisies } from 'carnet/js/actions.js';
import { html, icone, ouvrirFeuille, fermerFeuille, redessinerFeuille, toast, copier } from 'carnet/js/ui.js';
import { calc, ecrireDoc, supprimerDoc, modifierDoc, nomClasse } from 'carnet/js/etat.js';
import { pointsArret, positionDe, EPS, seancesLisible } from 'carnet/js/moteur.js';
import { dateLongue, dateCourte } from 'carnet/js/dates.js';
import { horaires, segments, pastille, etiquetteEtat, textePronote, suggestionsPour, bandeauSuite } from 'carnet/js/vues/commun.js';

let choix = null; // { cle, pos: { i, f }, prevu: { i, f }, note }

const trouver = (cle) => { const c = calc(); return c.tousCreneaux.find((x) => x.cle === cle) || null; };

/** Position de la classe avant ce créneau, et position prévue à la fin. */
function bornes(cr) {
  const { plan } = calc();
  const pc = plan.parCreneau[cr.cle], pcl = plan.parClasse[cr.code];
  if (!pc || !pcl) return null;
  const idx = (u) => pcl.file.findIndex((it) => it.u === u);
  const segs = (pc.segments || []).filter((s) => !s.recul);
  if (segs.length) {
    const p = segs[0], d = segs[segs.length - 1];
    return { avant: { i: idx(p.u), f: p.de }, prevu: { i: idx(d.u), f: d.a } };
  }
  const fin = pcl.positionFinale;
  return { avant: fin, prevu: fin };
}

/** Ramène un point sur le dernier jalon atteint : on ne propose que des points qu'on peut toucher. */
function aligner(pos, file) {
  if (!pos || pos.i >= file.length) return pos;
  const e = calc().v.etapes[file[pos.i].eid];
  let f = 0;
  for (const p of pointsArret(e)) if (p.f <= pos.f + EPS) f = p.f;
  return { i: pos.i, f };
}

function initChoix(cle) {
  const c = calc(), cr = trouver(cle);
  if (!cr || !c.plan.parClasse[cr.code]) { choix = null; return; }
  const file = c.plan.parClasse[cr.code].file;
  const b = bornes(cr);
  if (b) b.prevu = aligner(b.prevu, file);
  const j = c.v.journal[cle];
  let pos = b ? b.prevu : { i: 0, f: 0 };
  if (j && j.arret) {
    const i = file.findIndex((it) => it.u === j.arret.u);
    pos = aligner(i >= 0 ? { i, f: Number(j.arret.f) || 0 } : (positionDe(j.arret, file) || pos), file);
  }
  choix = { cle, pos, prevu: b ? b.prevu : pos, note: (j && j.note) || '' };
}

export function ouvrirCreneau(cle, { valider = false } = {}) {
  const cr = trouver(cle);
  if (!cr) { toast("Ce cours n'est plus dans l'emploi du temps."); return; }
  choix = null;
  if (valider) initChoix(cle);
  ouvrirFeuille(() => contenu(cle), { surFermeture: () => { choix = null; } });
}


const memePoint = (a, b) => a && b && a.i === b.i && Math.abs(a.f - b.f) < 0.01;

function choixArret(cr) {
  const { plan, v } = calc();
  const pcl = plan.parClasse[cr.code];
  if (!pcl || !pcl.file.length) {
    return html`<p class="vide">La file de cette classe est vide.</p><a class="btn" href="#/classes/${cr.code}">Ajouter des étapes</a>`;
  }
  const b = bornes(cr) || { avant: { i: 0, f: 0 } };
  const premiere = Math.min(b.avant.i, choix.pos.i);
  const de = Math.max(0, choix.precedente ? premiere - 1 : premiere);
  const a = Math.min(pcl.file.length - 1, Math.max(b.avant.i, choix.pos.i, choix.prevu.i) + 2);
  const etapes = [];
  for (let i = de; i <= a; i++) {
    const it = pcl.file[i], e = v.etapes[it.eid];
    if (!e) continue;
    const pts = pointsArret(e);
    const estPrevue = choix.prevu.i === i || (choix.prevu.i === i + 1 && choix.prevu.f < EPS);
    etapes.push(html`<div class="arret-etape${estPrevue ? ' prevue' : ''}">
      <div class="titre"><span>${e.eval ? '✎ ' : ''}${e.titre}</span><span class="aide">${seancesLisible(Number(e.duree) || 1)}</span></div>
      <div class="puces" role="group" aria-label="Point d'arrêt dans ${e.titre}">
        ${pts.map((p, k) => {
          const point = { i, f: p.f };
          const fin = k === pts.length - 1;
          const libelle = k === 0 ? p.libelle : fin ? (p.libelle === 'Terminée' ? 'Terminée ✓' : `${p.libelle} ✓ terminée`) : `${p.libelle} ✓`;
          return html`<button class="puce${memePoint(point, choix.prevu) ? ' prevue' : ''}" aria-pressed="${memePoint(point, choix.pos)}" data-action="arret-choisir" data-i="${i}" data-f="${p.f}">${libelle}</button>`;
        })}
      </div>
    </div>`);
  }
  return html`<div class="arret">
    <p class="aide">Touchez le dernier jalon <b>terminé</b>. La suite glisse toute seule sur les prochains cours. En pointillés : ce qui était prévu.</p>
    ${de > 0 && !choix.precedente ? html`<div><button class="lien petit" data-action="arret-precedente">Afficher l'étape précédente</button></div>` : ''}
    ${etapes}
    <label class="champ"><span>Remarque (facultatif)</span>
      <input type="text" id="arret-note" data-saisie="arret-note" value="${choix.note}" placeholder="ex. P1 plus lente, manque la question 4" autocomplete="off"></label>
  </div>`;
}

function contenu(cle) {
  const c = calc();
  const cr = trouver(cle);
  if (!cr) return { titre: 'Cours introuvable', corps: html`<p class="vide">Ce cours n'est plus dans l'emploi du temps.</p>` };
  const suivie = !!c.v.classes[cr.code];
  const pc = c.plan.parCreneau[cle];
  const commence = cr.debut <= c.maintenant;
  const annonces = c.plan.annonces[cle] || [];
  const txt = textePronote(cr);
  const cl = c.v.classes[cr.code] || {};
  // Ce qu'une autre classe fait après une étape qui se termine dans ce cours (ou qui est la
  // dernière prévue, quand il reste du temps à préparer).
  const finissent = new Set(((pc && pc.etat === 'prevu' && pc.segments) || []).filter((s) => !s.recul && s.a >= 1 - EPS).map((s) => s.eid));
  const derniere = (((c.v.classes[cr.code] || {}).file || []).slice(-1)[0] || {}).eid;
  const suites = suivie && !cr.annule && pc && pc.etat === 'prevu'
    ? suggestionsPour(cr.code).filter((sug) => finissent.has(sug.apres) || (pc.libre > 0.01 && sug.apres === derniere)) : [];
  const aEtapes = !!pc && (pc.etat === 'prevu' || pc.etat === 'valide') && (pc.segments || []).some((s) => !s.recul && c.v.etapes[s.eid]);
  const aPrevoir = pc && pc.etat === 'prevu'
    ? pc.segments.filter((s) => s.de < EPS).map((s) => ({ s, e: c.v.etapes[s.eid] })).filter((x) => x.e && (x.e.afaire || x.e.photocopies > 0))

    ${cr.inclusions.length ? html`<p class="aide">Élèves en inclusion : ${cr.inclusions.join(', ')}</p>` : ''}
    ${cr.statut ? html`<p class="aide">Pronote : ${cr.statut}</p>` : ''}
    ${!suivie ? html`<div class="bandeau"><span>Cette classe n'est pas encore suivie dans le Carnet.</span><button class="btn mini plein" data-action="suivre-classe" data-code="${cr.code}">La suivre</button></div>` : html`
    ${choix && choix.cle === cle && !cr.annule && commence ? html`<section class="section-feuille"><h3>Où vous êtes-vous arrêtés ?</h3>${choixArret(cr)}</section>` : ''}
    <section class="section-feuille"><h3>${pc && pc.etat === 'valide' ? 'Fait' : 'Prévu'}</h3>${segments(cr, { modifiable: true })}${aEtapes ? html`<p class="aide">Touchez une étape pour la modifier.</p>` : ''}${suites.map((sug) => bandeauSuite(cr.code, sug))}</section>
    ${annonces.length ? html`<section class="section-feuille"><h3>À annoncer</h3>${annonces.map((a) => html`<div class="annonce${a.tard ? ' tard' : ''}"><span>${icone('annonce')} ${a.titre}, ${dateLongue(a.jourEval)}</span><button class="btn mini" data-action="annonce-faite" data-code="${a.code}" data-u="${a.u}">C'est fait</button></div>`)}</section>` : ''}
    ${aPrevoir.length ? html`<section class="section-feuille"><h3>À préparer</h3>${aPrevoir.map(({ s, e }) => {
      const id = `prep_${cle}_${s.u}`, fait = !!(c.v.coches[id] && c.v.coches[id].fait);
      const quoi = [e.photocopies > 0 ? `Photocopies : ${cl.effectif ? `${cl.effectif} élèves × ${e.photocopies} page${e.photocopies > 1 ? 's' : ''} = ${cl.effectif * e.photocopies}` : `${e.photocopies} page(s) par élève`}` : '', e.afaire].filter(Boolean).join(' · ');
      return html`<label class="coche${fait ? ' faite' : ''}"><input type="checkbox" data-change="coche" data-id="${id}"${fait ? ' checked' : ''}><span>${quoi}<br><span class="aide">${e.titre}</span></span></label>`;
    })}</section>` : ''}
    ${txt ? html`<section class="section-feuille"><h3>Cahier de textes</h3><pre class="pronote-texte" id="texte-pronote">${txt}</pre><div><button class="btn mini" data-action="copier-pronote">${icone('copier')} Copier pour Pronote</button></div></section>` : ''}
    ${!cr.annule && commence && !(choix && choix.cle === cle) ? html`<div><button class="btn plein" data-action="valider" data-cle="${cle}">${icone('valider')} ${pc && pc.etat === 'valide' ? 'Modifier le point d’arrêt' : 'Où en est-on ?'}</button></div>` : ''}
    ${!cr.annule && !(choix && choix.cle === cle) && !(pc && pc.etat === 'valide') ? html`<div><button class="btn${commence || aEtapes ? '' : ' plein'}" data-action="etape-ici" data-cle="${cle}">${icone('plus')} ${aEtapes ? 'Ajouter une autre étape dans ce cours' : 'Prévoir une étape dans ce cours'}</button></div>` : ''}

  const pied = choix && choix.cle === cle ? html`

// ---------- Actions ----------
actions['ouvrir-creneau'] = (el) => ouvrirCreneau(el.dataset.cle);
actions['valider'] = (el) => {

actions['arret-precedente'] = () => { if (choix) { choix.precedente = true; redessinerFeuille(true); } };
actions['arret-choisir'] = (el) => {

saisies['arret-note'] = (el) => { if (choix) choix.note = el.value; };

function enregistrer(pos) {
  const c = calc(), cr = trouver(choix.cle);
  const file = c.plan.parClasse[cr.code].file;
  const it = file[Math.min(pos.i, file.length - 1)];
  const arret = pos.i >= file.length ? { u: file[file.length - 1].u, f: 1, rang: file.length } : { u: it.u, f: Math.round(pos.f * 1000) / 1000, rang: pos.i };

actions['arret-enregistrer'] = () => { if (choix) enregistrer(choix.pos); };
actions['arret-comme-prevu'] = () => { if (choix) enregistrer(choix.prevu); };
actions['arret-effacer'] = () => {
  if (!choix) return;
  supprimerDoc(`journal/${choix.cle}`);
  choix = null;
  redessinerFeuille(true);
  toast('Validation effacée : ce cours redevient « comme prévu ».');
};
actions['annonce-faite'] = (el) => {
  const { code, u } = el.dataset;
  modifierDoc(`classes/${code}`, (d) => { d.annonces = { ...(d.annonces || {}), [u]: true }; });

};
actions['copier-pronote'] = async () => {
  const pre = document.getElementById('texte-pronote');
  if (!pre) return;
  toast(await copier(pre.textContent, pre) ? 'Texte copié : collez-le dans le cahier de textes.' : 'Texte sélectionné : copiez-le avec Ctrl+C.');
};
changements['coche'] = (el) => {
  const id = el.dataset.id;
  if (el.checked) ecrireDoc(`coches/${id}`, { fait: true }); else supprimerDoc(`coches/${id}`);
};

export { dateCourte };

<script type="text/x-carnet-module" data-module="carnet/js/dnd.js">
// Déplacer les modules du tableau de bord à la souris, au doigt ou au stylet (Pointer Events :
// le glisser-déposer HTML natif ne marche pas au doigt). La poignée porte touch-action: none
// pour que le geste ne fasse pas défiler la page. Les boutons ↑ ↓ restent l'alternative clavier.

export function activerGlisser(racine, { selecteur = '.module', surFin }) {
  let g = null;

  function fin() {
    if (!g) return;
    g.el.style.transform = '';
    g.el.classList.remove('glisse');
    const ordre = [...racine.querySelectorAll(selecteur)].map((m) => m.dataset.module);
    const change = ordre.join('|') !== g.ordreInitial;
    g = null;
    window.removeEventListener('pointermove', bouge);
    window.removeEventListener('pointerup', fin);
    window.removeEventListener('pointercancel', fin);
    if (change) surFin(ordre);
  }

  function place(e) {
    g.el.style.transform = '';
    const r = g.el.getBoundingClientRect();
    g.el.style.transform = `translate(${e.clientX - g.dx - r.left}px, ${e.clientY - g.dy - r.top}px)`;
  }

  function bouge(e) {
    if (!g) return;
    e.preventDefault();
    const autres = [...g.el.parentNode.querySelectorAll(selecteur)].filter((m) => m !== g.el);
    const cible = autres.find((m) => {
      const r = m.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    });
    if (cible) {
      const r = cible.getBoundingClientRect();
      const memeLigne = Math.abs((r.top + r.bottom) / 2 - e.clientY) < r.height / 2 && r.width < g.el.parentNode.clientWidth * 0.9;
      const avant = memeLigne ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2;
      // Hystérésis : on ne rebouge que si la cible ou le côté change.
      if (cible !== g.derniere || avant !== g.avant) {
        cible.parentNode.insertBefore(g.el, avant ? cible : cible.nextSibling);
        g.derniere = cible; g.avant = avant;
      }
    }
    place(e);
    const marge = 70;
    if (e.clientY < marge) window.scrollBy(0, -12);
    else if (e.clientY > window.innerHeight - marge) window.scrollBy(0, 12);
  }

  racine.addEventListener('pointerdown', (e) => {
    const poignee = e.target.closest('[data-poignee]');
    // Le mode « Personnaliser » est porté par la grille des modules, pas par la page.
    if (!poignee || !poignee.closest('.organiser') || e.button > 0) return;
    const el = poignee.closest(selecteur);
    if (!el) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    g = {
      el, dx: e.clientX - r.left, dy: e.clientY - r.top, derniere: null, avant: null,
      ordreInitial: [...racine.querySelectorAll(selecteur)].map((m) => m.dataset.module).join('|'),
    };
    el.classList.add('glisse');
    window.addEventListener('pointermove', bouge, { passive: false });
    window.addEventListener('pointerup', fin);
    window.addEventListener('pointercancel', fin);
  });
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/installation.js">
// Installer le Carnet comme une application, et savoir où il vit. Chrome et Edge (Android,
// Windows, Mac) annoncent qu'ils peuvent l'installer par l'événement « beforeinstallprompt » :
// on le garde pour proposer « Installer » au bon moment, d'un seul toucher. Safari sur iPhone
// n'a pas cet événement : on y montre le chemin (Partager → Sur l'écran d'accueil).
import { CONFIG } from 'carnet/config.js';

let invitation = null;
const ecouteurs = new Set();
const prevenir = () => ecouteurs.forEach((f) => f());

if (typeof addEventListener === 'function') { // pas dans Node, où tournent les tests du moteur
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); invitation = e; prevenir(); });
  addEventListener('appinstalled', () => { invitation = null; prevenir(); });
}

/** Appelle `f` quand l'installation devient possible, ou vient d'avoir lieu. */
export const surChangementInstallation = (f) => { ecouteurs.add(f); };

/** Ouvert depuis son icône, comme une application (et non dans un onglet du navigateur). */
export function installee() {
  try {
    if (navigator.standalone === true) return true;
    return ['standalone', 'window-controls-overlay', 'minimal-ui', 'fullscreen'].some((m) => matchMedia(`(display-mode: ${m})`).matches);
  } catch { return false; }
}

const agent = () => navigator.userAgent || '';
export const surIphone = () => /iphone|ipad|ipod/i.test(agent()) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
export const surAndroid = () => /android/i.test(agent());

/**
 * Ce qu'on peut proposer ici : 'invitation' (le navigateur installe d'un toucher), 'iphone' (montrer
 * la marche à suivre), ou null (déjà installé, page d'aperçu, ou navigateur qui ne sait pas).
 */
export function installation() {
  if (CONFIG.apercu || installee()) return null;
  if (invitation) return 'invitation';
  if (surIphone()) return 'iphone';
  return null;
}

/** Lance l'installation proposée par le navigateur. Renvoie true si elle a été acceptée. */
export async function installer() {
  if (!invitation) return false;
  const e = invitation;
  invitation = null;
  prevenir();
  e.prompt();
  try { return (await e.userChoice).outcome === 'accepted'; } catch { return false; }
}

/** L'adresse du Carnet, sans ce qui suit # ni ? : celle de config.js, sinon celle de la page. */
export function adresseAppli() {
  if (CONFIG.urlPublique) return CONFIG.urlPublique;
  return `${location.origin}${location.pathname}`.replace(/index\.html$/, '');
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/partage.js">
// Faire connaître le Carnet et l'installer : un QR code à viser avec un téléphone (le sien, pour y
// retrouver le Carnet, ou celui d'un collègue en salle des profs), le lien, le partage du téléphone,
// et un message tout prêt qui dit en trois lignes comment commencer.
import { actions } from 'carnet/js/actions.js';
import { html, brut, icone, toast, ouvrirFeuille, copier } from 'carnet/js/ui.js';
import { qrSvg } from 'carnet/js/qr.js';
import { installation, installer, installee, surIphone, surAndroid, adresseAppli } from 'carnet/js/installation.js';
import { googleConfigure } from 'carnet/js/google.js';
import { reglerLocal } from 'carnet/js/etat.js';
import { CONFIG } from 'carnet/config.js';

const sansProtocole = (u) => u.replace(/^https?:\/\//, '').replace(/\/$/, '');

/** Le message à envoyer à un collègue (tutoiement : c'est vous qui l'envoyez). */
export function messageCollegue() {
  const lignes = [
    "Je te conseille le Carnet de bord : l'emploi du temps Pronote, l'agenda perso et l'endroit où chaque classe s'est arrêtée, au même endroit, sur le téléphone comme sur l'ordinateur. C'est gratuit, sans publicité, et il ne demande jamais le mot de passe Pronote.",
    '',
    `1. Ouvre ${adresseAppli()}`,
    "2. Installe-le : bouton « Installer » (sur iPhone : Partager, puis « Sur l'écran d'accueil »).",
    "3. Essaie-le avec l'exemple, puis branche ton emploi du temps.",
  ];
  if (googleConfigure() && CONFIG.phaseEssai !== false) {
    lignes.push('', CONFIG.responsable
      ? `Pour la connexion Google, pendant la phase d'essai, envoie ton adresse Gmail à ${CONFIG.responsable}, qui t'ajoutera à la liste.`
      : "Pour la connexion Google, pendant la phase d'essai, il faut être inscrit : demande-le à la personne qui t'envoie ce lien.");
  }
  return lignes.join('\n');
}

export function ouvrirPartage() {
  ouvrirFeuille(() => {
    const url = adresseAppli();
    return {
      titre: 'Partager le Carnet',
      corps: html`<div class="partage">
        <figure class="partage-qr">${brut(qrSvg(url, { titre: `QR code : ${sansProtocole(url)}` }))}
          <figcaption>Visez ce code avec l'appareil photo d'un téléphone : le Carnet s'ouvre. Pour le retrouver sur votre téléphone, ou le montrer à un collègue.</figcaption></figure>
        <div class="partage-lien">
          <p class="adresse" id="adresse-appli">${sansProtocole(url)}</p>
          <div class="outils">
            <button class="btn" data-action="copier-adresse">${icone('copier')} Copier le lien</button>
            ${typeof navigator.share === 'function' ? html`<button class="btn" data-action="partager-natif">${icone('partager')} Envoyer…</button>` : ''}
          </div>
          <details class="partage-message"><summary>Un message tout prêt pour un collègue</summary>
            <pre id="message-collegue">${messageCollegue()}</pre>
            <button class="btn" data-action="copier-message">${icone('copier')} Copier le message</button>
          </details>
        </div>
      </div>`,
    };
  }, { classe: 'feuille-partage' });
}

function ouvrirMarcheASuivre() {
  ouvrirFeuille(() => ({
    titre: 'Installer le Carnet',
    corps: surIphone()
      ? html`<ol class="pas">
          <li>Ouvrez le Carnet dans <b>Safari</b>.</li>
          <li>Touchez le bouton <b>Partager</b> ${icone('partager')}, en bas de l'écran (en haut sur iPad).</li>
          <li>Choisissez <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</li>
        </ol>
        <p class="aide">Le Carnet s'ouvrira depuis son icône, en plein écran, même sans réseau.</p>`
      : html`<ul class="pas">
          <li><b>Chrome</b>, sur ordinateur : l'icône d'installation à droite de la barre d'adresse ; sur Android : menu ⋮ → <b>Installer l'application</b>.</li>
          <li><b>Edge</b> : menu … → <b>Applications</b> → <b>Installer ce site en tant qu'application</b>.</li>
          <li><b>Firefox</b> et <b>Safari sur Mac</b> installent mal les applications web : ouvrez plutôt le Carnet dans Chrome ou Edge.</li>
        </ul>
        <p class="aide">Installé, le Carnet s'ouvre depuis son icône, dans sa propre fenêtre, même sans réseau.</p>`,
  }));
}

actions['partager'] = () => ouvrirPartage();
actions['installer'] = async () => {
  if (installation() === 'invitation') {
    if (await installer()) toast(surAndroid() ? "Carnet installé : son icône est sur l'écran d'accueil." : 'Carnet installé : il a maintenant sa propre fenêtre.');
    return;
  }
  ouvrirMarcheASuivre();
};
actions['installer-plus-tard'] = () => { reglerLocal({ installPlusTard: Date.now() }); };
actions['copier-adresse'] = async () => {
  toast(await copier(adresseAppli(), document.getElementById('adresse-appli')) ? 'Lien copié.' : 'Lien sélectionné : copiez-le.');
};
actions['copier-message'] = async () => {
  const el = document.getElementById('message-collegue');
  toast(await copier(el.textContent, el) ? 'Message copié : collez-le dans un mail ou un SMS.' : 'Message sélectionné : copiez-le.');
};
actions['partager-natif'] = async () => {
  try { await navigator.share({ title: 'Carnet de bord', text: messageCollegue() }); } catch (e) {
    if (e && e.name !== 'AbortError') toast("Le partage n'a pas abouti : copiez plutôt le lien.");
  }
};

/** Le bandeau « Installer » du tableau de bord : seulement si c'est possible, et pas refusé il y a moins d'un mois. */
export function bandeauInstallation(plusTard) {
  const mode = installation();
  if (!mode || Date.now() - (plusTard || 0) < 30 * 864e5) return '';
  return html`<div class="bandeau installer"><span><strong>Installer le Carnet</strong> sur cet appareil : il s'ouvrira depuis son icône, comme une application, même sans réseau.</span>
    <span class="outils"><button class="btn mini plein" data-action="installer">${icone('telecharger')} ${mode === 'iphone' ? 'Comment faire' : 'Installer'}</button>
    <button class="btn mini" data-action="installer-plus-tard">Plus tard</button></span></div>`;
}
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/importlien.js">
// Importer une progression par un simple lien : …/carnet/#importer=<données>. Les données voyagent
// dans la partie de l'adresse après « # », que le navigateur n'envoie à aucun serveur. Rien n'est
// importé sans confirmation : on montre d'abord ce que le lien contient.
import { actions } from 'carnet/js/actions.js';
import { html, icone, toast, ouvrirFeuille, fermerFeuille } from 'carnet/js/ui.js';
import { etat, calc, importerDocs } from 'carnet/js/etat.js';
import { importer, vue } from 'carnet/js/donnees.js';

let enAttente = null;

/** Le texte d'un lien d'import (base64url d'un JSON, en UTF-8). */
export function decoderLien(code) {
  const b64 = code.replace(/-/g, '+').replace(/_/g, '/');
  const octets = Uint8Array.from(atob(b64 + '==='.slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
  return new TextDecoder().decode(octets);
}

/** L'inverse : de quoi fabriquer un lien d'import à partir d'un export. */
export function coderLien(texte) {
  let bin = '';
  for (const o of new TextEncoder().encode(texte)) bin += String.fromCharCode(o);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

export function proposerImportLien(code) {
  let docs, origine;
  try {
    ({ docs, origine } = importer(decoderLien(code)));
  } catch {
    toast("Ce lien d'import est abîmé ou incomplet : demandez-le à nouveau.");
    return;
  }
  const v = vue(docs);
  const classes = Object.values(v.classes);
  const etapes = Object.keys(v.etapes).length;
  const validations = Object.keys(v.journal).length;
  const ici = calc().v.classes;
  enAttente = docs;
  ouvrirFeuille(() => ({
    titre: 'Importer une progression',
    corps: etat.local.mode === 'demo'
      ? html`<p>Vous êtes en mode démo : l'import mélangerait ces données aux classes fictives.</p><p><a class="btn plein" href="#/demarrer">Commencer pour de vrai</a>, puis rouvrez le lien.</p>`
      : html`<p>${origine === 'carnet-claude' ? 'Ce lien vient du « Carnet de bord SVT » de claude.ai.' : 'Ce lien contient une progression du Carnet.'} Il apporte :</p>
        <ul>
          <li><b>${classes.length} classe${classes.length > 1 ? 's' : ''}</b> : ${classes.map((c) => c.nom || c.code).join(', ')}${classes.some((c) => !ici[c.code]) ? ' (celles qui manquent ici seront ajoutées)' : ''} ;</li>
          <li><b>${etapes} étape${etapes > 1 ? 's' : ''}</b>, avec l'endroit où chaque classe en est${validations ? html` et <b>${validations} point${validations > 1 ? 's' : ''} d'arrêt</b>` : ''}.</li>
        </ul>
        <p class="aide">Les étapes de ces classes remplacent celles d'ici, avec les points d'arrêt qui portaient sur les anciennes étapes. Vos réglages, et le nom et l'effectif de vos classes, restent. La suite se calcule aussitôt sur vos prochains cours${etat.local.mode === 'google' ? ', et part dans Google Agenda' : ''}.</p>`,
    pied: etat.local.mode === 'demo' ? '' : html`<button class="btn" data-action="fermer-feuille">Annuler</button><button class="btn plein" data-action="importer-lien">${icone('televerser')} Importer</button>`,
  }), { surFermeture: () => { enAttente = null; } });
}

actions['importer-lien'] = () => {
  if (!enAttente) return;
  importerDocs(enAttente);
  enAttente = null;
  fermerFeuille();
  location.hash = '#/accueil';
  toast('Progression importée : la suite est prévue sur vos prochains cours.');
};

<script type="text/x-carnet-module" data-module="carnet/js/identite.js">
// Qui est connecté, et où : ce que Pronote affiche en tête de page (« COLLÈGE GALILÉE — Espace
// Professeurs — Mme … »). Réglé dans Mes données ; sinon deviné dans l'agenda exporté par Pronote,
// dont le nom porte souvent celui de l'enseignant (« Calendrier - DURAND M. - du … ») et la
// description, parfois, celui de l'établissement.
import { etat, reglages } from 'carnet/js/etat.js';

const ETABLISSEMENT = /\b((?:coll[eè]ge|lyc[eé]e|lp|lpo|cit[eé] scolaire|erea|ensemble scolaire|institution|groupe scolaire)\b[^\n\r\-–—|,;()]{2,60})/i;

/** { nom, etablissement } d'après le nom et la description de l'agenda Pronote. */
export function deviner(nomAgenda = '', description = '') {
  const t = `${nomAgenda}\n${description}`;
  let nom = '';
  const m = String(nomAgenda).match(/^\s*(?:calendrier|emploi du temps|edt)\s*[-–—:]\s*(.+?)\s*(?:[-–—]\s*du\b|$)/i)
    || String(description).match(/calendrier\s+(.+?)\s+g[ée]n[ée]r[ée] par/i);
  if (m) nom = m[1].replace(/\s+/g, ' ').trim();
  const e = t.match(ETABLISSEMENT);
  const etablissement = e ? e[1].replace(/\s+/g, ' ').trim().replace(/\s+(semaines?|du|ann[ée]e)\b.*$/i, '') : '';
  return { nom: /pronote|index/i.test(nom) ? '' : nom.slice(0, 60), etablissement: etablissement.toUpperCase() };
}

export function identite() {
  const r = reglages(), src = r.source || {};
  const agenda = (etat.brut.agendas || {})[src.agendaPronote] || {};
  const devine = deviner(agenda.nom || etat.brut.nomIcal || '', agenda.description || '');
  return { nom: r.nomAffiche || devine.nom, etablissement: r.etablissement || devine.etablissement, devine };
}

<script type="text/x-carnet-module" data-module="carnet/js/dates.js">
// Dates et heures, toujours lues dans un fuseau explicite.
// Un jour se manipule sous la forme « AAAA-MM-JJ » : on compare et on trie des chaînes,
// on ajoute des jours en UTC pour ne jamais tomber dans un changement d'heure.

export const FUSEAU_APPAREIL = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Paris'; }
  catch { return 'Europe/Paris'; }
})();

const formats = new Map();
function morceaux(instant, fuseau) {
  let f = formats.get(fuseau);
  if (!f) {
    f = new Intl.DateTimeFormat('en-GB', {
      timeZone: fuseau, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
    });
    formats.set(fuseau, f);
  }
  const o = {};
  for (const p of f.formatToParts(instant)) o[p.type] = p.value;
  if (o.hour === '24') o.hour = '00';
  return o;
}

/** « AAAA-MM-JJ » du jour où tombe l'instant, dans le fuseau donné. */
export function jourDe(instant, fuseau) {
  const p = morceaux(instant, fuseau);
  return `${p.year}-${p.month}-${p.day}`;
}

/** « HH:MM » de l'instant, dans le fuseau donné. */
export function heureDe(instant, fuseau) {
  const p = morceaux(instant, fuseau);
  return `${p.hour}:${p.minute}`;
}

/** Minutes écoulées depuis minuit, dans le fuseau donné. */
export function minutesDe(instant, fuseau) {
  const p = morceaux(instant, fuseau);
  return Number(p.hour) * 60 + Number(p.minute);
}

/** Écart, en minutes, entre l'heure du fuseau et l'heure UTC à cet instant. */
export function decalage(ms, fuseau) {
  const p = morceaux(new Date(ms), fuseau);
  const commeUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return Math.round((commeUtc - Math.floor(ms / 1000) * 1000) / 60000);
}

/** L'instant qui correspond à une heure d'horloge locale (jour « AAAA-MM-JJ », heure « HH:MM[:SS] »). */
export function instantDe(jour, heure, fuseau) {
  const [a, m, j] = jour.split('-').map(Number);
  const [h = 0, mi = 0, s = 0] = String(heure || '00:00').split(':').map(Number);
  const naif = Date.UTC(a, m - 1, j, h, mi, s);
  // Deux passes : la seconde corrige le cas où l'on a franchi un changement d'heure.
  let t = naif - decalage(naif, fuseau) * 60000;
  t = naif - decalage(t, fuseau) * 60000;
  return new Date(t);
}

export const enUtc = (jour) => { const [a, m, j] = jour.split('-').map(Number); return new Date(Date.UTC(a, m - 1, j)); };
export const versJour = (d) => d.toISOString().slice(0, 10);
export const ajouteJours = (jour, n) => { const d = enUtc(jour); d.setUTCDate(d.getUTCDate() + n); return versJour(d); };
export const ecartJours = (a, b) => Math.round((enUtc(b) - enUtc(a)) / 864e5);
/** 0 = lundi … 6 = dimanche. */
export const jourSemaine = (jour) => (enUtc(jour).getUTCDay() + 6) % 7;
export const lundiDe = (jour) => ajouteJours(jour, -jourSemaine(jour));
export const aujourdhui = (fuseau) => jourDe(new Date(), fuseau);

const JOURS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

export const nomJour = (jour) => JOURS[jourSemaine(jour)];
/** « lundi 2 novembre » */
export const dateLongue = (jour) => { const d = enUtc(jour); return `${JOURS[jourSemaine(jour)]} ${d.getUTCDate()} ${MOIS[d.getUTCMonth()]}`; };
/** « lun. 2 nov. » */
