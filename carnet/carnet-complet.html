  ouvrirFeuille(feuille, { surFermeture: () => { edition = null; } });
}

function feuille() {
  const e = edition, agendas = agendasModifiables();
  const demo = etat.local.mode === 'demo';
  return {
    titre: e.id ? 'Modifier le rendez-vous' : 'Nouveau rendez-vous',
    corps: html`<form class="section-feuille" id="form-rdv" data-envoi="rdv-enregistrer">
      <label class="champ"><span>Intitulé</span><input type="text" id="rdv-titre" name="titre" value="${e.titre}" required autofocus placeholder="Inspection, rendez-vous parents, dentiste…"></label>
      <label class="coche"><input type="checkbox" id="rdv-journee" name="journee" data-change="rdv-journee"${e.journee ? ' checked' : ''}><span>Toute la journée</span></label>
      <div class="grille-champs">
        <label class="champ"><span>${e.journee ? 'Du' : 'Le'}</span><input type="date" id="rdv-jour" name="jour" value="${e.jour}" required></label>
        ${e.journee
          ? html`<label class="champ"><span>Au</span><input type="date" id="rdv-jourfin" name="jourFin" value="${e.jourFin}" required></label>`
          : html`<label class="champ"><span>De</span><input type="time" id="rdv-debut" name="debut" value="${e.debut}" step="300" required></label>
            <label class="champ"><span>À</span><input type="time" id="rdv-fin" name="fin" value="${e.fin}" step="300" required></label>`}
      </div>
      <label class="champ"><span>Lieu</span><input type="text" id="rdv-lieu" name="lieu" value="${e.lieu}"></label>
      <label class="champ"><span>Notes</span><textarea id="rdv-description" name="description" rows="3">${e.description}</textarea></label>
      ${agendas.length > 1 && !e.id ? html`<label class="champ"><span>Agenda</span><select id="rdv-agenda" name="agenda">${agendas.map((a) => html`<option value="${a.id}"${a.id === e.agendaId ? ' selected' : ''}>${a.nom}</option>`)}</select></label>`
        : html`<p class="aide">Agenda : ${(agendas.find((a) => a.id === e.agendaId) || {}).nom || ''}</p>`}
      ${e.repete ? html`<p class="aide">Rendez-vous répété : seule cette date est modifiée.</p>` : ''}
      <p class="aide">${demo ? 'Mode démo : le rendez-vous change ici seulement.' : 'Enregistré tout de suite dans votre Google Agenda.'}</p>
    </form>`,
    pied: html`${e.id ? html`<button class="btn danger" data-action="rdv-supprimer" data-id="${e.id}">${icone('corbeille')} Supprimer</button>` : ''}
      <button class="btn" data-action="fermer-feuille">Annuler</button>
      <button class="btn plein" type="submit" form="form-rdv" ${e.envoi ? 'disabled' : ''}>${icone('valider')} ${e.envoi ? 'Enregistrement…' : 'Enregistrer'}</button>`,
  };
}

/** Garde la saisie avant de redessiner la feuille (la case « toute la journée » change les champs). */
function relire(f) {
  if (!edition || !f) return;
  for (const k of ['titre', 'jour', 'jourFin', 'debut', 'fin', 'lieu', 'description']) if (f[k]) edition[k] = f[k].value;
  if (f.agenda) edition.agendaId = f.agenda.value;
  if (f.journee) edition.journee = f.journee.checked;
}
changements['rdv-journee'] = (el) => { relire(el.form); if (edition && edition.jourFin < edition.jour) edition.jourFin = edition.jour; redessinerFeuille(true); };

/** Le rendez-vous tel que Google l'attend. */
export function corpsGoogle(e, fuseau) {
  const corps = { summary: e.titre.trim(), location: e.lieu.trim() };
  if (e.journee) {
    corps.start = { date: e.jour };
    corps.end = { date: ajouteJours(e.jourFin < e.jour ? e.jour : e.jourFin, 1) };
  } else {
    corps.start = { dateTime: instantDe(e.jour, e.debut, fuseau).toISOString(), timeZone: fuseau };
    corps.end = { dateTime: instantDe(e.jour, e.fin, fuseau).toISOString(), timeZone: fuseau };
  }
  // Les notes ne repartent que si on les a changées : une description riche (liens, mise en forme)
  // écrite dans Google n'est pas aplatie en texte simple pour rien.
  if (e.description !== e.descriptionInitiale || !e.id) corps.description = e.description.trim();
  return corps;
}

/** Remplace (ou retire, si `nouveau` est nul) un rendez-vous dans ce que le Carnet a lu. */
function remplacerLocal(id, nouveau) {
  const l = (etat.brut.perso || []).filter((x) => x.id !== id);
  if (nouveau) l.push(nouveau);
  definirBrut({ perso: l });
}

async function autorisation() {
  if (G.peutModifierRendezVous()) return true;
  // Pas connecté, ou connecté avant que le Carnet sache modifier les rendez-vous : Google demande l'accord.
  await G.connecter({ indice: etat.local.compte && etat.local.compte.email });
  if (!G.peutModifierRendezVous()) throw Object.assign(new Error('Google n’a pas accordé la modification des agendas : reconnectez-vous en cochant toutes les autorisations.'), { code: 'portee' });
  return true;
}

envois['rdv-enregistrer'] = async (f) => {
  if (!edition || edition.envoi) return;
  relire(f);
  const e = edition, c = calc();
  if (!e.titre.trim()) { toast('Donnez un intitulé au rendez-vous.'); return; }
  if (!e.journee && e.fin <= e.debut) { toast('L’heure de fin doit venir après celle du début.'); return; }
  const corps = corpsGoogle(e, c.fuseau);
  const agenda = (etat.brut.agendas || {})[e.agendaId] || {};
  const garde = (ev) => ({ ...depuisGoogle(ev, c.fuseau), agenda: agenda.nom, agendaId: e.agendaId, modifiable: true, repete: e.repete });
  if (etat.local.mode === 'demo') {
    const id = e.id || `demo-rdv-${Date.now().toString(36)}`;
    const avant = (etat.brut.perso || []).find((x) => x.id === id) || {};
    remplacerLocal(id, garde({ id, summary: corps.summary, location: corps.location, description: corps.description ?? avant.description ?? '', start: corps.start, end: corps.end }));
    fermerFeuille();
    toast(e.id ? 'Rendez-vous modifié (démo).' : 'Rendez-vous ajouté (démo).');
    return;
  }
  e.envoi = true; redessinerFeuille(true);
  try {
    await autorisation();
    const ev = e.id ? await G.modifierEvenement(e.agendaId, e.id, corps) : await G.creerEvenement(e.agendaId, corps);
    remplacerLocal(e.id || ev.id, garde(ev));
    fermerFeuille();
    toast(e.id ? 'Rendez-vous modifié dans Google Agenda.' : 'Rendez-vous ajouté à Google Agenda.');
  } catch (err) {
    if (edition) { edition.envoi = false; redessinerFeuille(true); }
    toast(err.code === 'portee' ? err.message : messageErreur(err));
  }
};

actions['rdv-nouveau'] = (el) => ouvrirRendezVous({ jour: el.dataset.jour });
actions['rdv-modifier'] = (el) => ouvrirRendezVous({ id: el.dataset.id });
// Un toucher dans une case vide de la grille : un rendez-vous à cette heure-là.
actions['rdv-creneau'] = (el, ev) => {
  if (!agendasModifiables().length) return;
  const r = el.getBoundingClientRect();
  const minutes = Number(el.dataset.debut) + (ev.clientY - r.top) / Number(el.dataset.px || 1.05);
  ouvrirRendezVous({ jour: el.dataset.jour, minutes: Math.max(0, Math.floor(minutes / 15) * 15) });
};

actions['rdv-supprimer'] = async (el) => {
  const id = el.dataset.id;
  const e = (etat.brut.perso || []).find((x) => x.id === id);
  if (!e) return;
  if (el.dataset.confirme !== '1') {
    el.dataset.confirme = '1';
    el.textContent = e.repete ? 'Supprimer cette date ? Toucher encore' : 'Supprimer de Google Agenda ? Toucher encore';
    return;
  }
  if (etat.local.mode === 'demo') { remplacerLocal(id, null); fermerFeuille(); toast('Rendez-vous supprimé (démo).'); return; }
  el.disabled = true;
  try {
    await autorisation();
    await G.supprimerEvenement(e.agendaId, id);
    remplacerLocal(id, null);
    fermerFeuille();
    toast(`« ${e.titre} » supprimé de Google Agenda${e.jour0 ? `, ${dateLongue(e.jour0)}` : ''}.`);
  } catch (err) {
    el.disabled = false;
    toast(err.code === 'portee' ? err.message : messageErreur(err));
  }
};
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/programmation.js">
// Importer sa programmation depuis un tableur (Excel, LibreOffice, Google Sheets, Numbers, CSV,
// ou des cellules collées), l'exporter pour un collègue, ou partir d'un modèle vierge.
// Le fichier est lu dans le navigateur : il ne quitte jamais l'appareil.
//
// Une feuille à la fois, comme les onglets du tableur : le Carnet devine la ligne des titres et le
// rôle de chaque colonne, montre les étapes qu'il en tire, et l'on corrige ce qu'il a mal deviné
// avant d'appliquer. Une feuille par niveau (« 6e », « 5e »…) est la disposition la plus courante.
import { actions, changements, saisies } from 'carnet/js/actions.js';
import { html, icone, ouvrirFeuille, fermerFeuille, redessinerFeuille, toast, telecharger } from 'carnet/js/ui.js';
import { calc, ecrireDoc, modifierDoc, nomClasse, classesDetectees } from 'carnet/js/etat.js';
import { lireTableur, lireTexteTabule, ecrireXlsx } from 'carnet/js/tableur.js';
import { ROLES, analyser, versEtapes, planImport, niveauDansTexte, anneeRentree, lignesExport, modeleProgrammation } from 'carnet/js/programmation.js';
import { seancesLisible } from 'carnet/js/moteur.js';
import { dateCourte } from 'carnet/js/dates.js';
import { nouvelId } from 'carnet/js/donnees.js';

const NIVEAUX = ['6e', '5e', '4e', '3e', '2nde', '1re', 'Tle', 'Autre'];
const APERCU_MAX = 80;

let imp = null; // { nom, feuilles: [{ nom, lignes, entete, colonnes, niveau, cibles, mode, faite }], k, lecture, erreur, collage, voirColonnes, surFin }

/** Redessine la fenêtre en rendant le focus au champ qu'on vient de changer (il a été remplacé). */
function redessiner(el) {
  const id = el && el.id;
  redessinerFeuille(true);
  if (id) document.getElementById(id)?.focus({ preventScroll: true });
}

const niveauxSuivis = () => {
  const v = calc().v;
  return [...new Set(Object.values(v.classes).filter((cl) => !cl.masquee).map((cl) => cl.niveau))];
};
const classesDuNiveau = (niveau) => Object.entries(calc().v.classes).filter(([, cl]) => !cl.masquee && cl.niveau === niveau).map(([k]) => k).sort();

function preparerFeuille(f, nomFichier, rang) {
  const a = analyser(f.lignes);
  const suivis = niveauxSuivis();
  // Le niveau : le nom de la feuille, sinon celui du fichier, sinon le seul niveau suivi.
  const niveau = niveauDansTexte(f.nom) || (rang === 0 ? niveauDansTexte(nomFichier) : '') || (suivis.length === 1 ? suivis[0] : suivis[rang] || suivis[0] || '6e');
  return { ...f, entete: a.entete, colonnes: a.colonnes, niveau, cibles: new Set(classesDuNiveau(niveau)), mode: 'ajouter', faite: false };
}

function ouvrirAvec(nom, feuilles) {
  Object.assign(imp, { nom, feuilles: feuilles.map((f, k) => preparerFeuille(f, nom, k)), k: 0, lecture: false, erreur: '' });
  redessinerFeuille(true);
}

/** Les réglages de durée : la séance de Pronote, et le nombre de cours par semaine des classes visées. */
function contexte(f) {
  const c = calc();
  const detectees = classesDetectees();
  const parSemaine = [...f.cibles].map((k) => (detectees.find((d) => d.code === k) || {}).parSemaine || 0).filter(Boolean);
  return {
    dureeSeance: c.dureeSeance || 55,
    seancesParSemaine: parSemaine.length ? Math.max(...parSemaine) : 0,
    rentree: anneeRentree(c.v.reglages.debut || c.auj),
  };
}

function resultat(f) {
  return versEtapes(f.lignes, { entete: f.entete, colonnes: f.colonnes, niveau: f.niveau, ...contexte(f) });
}

// ---------- La feuille d'import ----------

function ecranSource() {
  return html`<div class="section-feuille">
      <p>Le fichier de votre programmation, tel quel : une ligne par séance ou par activité. Le Carnet devine les colonnes, vous corrigez avant d'appliquer.</p>
      <label class="depot" id="depot-programmation">
        <input type="file" accept=".xlsx,.xlsm,.ods,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.spreadsheet,text/csv" data-change="prog-fichier" class="visuellement-cache">
        ${icone('televerser')}<strong>${imp.lecture ? 'Lecture…' : 'Choisir le fichier'}</strong>
        <span class="aide">Excel (.xlsx), LibreOffice (.ods), CSV — ou glissez-le ici. Depuis Google Sheets : Fichier → Télécharger → Microsoft Excel.</span>
      </label>
      ${imp.erreur ? html`<p class="avert" role="alert">${imp.erreur}</p>` : ''}
    </div>
    <div class="section-feuille">
      <h3>Ou coller les cellules</h3>
      <label class="champ"><span>Sélectionnez le tableau dans le tableur (ou dans Word), copiez, collez ici</span>
        <textarea id="prog-collage" rows="5" data-saisie="prog-collage" placeholder="Chapitre	Séance	Durée&#10;Le vivant	Sortie dehors	1">${imp.collage}</textarea></label>
      <div class="outils"><button class="btn" data-action="prog-lire-collage" ${imp.collage.trim() ? '' : 'disabled'}>Lire le collage</button></div>
    </div>
    <div class="section-feuille">
      <h3>Pas encore de fichier ?</h3>
      <p class="aide">Le modèle vierge a déjà les colonnes que le Carnet reconnaît, avec trois lignes d'exemple. Rien n'est obligatoire sauf l'intitulé : une durée vide compte une séance.</p>
      <div class="outils"><button class="btn mini" data-action="prog-modele">${icone('telecharger')} Télécharger le modèle (Excel)</button></div>
    </div>`;
}

function ongletsFeuilles() {
  if (imp.feuilles.length < 2) return '';
  return html`<div class="onglets-feuilles" role="tablist" aria-label="Feuilles du classeur">${imp.feuilles.map((f, k) => html`<button role="tab" aria-selected="${k === imp.k}" data-action="prog-onglet" data-k="${k}">${f.faite ? icone('valider') : ''}${f.nom}</button>`)}</div>`;
}

function tableColonnes(f) {
  const utiles = f.colonnes.filter((c) => c.exemples.length || (f.entete >= 0 && String((f.lignes[f.entete] || [])[c.i] || '').trim()));
  return html`<div class="colonnes-import">${utiles.map((c) => html`<label class="colonne-import${c.role === 'ignorer' ? ' ignoree' : ''}">
      <span class="nom">${c.libelle}</span>
      <span class="exemples">${c.exemples.length ? c.exemples.join(' · ') : '—'}</span>
      <select id="prog-role-${c.i}" data-change="prog-role" data-i="${c.i}" aria-label="Rôle de la colonne ${c.libelle}">${Object.entries(ROLES).map(([r, lib]) => html`<option value="${r}"${c.role === r ? ' selected' : ''}>${lib}</option>`)}</select>
    </label>`)}</div>`;
}

function apercu(etapes, chapitres) {
  if (!etapes.length) return html`<p class="vide">Aucune étape : choisissez la colonne de l'intitulé ci-dessus.</p>`;
  const lignes = [];
  let ch = null;
  for (const e of etapes.slice(0, APERCU_MAX)) {
    if (e.chapitre && e.chapitre !== ch) { ch = e.chapitre; lignes.push(html`<li class="chapitre">${ch}</li>`); }
    lignes.push(html`<li class="${e.eval ? 'eval' : ''}"><span class="titre">${e.eval ? '✎ ' : ''}${e.titre}</span>
      <span class="meta">${seancesLisible(e.duree)}${e.jalons.length ? ` · ${e.jalons.length} jalons` : ''}${e.cible ? ` · semaine du ${dateCourte(e.cible)}` : ''}${e.devoirs ? ' · travail à faire' : ''}${e.afaire ? ' · matériel' : ''}</span></li>`);
  }
  const total = etapes.reduce((s, e) => s + e.duree, 0);
  return html`<p class="aide resume-import"><b>${etapes.length} étape${etapes.length > 1 ? 's' : ''}</b>${chapitres.length ? ` en ${chapitres.length} chapitre${chapitres.length > 1 ? 's' : ''}` : ''} · ${seancesLisible(total)} en tout · ${etapes.filter((e) => e.eval).length} évaluation(s)</p>
    <ol class="apercu-import">${lignes}${etapes.length > APERCU_MAX ? html`<li class="vide">… et ${etapes.length - APERCU_MAX} autres</li>` : ''}</ol>`;
}

function ecranFeuille() {
  const f = imp.feuilles[imp.k];
  const { etapes, chapitres, avertissements } = resultat(f);
  const classes = classesDuNiveau(f.niveau);
  const nbLignes = Math.min(15, f.lignes.length);
  const v = calc().v;
  const dejaRemplies = [...f.cibles].filter((k) => (v.classes[k].file || []).length);
  return html`${ongletsFeuilles()}
    <div class="grille-champs">
      <label class="champ"><span>Niveau de cette feuille</span><select id="prog-niveau" data-change="prog-niveau">${NIVEAUX.map((n) => html`<option${n === f.niveau ? ' selected' : ''}>${n}</option>`)}</select></label>
      <label class="champ"><span>Ligne des titres de colonnes</span><select id="prog-entete" data-change="prog-entete">
        <option value="-1"${f.entete < 0 ? ' selected' : ''}>Aucune (pas de titres)</option>
        ${Array.from({ length: nbLignes }, (_, k) => html`<option value="${k}"${f.entete === k ? ' selected' : ''}>Ligne ${k + 1} : ${(f.lignes[k] || []).filter((x) => String(x).trim()).slice(0, 3).join(' · ').slice(0, 50) || '(vide)'}</option>`)}
      </select></label>
    </div>
    <details class="section-feuille"${imp.voirColonnes || !etapes.length ? ' open' : ''}><summary data-action="prog-voir-colonnes"><b>Colonnes reconnues</b> <span class="aide">— à corriger si besoin</span></summary>${tableColonnes(f)}</details>
    <div class="section-feuille"><h3>Ce que le Carnet en tire</h3>${apercu(etapes, chapitres)}
      ${avertissements.length ? html`<details><summary class="aide">${avertissements.length} ligne(s) à vérifier</summary><ul class="aide">${avertissements.slice(0, 30).map((a) => html`<li>${a}</li>`)}</ul></details>` : ''}</div>
    <div class="section-feuille"><h3>Pour quelles classes</h3>
      ${classes.length ? html`<div class="outils">${classes.map((k) => html`<label class="coche"><input type="checkbox" id="prog-cible-${k}" data-change="prog-cible" value="${k}"${f.cibles.has(k) ? ' checked' : ''}><span>${nomClasse(k)}</span></label>`)}</div>`
        : html`<p class="aide">Aucune classe de ${f.niveau} n'est suivie : les étapes seront rangées au niveau, prêtes pour « Reprendre une étape ».</p>`}
      ${dejaRemplies.length ? html`<div class="segmente" role="group" aria-label="Si la classe a déjà des étapes">
          <button data-action="prog-mode" data-mode="ajouter" aria-pressed="${f.mode === 'ajouter'}">Ajouter à la suite</button>
          <button data-action="prog-mode" data-mode="remplacer" aria-pressed="${f.mode === 'remplacer'}">Remplacer la file</button></div>
        <p class="aide">${f.mode === 'remplacer'
          ? 'La file prend l’ordre du tableur. Une étape au même intitulé garde son suivi ; les autres sortent de la file mais restent au niveau.'
          : 'Les étapes absentes de la file sont ajoutées à la fin ; une étape au même intitulé est complétée, pas dupliquée.'}</p>` : ''}
    </div>`;
}

function contenu() {
  if (!imp) return { titre: '', corps: '' };
  if (!imp.feuilles.length) {
    return { titre: 'Importer une programmation', corps: ecranSource(), pied: html`<button class="btn" data-action="fermer-feuille">Fermer</button>` };
  }
  const f = imp.feuilles[imp.k];
  const n = resultat(f).etapes.length;
  const reste = imp.feuilles.filter((x) => !x.faite).length;
  return {
    titre: `Importer « ${imp.nom} »`,
    corps: ecranFeuille(),
    pied: html`<button class="btn discret" data-action="prog-autre">Autre fichier</button>
      <button class="btn" data-action="fermer-feuille">${imp.feuilles.some((x) => x.faite) ? 'Terminer' : 'Annuler'}</button>
      <button class="btn plein" data-action="prog-appliquer" ${n && !f.faite ? '' : 'disabled'}>${icone('valider')} ${f.faite ? 'Feuille importée' : `Importer ${n} étape${n > 1 ? 's' : ''}${reste > 1 ? ' de cette feuille' : ''}`}</button>`,
  };
}

/**
 * Ouvre l'import. `fichier` (facultatif) est lu tout de suite ; `surFin(importe)` est appelé à la
 * fermeture, avec vrai si au moins une feuille a été importée.
 */
export function ouvrirImportProgression({ fichier, surFin } = {}) {
  imp = { nom: '', feuilles: [], k: 0, lecture: false, erreur: '', collage: '', voirColonnes: false, surFin };
  ouvrirFeuille(contenu, {
    classe: 'large',
    surFermeture: () => { const x = imp; imp = null; if (x && x.surFin) x.surFin(x.feuilles.some((f) => f.faite)); },
  });
  if (fichier) lireFichier(fichier);
}

async function lireFichier(fichier) {
  if (!imp) return;
  imp.lecture = true; imp.erreur = '';
  redessinerFeuille(true);
  try {
    const { feuilles } = await lireTableur(new Uint8Array(await fichier.arrayBuffer()), fichier.name);
    if (!imp) return;
    imp.lecture = false;
    ouvrirAvec(fichier.name.replace(/\.[^.]+$/, ''), feuilles);
  } catch (e) {
    if (!imp) return;
    imp.lecture = false;
    imp.erreur = e.code ? e.message : `Ce fichier n'a pas pu être lu (${e.message}).`;
    redessinerFeuille(true);
  }
}

// ---------- Actions ----------
actions['prog-importer'] = () => ouvrirImportProgression();
changements['prog-fichier'] = (el) => { const f = el.files && el.files[0]; if (f) lireFichier(f); };
saisies['prog-collage'] = (el) => {
  if (!imp) return;
  const avant = !!imp.collage.trim();
  imp.collage = el.value;
  // Le bouton « Lire le collage » s'active sans redessiner la zone de saisie.
  if (avant !== !!el.value.trim()) { const b = document.querySelector('[data-action="prog-lire-collage"]'); if (b) b.disabled = !el.value.trim(); }
};
actions['prog-lire-collage'] = () => {
  if (!imp || !imp.collage.trim()) return;
  const lignes = lireTexteTabule(imp.collage);
  if (!lignes.length) { imp.erreur = 'Le collage est vide.'; redessinerFeuille(true); return; }
  ouvrirAvec('cellules collées', [{ nom: 'Collage', lignes }]);
};
actions['prog-autre'] = () => { if (imp) { imp.feuilles = []; imp.erreur = ''; redessinerFeuille(true); } };
actions['prog-onglet'] = (el) => { if (imp) { imp.k = Number(el.dataset.k) || 0; redessinerFeuille(true); } };
actions['prog-voir-colonnes'] = () => { if (imp) { imp.voirColonnes = !imp.voirColonnes; redessinerFeuille(true); } };
changements['prog-niveau'] = (el) => {
  const f = imp && imp.feuilles[imp.k];
  if (!f) return;
  f.niveau = el.value;
  f.cibles = new Set(classesDuNiveau(f.niveau));
  redessiner(el);
};
changements['prog-entete'] = (el) => {
  const f = imp && imp.feuilles[imp.k];
  if (!f) return;
  const a = analyser(f.lignes, { entete: Number(el.value) });
  f.entete = a.entete; f.colonnes = a.colonnes;
  redessiner(el);
};
changements['prog-role'] = (el) => {
  const f = imp && imp.feuilles[imp.k];
  if (!f) return;
  const i = Number(el.dataset.i), role = el.value;
  // Un rôle à une seule colonne (sauf « ajouter au cahier de textes » et « ne pas importer ») : l'ancienne le perd.
  for (const c of f.colonnes) {
    if (c.i === i) c.role = role;
    else if (c.role === role && !['complement', 'ignorer'].includes(role)) c.role = 'ignorer';
  }
  redessiner(el);
};
changements['prog-cible'] = (el) => {
  const f = imp && imp.feuilles[imp.k];
  if (!f) return;
  if (el.checked) f.cibles.add(el.value); else f.cibles.delete(el.value);
  redessiner(el);
};
actions['prog-mode'] = (el) => { const f = imp && imp.feuilles[imp.k]; if (f) { f.mode = el.dataset.mode; redessinerFeuille(true); } };

actions['prog-appliquer'] = () => {
  const f = imp && imp.feuilles[imp.k];
  if (!f || f.faite) return;
  const { etapes } = resultat(f);
  if (!etapes.length) return;
  const v = calc().v;
  // Une colonne « Niveau » peut répartir une même feuille entre plusieurs niveaux.
  const parNiveau = new Map();
  for (const e of etapes) { const n = e.niveau || f.niveau; if (!parNiveau.has(n)) parNiveau.set(n, []); parNiveau.get(n).push(e); }
  let nouvelles = 0, reprises = 0, oublies = 0;
  const touchees = [];
  for (const [niveau, liste] of parNiveau) {
    const cibles = niveau === f.niveau ? [...f.cibles] : classesDuNiveau(niveau);
    const p = planImport(v, liste, { niveau, cibles, mode: f.mode, nouvelId });
    for (const [eid, doc] of Object.entries(p.etapes)) ecrireDoc(`etapes/${eid}`, doc);
    for (const [code, x] of Object.entries(p.classes)) {
      modifierDoc(`classes/${code}`, (cl) => { cl.file = x.file; if (x.depart) cl.depart = x.depart; else delete cl.depart; });
      touchees.push(code);
    }
    nouvelles += p.resume.nouvelles; reprises += p.resume.reprises; oublies += p.oublies.length;
  }
  f.faite = true;
  const suivante = imp.feuilles.findIndex((x) => !x.faite);
  if (suivante >= 0) imp.k = suivante;
  redessinerFeuille(true);
  toast(`${nouvelles} étape(s) créée(s)${reprises ? `, ${reprises} complétée(s)` : ''}${touchees.length ? ` · ${touchees.map((k) => nomClasse(k)).join(', ')}` : ' · rangées au niveau'}${oublies ? ` · ${oublies} validation(s) raccrochée(s) à la même place : à vérifier` : ''}.`, { duree: 6000 });
};

// ---------- Exporter, modèle ----------
const nomFichier = (s) => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();

actions['prog-modele'] = async () => {
  const o = await ecrireXlsx([{ nom: 'Programmation', lignes: modeleProgrammation() }]);
  telecharger('Programmation - modèle Carnet.xlsx', o, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
};

/** Toutes les classes suivies d'un niveau, une feuille chacune ; ou une seule classe. */
actions['prog-exporter'] = async (el) => {
  const v = calc().v;
  const codes = el.dataset.code ? [el.dataset.code] : Object.keys(v.classes).filter((k) => !v.classes[k].masquee && (v.classes[k].file || []).length);
  if (!codes.length) { toast('Aucune file d’étapes à exporter.'); return; }
  const feuilles = codes.map((k) => ({ nom: nomClasse(k), lignes: lignesExport(v, k) }));
  const o = await ecrireXlsx(feuilles);
  const nom = codes.length === 1 ? `Progression ${nomFichier(nomClasse(codes[0]))}.xlsx` : 'Progressions - Carnet de bord.xlsx';
  telecharger(nom, o, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Fichier Excel prêt : il se réimporte tel quel, chez vous ou chez un collègue.');
};

// Déposer un fichier n'importe où sur la fenêtre d'import.
if (typeof document !== 'undefined') {
  document.addEventListener('dragover', (e) => { if (imp && !imp.feuilles.length) { e.preventDefault(); document.getElementById('depot-programmation')?.classList.add('survol'); } });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.getElementById('depot-programmation')?.classList.remove('survol'); });
  document.addEventListener('drop', (e) => {
    if (!imp || imp.feuilles.length) return;
    e.preventDefault();
    document.getElementById('depot-programmation')?.classList.remove('survol');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) lireFichier(f);
  });
}

export { fermerFeuille };
</script>
<script type="text/x-carnet-module" data-module="carnet/js/demo.js">
// Un emploi du temps de démonstration, écrit exactement comme Pronote l'exporte (titres,
// descriptions, demi-groupes, élèves d'ULIS, accompagnante, vacances), pour que la démo passe
// par le même chemin que les vraies données. Tout est fictif et daté autour de la semaine en cours.
import { instantDe, ajouteJours, lundiDe, aujourdhui } from 'carnet/js/dates.js';

const MATIERE = 'SCIENCES VIE & TERRE';

// [jour 0-4, début, fin, classe, groupe ('' = entière), salle, accompagnant, parties ULIS]
const SEMAINE = [
  [0, '09:20', '10:15', '5G3', 'P2', '107', 'Mme LAMBERT C.'],
  [0, '10:35', '11:30', '5G3', 'P1', '107'],
  [0, '13:55', '14:50', '4G2', '', '107'],
  [1, '10:35', '11:30', '5G1', '', '107'],
  [1, '12:55', '13:50', '6G2', '', '102'],
  [1, '15:05', '16:00', '6G1', '', '107'],
  [2, '08:25', '09:20', '5G1', 'P2', '107'],
  [2, '09:20', '10:15', '5G1', 'P1', '107'],
  [2, '11:30', '12:25', '3G1', '', '107'],
  [3, '08:25', '09:20', '6G2', 'P2', '107'],
  [3, '09:20', '10:15', '6G2', 'P1', '107'],
  [3, '10:35', '11:30', '5G3', '', '107', 'Mme LAMBERT C.', ['ULIS'] ],
  [3, '11:30', '12:25', '3G1', '', '107'],
  [4, '08:25', '09:20', '6G1', 'P1', '107'],
  [4, '09:20', '10:15', '6G1', 'P2', '107'],
  [4, '10:35', '11:30', '4G2', '', '107'],
];

function coursPronote(jour, h0, h1, classe, groupe, salle, accompagnant, ulis, fuseau, annule) {
  const lignes = [`Matière : ${MATIERE}`, 'Professeur : DUPONT A.'];
  let titre;
  if (groupe) {
    lignes.push(`Groupe : [${classe}${groupe}]`, `Partie de classe : <${classe}> ${classe}${groupe}`);
    titre = `${MATIERE} - [${classe}${groupe}] - <${classe}> ${classe}${groupe}`;
  } else if (ulis) {
    const nom = `${classe[0]}0${classe.slice(2)}`;
    const parties = [`<${classe}> ${nom}_G`, `<${classe}> ${nom}_ULIS ARAGO`];
    lignes.push(`Parties de classe : ${parties.join(', ')}`);
    titre = `${MATIERE} - ${parties.join(', ')}`;
  } else {
    lignes.push(`Classe : ${classe}`);
    titre = `${MATIERE} - ${classe}`;
  }
  lignes.push(`Salle : ${salle}`);
  if (accompagnant) lignes.push(`Accompagnant : ${accompagnant}`);
  if (annule) lignes.push('Statut : Cours annulé');
  return {
    id: `demo-${classe}${groupe}-${jour}-${h0}`,
    titre: annule ? `Cours annulé - ${titre}` : titre,
    description: lignes.join('\n'), lieu: salle, statut: 'confirmed', journee: false,
    debut: instantDe(jour, h0, fuseau), fin: instantDe(jour, h1, fuseau), jour0: jour, jour1: jour,
  };
}

const evt = (id, titre, jour, h0, h1, fuseau, description = '') => ({
  id, titre, description, lieu: '', statut: 'confirmed', journee: false,
  debut: instantDe(jour, h0, fuseau), fin: instantDe(jour, h1, fuseau), jour0: jour, jour1: jour,
});
const journee = (id, titre, j0, j1, description = '') => ({ id, titre, description, lieu: '', statut: 'confirmed', journee: true, debut: null, fin: null, jour0: j0, jour1: j1 });

/** Événements Pronote et personnels de la démonstration, de deux semaines avant à huit après. */
export function evenementsDemo(fuseau) {
  const lundi = lundiDe(aujourdhui(fuseau));
  const pronote = [], perso = [];
  const debutVacances = ajouteJours(lundi, 5 * 7 - 2); // un samedi, dans quatre semaines et demie
  const finVacances = ajouteJours(debutVacances, 15);
  for (let s = -2; s <= 8; s++) {
    const l = ajouteJours(lundi, s * 7);
    if (l >= ajouteJours(debutVacances, -1) && l <= finVacances) continue;
    for (const [d, h0, h1, classe, groupe, salle, acc, ulis] of SEMAINE) {
      const jour = ajouteJours(l, d);
      const annule = s === 1 && classe === '3G1' && d === 3; // une sortie des 3e la semaine prochaine
      pronote.push(coursPronote(jour, h0, h1, classe, groupe, salle, acc, ulis, fuseau, annule));
    }
    pronote.push(evt(`demo-com-${s}`, "Heure de com'", l, '09:30', '10:30', fuseau, "Questions à transmettre à l'équipe de direction au plus tard le jeudi."));
    if (s === 0 || s === 2) pronote.push(evt(`demo-cp-${s}`, 'Conseil pédagogique', ajouteJours(l, 1), '17:00', '18:30', fuseau, 'Salle des professeurs.'));
    perso.push(evt(`perso-foot-${s}`, 'Footing', ajouteJours(l, 1), '18:45', '19:45', fuseau));
    perso.push(evt(`perso-dent-${s}`, s === 0 ? 'Dentiste' : 'Piscine', ajouteJours(l, 2), '14:00', '15:00', fuseau));
    perso.push(evt(`perso-repas-${s}`, 'Déjeuner avec Julie', ajouteJours(l, 3), '12:30', '13:30', fuseau));
    perso.push(evt(`perso-marche-${s}`, 'Marché', ajouteJours(l, 5), '10:00', '11:00', fuseau));
  }
  pronote.push(journee('demo-vac', 'Vacances', debutVacances, finVacances));
  pronote.push(journee('demo-parcours', 'PARCOURS CITOYEN : semaine de la laïcité', ajouteJours(lundi, 7), ajouteJours(lundi, 11), 'Activités banalisées en heure de vie de classe.'));
  for (const e of perso) Object.assign(e, { agenda: 'Personnel', agendaId: 'demo-perso', modifiable: true });
  return { pronote, perso, agendas: { 'demo-perso': { nom: 'Personnel', couleur: '#55606e', role: 'owner' } } };
}

const DEMARCHE = ['Situation déclenchante', 'Problème', 'Hypothèses', 'Protocole', 'Résultats', 'Bilan'];
const DOCUMENTAIRE = ['Documents', 'Questions', 'Mise en commun', 'Bilan'];

/** Les données de démonstration : classes et étapes partagées par niveau (sans validations). */
export function donneesDemo(fuseau) {
  const lundi = lundiDe(aujourdhui(fuseau));
  const m = Date.now();
  const docs = {};
  // Le chapitre, le travail à faire et la semaine visée : ce qu'apporte une programmation importée.
  const CHAPITRES = {
    e6a: 'Chapitre 1 — Le vivant et ses caractéristiques', e6f: 'Chapitre 2 — La classification du vivant',
    e5a: 'Chapitre 3 — Respiration et milieux de vie', e5e: 'Chapitre 4 — La nutrition des végétaux',
    e4a: 'Chapitre 1 — Les séismes', e4d: 'Chapitre 2 — Volcans et tectonique des plaques',
    e3a: "Chapitre 1 — L'information génétique", e3d: 'Chapitre 2 — Diversité et stabilité génétique',
  };
  let chapitre = '';
  const etape = (id, e) => {
    chapitre = CHAPITRES[id] || chapitre;
    docs[`etapes/${id}`] = { duree: 1, format: 'indiff', eval: false, insecable: false, jalons: [], photocopies: 0, afaire: '', pronote: '', devoirs: '', cible: '', chapitre, ...e, _m: m };
  };
  // 6e — Le vivant et sa classification
  etape('e6a', { niveau: '6e', titre: 'Activité 1 – Vivant ou non vivant ?', jalons: ['Situation déclenchante', 'Hypothèses', 'Tri des objets', 'Bilan'], pronote: 'Trier des objets et des êtres vivants ; dégager les critères du vivant.' });
  etape('e6b', { niveau: '6e', titre: 'Activité 2 – Les caractéristiques du vivant', duree: 1.5, jalons: DOCUMENTAIRE, photocopies: 2, devoirs: 'Finir le tableau du document 3' });
  etape('e6c', { niveau: '6e', titre: 'Activité 3 – Observer des cellules au microscope', duree: 2, format: 'demi', jalons: ['Protocole', 'Réglage du microscope', 'Observation', "Dessin d'observation", 'Bilan'], afaire: "Microscopes, lames, épiderme d'oignon" });
  etape('e6d', { niveau: '6e', titre: 'Bilan – Le vivant est fait de cellules', duree: 0.5, photocopies: 1, devoirs: 'Apprendre le bilan : l’évaluation porte dessus' });

/**

 * de retard sur la 602 — pour que « Où en sont mes classes » ait quelque chose à montrer.
 */
export function validationsDemo({ creneaux, plan, maintenant, v }) {
  const docs = {}, m = Date.now();
  const parClasse = {};
  // Seuls les cours suivis comptent : ceux d'avant la date de début du suivi n'ont pas de plan.
  for (const cr of creneaux) if (cr.fin <= maintenant && !cr.annule && plan.parCreneau[cr.cle]) (parClasse[cr.code] ||= []).push(cr);
  const aValider = new Set(['5G3', '6G2']);
  for (const [code, liste] of Object.entries(parClasse)) {
    liste.sort((a, b) => a.debut - b.debut);
    const file = plan.parClasse[code].file;
    const n = aValider.has(code) ? liste.length - 1 : liste.length;
    for (let k = 0; k < n; k++) {
      const cr = liste[k], pc = plan.parCreneau[cr.cle];
      const d = pc.segments[pc.segments.length - 1];
      if (!d) continue;
      let i = file.findIndex((it) => it.u === d.u), f = d.a;
      let note = '';
      if (code === '6G1' && k === n - 1) {
        const e = v.etapes[file[i].eid];
        f = Math.max(0, f - 0.5 / (Number(e.duree) || 1));
        const J = (e.jalons || []).length;
        if (J) f = Math.floor(f * J + 1e-6) / J;
        note = 'Beaucoup de questions : mise en commun à finir.';
      }
      docs[`journal/${cr.cle}`] = { code, jour: cr.jour, arret: { u: file[i].u, f: Math.round(f * 1000) / 1000, rang: i }, note, le: new Date(m).toISOString(), _m: m };
    }
  }
  return docs;
}

<script type="text/x-carnet-module" data-module="carnet/js/qr.js">
// QR code (modèle 2, mode octet, correction de niveau M), sans bibliothèque ni réseau : de quoi
// montrer l'adresse du Carnet sur un écran pour qu'un téléphone l'ouvre — le sien, ou celui d'un
// collègue en salle des profs. Versions 1 à 10 : jusqu'à 213 octets, bien plus qu'une adresse.
// L'algorithme suit la norme ISO/IEC 18004 ; le calcul des pénalités reprend celui, devenu la
// référence, de la bibliothèque de Project Nayuki.

// Par version : [octets de correction par bloc, blocs du groupe 1, octets de données par bloc
// du groupe 1, blocs du groupe 2, octets de données par bloc du groupe 2] — niveau M.
const BLOCS_M = [null,
  [10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
  [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44],
];
// Centres des motifs d'alignement, par version.
const ALIGNEMENT = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
const NIVEAU_M = 0; // bits du niveau de correction dans l'information de format (L=1, M=0, Q=3, H=2)

// Corps de Galois à 256 éléments (polynôme 0x11D), pour le code de Reed-Solomon.
const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);

function generateur(n) {
  let g = [1];
  for (let i = 0; i < n; i++) {
    const s = new Array(g.length + 1).fill(0);
    for (let j = 0; j < g.length; j++) { s[j] ^= g[j]; s[j + 1] ^= mul(g[j], EXP[i]); }
    g = s;
  }
  return g;
}

/** Octets de correction : reste de la division des données par le polynôme générateur. */
export function correction(donnees, n) {
  const g = generateur(n);
  const r = [...donnees, ...new Array(n).fill(0)];
  for (let i = 0; i < donnees.length; i++) {
    const c = r[i];
    if (c) for (let j = 1; j < g.length; j++) r[i + j] ^= mul(g[j], c);
  }
  return r.slice(donnees.length);
}

const capacite = (v) => { const [, b1, d1, b2, d2] = BLOCS_M[v]; return b1 * d1 + b2 * d2; };
const bitsCompte = (v) => (v < 10 ? 8 : 16);

function versionPour(n) {
  for (let v = 1; v < BLOCS_M.length; v++) if (4 + bitsCompte(v) + 8 * n <= capacite(v) * 8) return v;
  throw new Error('Texte trop long pour un QR code de version 10.');
}

function octetsDeDonnees(octets, v) {
  const bits = [];
  const pousser = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  pousser(0b0100, 4); // mode octet
  pousser(octets.length, bitsCompte(v));
  for (const o of octets) pousser(o, 8);
  const max = capacite(v) * 8;
  pousser(0, Math.min(4, max - bits.length)); // terminateur
  while (bits.length % 8) bits.push(0);
  const res = [];
  for (let i = 0; i < bits.length; i += 8) res.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
  for (let k = 0; res.length < capacite(v); k++) res.push(k % 2 ? 0x11 : 0xec);
  return res;
}

function entrelacer(donnees, v) {
  const [ec, b1, d1, b2, d2] = BLOCS_M[v];
  const blocs = [];
  for (let i = 0, k = 0; i < b1 + b2; i++) { const n = i < b1 ? d1 : d2; blocs.push(donnees.slice(k, k + n)); k += n; }
  const corr = blocs.map((b) => correction(b, ec));
  const res = [];
  for (let i = 0; i < Math.max(d1, d2); i++) for (const b of blocs) if (i < b.length) res.push(b[i]);
  for (let i = 0; i < ec; i++) for (const c of corr) res.push(c[i]);
  return res;
}

function bchFormat(masque) {
  const d = (NIVEAU_M << 3) | masque;
  let r = d;
  for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
  return ((d << 10) | r) ^ 0x5412;
}

function bchVersion(v) {
  let r = v;
  for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
  return (v << 12) | r;
}

const MASQUES = [
  (l, c) => (l + c) % 2 === 0,
  (l) => l % 2 === 0,
  (l, c) => c % 3 === 0,
  (l, c) => (l + c) % 3 === 0,
  (l, c) => (Math.floor(l / 2) + Math.floor(c / 3)) % 2 === 0,
  (l, c) => ((l * c) % 2) + ((l * c) % 3) === 0,
  (l, c) => (((l * c) % 2) + ((l * c) % 3)) % 2 === 0,
  (l, c) => (((l + c) % 2) + ((l * c) % 3)) % 2 === 0,
];

/** La matrice de base : motifs fixes posés, zones réservées marquées, données placées. */
function matrice(v, flux) {
  const n = v * 4 + 17;
  const m = Array.from({ length: n }, () => new Array(n).fill(false));
  const fixe = Array.from({ length: n }, () => new Array(n).fill(false));
  const poser = (l, c, noir) => { m[l][c] = noir; fixe[l][c] = true; };

  // Motifs de repérage des trois coins, avec leur liseré blanc.
  for (const [l0, c0] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
    for (let dl = -1; dl <= 7; dl++) {
      for (let dc = -1; dc <= 7; dc++) {
        const l = l0 + dl, c = c0 + dc;
        if (l < 0 || l >= n || c < 0 || c >= n) continue;
        const dedans = dl >= 0 && dl <= 6 && dc >= 0 && dc <= 6;
        poser(l, c, dedans && (dl === 0 || dl === 6 || dc === 0 || dc === 6 || (dl >= 2 && dl <= 4 && dc >= 2 && dc <= 4)));
      }
    }
  }
  // Lignes de synchronisation.
  for (let i = 8; i < n - 8; i++) { poser(6, i, i % 2 === 0); poser(i, 6, i % 2 === 0); }
  // Motifs d'alignement, sauf ceux qui tomberaient sur un motif de repérage.
  const pos = ALIGNEMENT[v], der = pos.length - 1;
  pos.forEach((l, a) => pos.forEach((c, b) => {
    if ((a === 0 && b === 0) || (a === 0 && b === der) || (a === der && b === 0)) return;
    for (let dl = -2; dl <= 2; dl++) for (let dc = -2; dc <= 2; dc++) poser(l + dl, c + dc, Math.max(Math.abs(dl), Math.abs(dc)) !== 1);
  }));
  // Zones de l'information de format (écrite après le choix du masque) et module toujours noir.
  for (let i = 0; i < 9; i++) { fixe[8][i] = true; fixe[i][8] = true; }
  for (let i = 0; i < 8; i++) { fixe[8][n - 1 - i] = true; fixe[n - 1 - i][8] = true; }
  poser(n - 8, 8, true);
  // Information de version, à partir de la version 7.
  if (v >= 7) {
    const bits = bchVersion(v);
    for (let i = 0; i < 18; i++) {
      const noir = ((bits >>> i) & 1) === 1, a = Math.floor(i / 3), b = n - 11 + (i % 3);
      poser(a, b, noir); poser(b, a, noir);
    }
  }
  // Données : en zigzag par paires de colonnes, de droite à gauche, en sautant la colonne 6.
  let k = 0;
  for (let droite = n - 1; droite >= 1; droite -= 2) {
    if (droite === 6) droite = 5;
    const montee = ((droite + 1) & 2) === 0;
    for (let j = 0; j < n; j++) {
      for (let d = 0; d < 2; d++) {
        const c = droite - d, l = montee ? n - 1 - j : j;
        if (fixe[l][c] || k >= flux.length * 8) continue;
        m[l][c] = ((flux[k >>> 3] >>> (7 - (k & 7))) & 1) === 1;
        k++;
      }
    }
  }
  return { n, m, fixe };
}

function appliquerMasque({ n, m, fixe }, masque) {
  const f = MASQUES[masque];
  for (let l = 0; l < n; l++) for (let c = 0; c < n; c++) if (!fixe[l][c] && f(l, c)) m[l][c] = !m[l][c];
}

function poserFormat({ n, m }, masque) {
  const bits = bchFormat(masque), b = (i) => ((bits >>> i) & 1) === 1;
  for (let i = 0; i <= 5; i++) m[i][8] = b(i);
  m[7][8] = b(6); m[8][8] = b(7); m[8][7] = b(8);
  for (let i = 9; i < 15; i++) m[8][14 - i] = b(i);
  for (let i = 0; i < 8; i++) m[8][n - 1 - i] = b(i);
  for (let i = 8; i < 15; i++) m[n - 15 + i][8] = b(i);
  m[n - 8][8] = true;
}

/** Pénalité d'un masque (règles N1 à N4 de la norme, telles que Project Nayuki les calcule). */
function penalite({ n, m }) {
  let total = 0;
  const ajouterHistorique = (longueur, h) => { if (h[0] === 0) longueur += n; h.pop(); h.unshift(longueur); };
  const motifs = (h) => {
    const u = h[1];
    const coeur = u > 0 && h[2] === u && h[3] === u * 3 && h[4] === u && h[5] === u;
    return (coeur && h[0] >= u * 4 && h[6] >= u ? 1 : 0) + (coeur && h[6] >= u * 4 && h[0] >= u ? 1 : 0);
  };
  const terminer = (couleur, longueur, h) => {
    if (couleur) { ajouterHistorique(longueur, h); longueur = 0; }
    ajouterHistorique(longueur + n, h);
    return motifs(h);
  };
  for (const ligneOuColonne of [(i, j) => m[i][j], (i, j) => m[j][i]]) {
    for (let i = 0; i < n; i++) {
      let couleur = false, longueur = 0;
      const h = [0, 0, 0, 0, 0, 0, 0];
      for (let j = 0; j < n; j++) {
        if (ligneOuColonne(i, j) === couleur) {
          longueur++;
          if (longueur === 5) total += 3; else if (longueur > 5) total++;
        } else {
          ajouterHistorique(longueur, h);
          if (!couleur) total += motifs(h) * 40;
          couleur = ligneOuColonne(i, j);
          longueur = 1;
        }
      }
      total += terminer(couleur, longueur, h) * 40;
    }
  }
  for (let l = 0; l < n - 1; l++) {
    for (let c = 0; c < n - 1; c++) {
      const x = m[l][c];
      if (x === m[l][c + 1] && x === m[l + 1][c] && x === m[l + 1][c + 1]) total += 3;
    }
  }
  let noirs = 0;
  for (const ligne of m) for (const x of ligne) if (x) noirs++;
  total += (Math.ceil(Math.abs(noirs * 20 - n * n * 10) / (n * n)) - 1) * 10;
  return total;
}

/**
 * Code un texte. Renvoie { version, masque, taille, modules } où modules[l][c] vaut true pour un
 * module noir. `masque` (0 à 7) force un masque ; sinon le moins pénalisé est retenu.
 */
export function qr(texte, { masque } = {}) {
  const octets = [...new TextEncoder().encode(String(texte))];
  const v = versionPour(octets.length);
  const base = matrice(v, entrelacer(octetsDeDonnees(octets, v), v));
  let choisi = masque;
  if (choisi == null) {
    let meilleure = Infinity;
    for (let k = 0; k < 8; k++) {
      appliquerMasque(base, k); poserFormat(base, k);
      const p = penalite(base);
      if (p < meilleure) { meilleure = p; choisi = k; }
      appliquerMasque(base, k); // le masque est une inversion : l'appliquer deux fois l'annule
    }
  }
  appliquerMasque(base, choisi); poserFormat(base, choisi);
  return { version: v, masque: choisi, taille: base.n, modules: base.m };
}

/**
 * Le QR code en SVG : modules noirs sur fond blanc quel que soit le thème (les lecteurs lisent mal
 * un code inversé), avec la marge blanche de quatre modules que la norme demande.
 */
export function qrSvg(texte, { marge = 4, titre = '' } = {}) {
  const { taille, modules } = qr(texte);
  const cote = taille + 2 * marge;
  let d = '';
  modules.forEach((ligne, l) => {
    for (let c = 0; c < taille; c++) {
      if (!ligne[c]) continue;
      let fin = c;
      while (fin + 1 < taille && ligne[fin + 1]) fin++;
      d += `M${c + marge} ${l + marge}h${fin - c + 1}v1h-${fin - c + 1}z`;
      c = fin;
    }
  });
  const echapper = (s) => String(s).replace(/[&<>"]/g, (x) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[x]));
  return `<svg class="qr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cote} ${cote}" shape-rendering="crispEdges" role="img" aria-label="${echapper(titre || `QR code : ${texte}`)}">`
    + `<rect width="${cote}" height="${cote}" fill="#fff"/><path fill="#111" d="${d}"/></svg>`;
}

<script type="text/x-carnet-module" data-module="carnet/js/tableur.js">
// Lecture d'un tableur sans bibliothèque : .xlsx (Excel, Numbers, Google Sheets), .ods
// (LibreOffice), .csv et .tsv, et le copier-coller de cellules. Ce qu'il en sort est toujours la
// même chose : des feuilles, chacune un tableau de lignes, chaque ligne un tableau de textes.
//
// Un .xlsx ou un .ods est un dossier zippé de fichiers XML : on lit le zip (DecompressionStream,
// présent dans les navigateurs et dans Node), puis le XML avec un petit lecteur maison, le même
// partout (DOMParser n'existe pas sous Node). Les dates deviennent « AAAA-MM-JJ », les cellules
// fusionnées sur plusieurs lignes répètent leur valeur dans chaque ligne (une colonne « Chapitre »
// fusionnée reste lisible ligne par ligne). Aucune formule n'est calculée : on lit la dernière
// valeur enregistrée par le tableur.

const MAX_LIGNES = 2000, MAX_COLONNES = 40, MAX_OCTETS = 40 * 1024 * 1024;

export class ErreurTableur extends Error {
  constructor(message, code) { super(message); this.code = code; }
}

// ---------- Zip ----------

const u16 = (o, i) => o[i] | (o[i + 1] << 8);
const u32 = (o, i) => (o[i] | (o[i + 1] << 8) | (o[i + 2] << 16) | (o[i + 3] << 24)) >>> 0;

/** Les entrées d'un zip : nom → { methode, taille, debut, compresse }. */
export function entreesZip(octets) {
  let fin = -1;
  for (let i = octets.length - 22; i >= Math.max(0, octets.length - 22 - 65535); i--) {
    if (u32(octets, i) === 0x06054b50) { fin = i; break; }
  }
  if (fin < 0) throw new ErreurTableur('Ce fichier zip est incomplet ou abîmé.', 'zip');
  const n = u16(octets, fin + 10);
  let p = u32(octets, fin + 16);
  const entrees = new Map(), noms = new TextDecoder();
  for (let k = 0; k < n && p + 46 <= octets.length; k++) {
    if (u32(octets, p) !== 0x02014b50) break;
    const methode = u16(octets, p + 10), compresse = u32(octets, p + 20), taille = u32(octets, p + 24);
    const lNom = u16(octets, p + 28), lExtra = u16(octets, p + 30), lComm = u16(octets, p + 32);
    const local = u32(octets, p + 42);
    const nom = noms.decode(octets.subarray(p + 46, p + 46 + lNom));
    if (u32(octets, local) === 0x04034b50) {
      const debut = local + 30 + u16(octets, local + 26) + u16(octets, local + 28);
      entrees.set(nom, { methode, taille, compresse, debut });
    }
    p += 46 + lNom + lExtra + lComm;
  }
  return entrees;
}

/** Décompresse une entrée (stockée ou « deflate »), sans dépasser une taille raisonnable. */
export async function extraire(octets, entree) {
  const brut = octets.subarray(entree.debut, entree.debut + entree.compresse);
  if (entree.methode === 0) return brut;
  if (entree.methode !== 8) throw new ErreurTableur('Ce fichier utilise une compression inconnue.', 'zip');
  if (entree.taille > MAX_OCTETS) throw new ErreurTableur('Ce fichier est trop gros pour un tableur de progression.', 'taille');
  const flux = new Blob([brut]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const lecteur = flux.getReader(), morceaux = [];
  let total = 0;
  for (;;) {
    const { done, value } = await lecteur.read();
    if (done) break;
    total += value.length;
    if (total > MAX_OCTETS) { lecteur.cancel(); throw new ErreurTableur('Ce fichier est trop gros pour un tableur de progression.', 'taille'); }
    morceaux.push(value);
  }
  const res = new Uint8Array(total);
  let k = 0;
  for (const m of morceaux) { res.set(m, k); k += m.length; }
  return res;
}

async function texteZip(octets, entrees, nom) {
  const e = entrees.get(nom);
  return e ? new TextDecoder().decode(await extraire(octets, e)) : null;
}

// ---------- XML ----------

const ENTITES = { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" };
export const decoderXml = (s) => String(s).replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (t, e) => {
  if (e[0] === '#') {
    const n = e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
    return Number.isFinite(n) && n > 0 && n < 0x110000 ? String.fromCodePoint(n) : t;
  }
  return ENTITES[e.toLowerCase()] ?? t;
});

/**
 * Découpe un XML en jetons : ['o', nom, attributs, autoFermant], ['f', nom], ['t', texte].
 * Les espaces de noms restent dans les noms (« table:table-cell »), on les compare tels quels.
 */
export function* jetonsXml(xml) {
  const n = xml.length;
  let i = 0;
  while (i < n) {
    const lt = xml.indexOf('<', i);
    if (lt < 0) { yield ['t', decoderXml(xml.slice(i))]; return; }
    if (lt > i) yield ['t', decoderXml(xml.slice(i, lt))];
    if (xml.startsWith('<\!--', lt)) { const f = xml.indexOf('-->', lt + 4); i = f < 0 ? n : f + 3; continue; }
    if (xml.startsWith('<![CDATA[', lt)) {
      const f = xml.indexOf(']]>', lt + 9);
      yield ['t', xml.slice(lt + 9, f < 0 ? n : f)];
      i = f < 0 ? n : f + 3;
      continue;
    }
    if (xml[lt + 1] === '?' || xml[lt + 1] === '!') { const f = xml.indexOf('>', lt); i = f < 0 ? n : f + 1; continue; }
    // Fin de la balise, en sautant les « > » écrits entre guillemets dans les attributs.
    let j = lt + 1, guillemet = '';
    for (; j < n; j++) {
      const c = xml[j];
      if (guillemet) { if (c === guillemet) guillemet = ''; } else if (c === '"' || c === "'") guillemet = c; else if (c === '>') break;
    }
    const brut = xml.slice(lt + 1, j);
    i = j + 1;
    if (brut[0] === '/') { yield ['f', brut.slice(1).trim()]; continue; }
    const auto = brut.endsWith('/');
    const corps = auto ? brut.slice(0, -1) : brut;
    const m = corps.match(/^\s*([^\s/>]+)/);
    if (!m) continue;
    const attrs = {};
    const re = /([^\s=/]+)\s*=\s*("([^"]*)"|'([^']*)')/g;
    let a;
    while ((a = re.exec(corps.slice(m[0].length)))) attrs[a[1]] = decoderXml(a[3] ?? a[4] ?? '');
    yield ['o', m[1], attrs, auto];
  }
}

// ---------- Cellules ----------

/** « B12 » → { l: 11, c: 1 } (à partir de 0). */
export function adresse(ref) {
  const m = String(ref || '').match(/^\$?([A-Z]{1,3})\$?(\d+)$/i);
  if (!m) return null;
  let c = 0;
  for (const ch of m[1].toUpperCase()) c = c * 26 + (ch.charCodeAt(0) - 64);
  return { l: Number(m[2]) - 1, c: c - 1 };
}

/** Numéro de série Excel → « AAAA-MM-JJ » (calendrier de 1900, celui de tous les Excel récents). */
export function dateExcel(serie) {
  const n = Number(serie);
  if (!Number.isFinite(n) || n < 1 || n > 2958465) return null;
  const ms = Math.round((Math.floor(n) - 25569) * 864e5);
  return new Date(ms).toISOString().slice(0, 10);
}

const FORMATS_DATE = new Set([14, 15, 16, 17, 22, 27, 28, 29, 30, 31, 34, 35, 36, 50, 51, 52, 53, 54, 57, 58]);
const FORMATS_HEURE = new Set([18, 19, 20, 21, 45, 46, 47]);
const sansLitteraux = (code) => String(code || '').replace(/"[^"]*"|\[(?![hms]\])[^\]]*\]|\\./gi, '').toLowerCase();
/** Un code de format de nombre parle-t-il d'une date (et pas seulement d'une heure) ? */
export function formatEstDate(code) {
  const sans = sansLitteraux(code);
  return /[dy]/.test(sans) || /(^|[^h:])m{3,}/.test(sans);
}
/** … ou d'une heure, d'une durée (« h:mm », « [h]:mm ») ? */
export function formatEstHeure(code) {
  const sans = sansLitteraux(code);
  return !formatEstDate(code) && /h|s/.test(sans.replace(/\[|\]/g, ''));
}

/** Une fraction de jour (0,0625) → « 1h30 » : une durée tapée « 1:30 » dans le tableur. */
export function heureDepuisFraction(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || n < 0) return null;
  const minutes = Math.round(n * 24 * 60);
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return `${h}h${String(m).padStart(2, '0')}`;
}

function nombreLisible(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  // 1.4999999999 → 1.5 : on garde ce que la personne a tapé, pas l'arrondi binaire.
  return String(Math.round(n * 1e9) / 1e9);
}

/** Range une grille clairsemée (Map ligne → Map colonne → texte) en tableau de lignes. */
function versLignes(grille, fusions = []) {
  // Une cellule fusionnée sur plusieurs lignes : sa valeur vaut pour chaque ligne de la fusion.
  for (const f of fusions) {
    if (f.l1 <= f.l0) continue;
    const v = grille.get(f.l0) && grille.get(f.l0).get(f.c0);
    if (v == null || v === '') continue;
    for (let l = f.l0 + 1; l <= Math.min(f.l1, MAX_LIGNES); l++) {
      if (!grille.has(l)) grille.set(l, new Map());
      const ligne = grille.get(l);
      if (!ligne.get(f.c0)) ligne.set(f.c0, v);
    }
  }
  const nl = Math.min(MAX_LIGNES, grille.size ? Math.max(...grille.keys()) + 1 : 0);
  const lignes = [];
  for (let l = 0; l < nl; l++) {
    const ligne = grille.get(l);
    if (!ligne || !ligne.size) { lignes.push([]); continue; }
    const nc = Math.min(MAX_COLONNES, Math.max(...ligne.keys()) + 1);
    const t = [];
    for (let c = 0; c < nc; c++) t.push(ligne.has(c) ? String(ligne.get(c)) : '');
    lignes.push(t);
  }
  return nettoyer(lignes);
}

/** Retire les espaces de bord, les colonnes vides en bout de ligne et les lignes vides finales. */
export function nettoyer(lignes) {
  const res = lignes.slice(0, MAX_LIGNES).map((l) => {
    const t = l.slice(0, MAX_COLONNES).map((v) => String(v ?? '').replace(/\r\n?/g, '\n').replace(/[ \t ]+$/gm, '').trim());
    while (t.length && !t[t.length - 1]) t.pop();
    return t;
  });
  while (res.length && !res[res.length - 1].length) res.pop();
  return res;
}

// ---------- Excel (.xlsx) ----------

function lireChainesPartagees(xml) {
  const res = [];
  if (!xml) return res;
  let courante = null, dansT = false, phonetique = 0;
  for (const [type, nom, attrs, auto] of jetonsXml(xml)) {
    if (type === 'o') {
      if (nom === 'si') { courante = ''; if (auto) { res.push(''); courante = null; } } else if (nom === 'rPh') phonetique++; else if (nom === 't' && !auto) dansT = true;
    } else if (type === 'f') {
      if (nom === 'si') { res.push(courante ?? ''); courante = null; } else if (nom === 'rPh') phonetique--; else if (nom === 't') dansT = false;
    } else if (type === 't' && dansT && courante != null && !phonetique) courante += nom;
  }
  return res;
}

/** Pour chaque style de cellule : 'date', 'heure' ou '' (un nombre ordinaire). */
function lireStyles(xml) {
  const formats = new Map(), genres = [];
  if (!xml) return genres;
  let dansXfs = false;
  for (const [type, nom, attrs] of jetonsXml(xml)) {
    if (type === 'o' && nom === 'numFmt') formats.set(Number(attrs.numFmtId), attrs.formatCode || '');
    else if (type === 'o' && nom === 'cellXfs') dansXfs = true;
    else if (type === 'f' && nom === 'cellXfs') dansXfs = false;
    else if (type === 'o' && nom === 'xf' && dansXfs) {
      const id = Number(attrs.numFmtId || 0), code = formats.get(id);
      genres.push(FORMATS_DATE.has(id) || (code != null && formatEstDate(code)) ? 'date'
        : FORMATS_HEURE.has(id) || (code != null && formatEstHeure(code)) ? 'heure' : '');
    }
  }
  return genres;
}

function lireFeuilleXlsx(xml, chaines, genres) {
  const grille = new Map(), fusions = [];
  let ligneCourante = -1, cellule = null, champ = '', dansIs = false;
  const poser = () => {
    if (!cellule || cellule.l >= MAX_LIGNES || cellule.c >= MAX_COLONNES) return;
    let v = '';
    const { t, s } = cellule;
    if (t === 's') v = chaines[Number(cellule.v)] ?? '';
    else if (t === 'inlineStr') v = cellule.is;
    else if (t === 'b') v = cellule.v === '1' ? 'VRAI' : cellule.v === '0' ? 'FAUX' : '';
    else if (t === 'str' || t === 'e') v = cellule.v;
    else if (cellule.v !== '') {
      v = genres[s] === 'date' ? (dateExcel(cellule.v) || nombreLisible(cellule.v))
        : genres[s] === 'heure' ? (heureDepuisFraction(cellule.v) || nombreLisible(cellule.v)) : nombreLisible(cellule.v);
    }
    if (v === '') return;
    if (!grille.has(cellule.l)) grille.set(cellule.l, new Map());
    grille.get(cellule.l).set(cellule.c, v);
  };
  let colSuivante = 0;
  for (const [type, nom, attrs, auto] of jetonsXml(xml)) {
    if (type === 'o') {
      if (nom === 'row') {
        ligneCourante = attrs.r ? Number(attrs.r) - 1 : ligneCourante + 1;
        colSuivante = 0;
      } else if (nom === 'c') {
        const a = adresse(attrs.r) || { l: Math.max(0, ligneCourante), c: colSuivante };
        cellule = { l: a.l, c: a.c, t: attrs.t || 'n', s: Number(attrs.s || 0), v: '', is: '' };
        colSuivante = a.c + 1;
        if (auto) { poser(); cellule = null; }
      } else if (nom === 'v' || (nom === 't' && dansIs)) { champ = nom; } else if (nom === 'is') dansIs = true;
      else if (nom === 'mergeCell' && attrs.ref) {
        const [a, b] = attrs.ref.split(':').map(adresse);
        if (a && b) fusions.push({ l0: a.l, c0: a.c, l1: b.l, c1: b.c });
      }
    } else if (type === 'f') {
      if (nom === 'c') { poser(); cellule = null; } else if (nom === 'is') dansIs = false;
      if (nom === champ) champ = '';
    } else if (type === 't' && cellule) {
      if (champ === 'v') cellule.v += nom;
      else if (champ === 't' && dansIs) cellule.is += nom;
    }
  }
  return versLignes(grille, fusions);
}

function cheminRelatif(base, cible) {
  if (cible.startsWith('/')) return cible.slice(1);
  const parts = base.split('/'); parts.pop();
  for (const p of cible.split('/')) { if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p); }
  return parts.join('/');
}

async function lireXlsx(octets, entrees) {
  const classeur = await texteZip(octets, entrees, 'xl/workbook.xml');
  if (!classeur) throw new ErreurTableur('Ce fichier zip n’est pas un classeur Excel.', 'format');
  const liens = await texteZip(octets, entrees, 'xl/_rels/workbook.xml.rels') || '';
  const cibles = {};
  for (const [type, nom, attrs] of jetonsXml(liens)) if (type === 'o' && nom === 'Relationship') cibles[attrs.Id] = attrs.Target;
  const declarees = [];
  for (const [type, nom, attrs] of jetonsXml(classeur)) {
    if (type !== 'o' || nom !== 'sheet') continue;
    const rid = Object.entries(attrs).find(([k]) => /(^|:)id$/i.test(k) && k !== 'sheetId');
    const cible = rid && cibles[rid[1]];
    declarees.push({ nom: attrs.name || `Feuille ${declarees.length + 1}`, chemin: cible ? cheminRelatif('xl/workbook.xml', cible) : `xl/worksheets/sheet${declarees.length + 1}.xml`, masquee: attrs.state === 'hidden' || attrs.state === 'veryHidden' });
  }
  const chaines = lireChainesPartagees(await texteZip(octets, entrees, 'xl/sharedStrings.xml'));
  const genres = lireStyles(await texteZip(octets, entrees, 'xl/styles.xml'));
  const feuilles = [];
  for (const d of declarees) {
    if (d.masquee) continue;
    const xml = await texteZip(octets, entrees, d.chemin);
    if (xml) feuilles.push({ nom: d.nom, lignes: lireFeuilleXlsx(xml, chaines, genres) });
  }
  return feuilles;
}

// ---------- LibreOffice (.ods) ----------

function lireOds(xml) {
  const feuilles = [];
  let feuille = null, grille = null, l = -1, c = 0, repeteLignes = 1, ligneTampon = null;
  let cellule = null, profondeurP = 0, annotation = 0, verticales = new Map(); // colonne → { v, reste }
  // Une feuille masquée a un style de tableau « table:display=false » (déclaré avant les feuilles).
  const stylesMasques = new Set();
  let styleTableau = null;
  const finirCellule = () => {
    if (!cellule) return;
    const { valeur, colonnes, lignes } = cellule;
    for (let k = 0; k < Math.min(colonnes, MAX_COLONNES); k++) {
      if (valeur !== '' && c + k < MAX_COLONNES) ligneTampon.set(c + k, valeur);
    }
    if (lignes > 1 && valeur !== '') verticales.set(c, { v: valeur, reste: lignes - 1 });
    c += colonnes;
    cellule = null;
  };
  const finirLigne = () => {
    if (!ligneTampon) return;
    const fois = ligneTampon.size ? Math.min(repeteLignes, MAX_LIGNES) : Math.min(repeteLignes, 50);
    for (let k = 0; k < fois && l + 1 < MAX_LIGNES; k++) {
      l++;
      const ligne = new Map(ligneTampon);
      grille.set(l, ligne);
    }
    if (fois < repeteLignes) l += repeteLignes - fois;
    ligneTampon = null;
  };
  for (const [type, nom, attrs, auto] of jetonsXml(xml)) {
    if (type === 'o') {
      if (nom === 'style:style') styleTableau = attrs['style:family'] === 'table' ? attrs['style:name'] : null;
      else if (nom === 'style:table-properties' && styleTableau && attrs['table:display'] === 'false') stylesMasques.add(styleTableau);
      else if (nom === 'table:table') {
        feuille = { nom: attrs['table:name'] || `Feuille ${feuilles.length + 1}`, masquee: stylesMasques.has(attrs['table:style-name']) };
        grille = new Map(); l = -1; verticales = new Map();
      }
      else if (nom === 'table:table-row' && grille) {
        ligneTampon = new Map(); c = 0;
        repeteLignes = Math.max(1, Number(attrs['table:number-rows-repeated'] || 1));
        // Ce qui descend d'une cellule fusionnée au-dessus.
        for (const [col, x] of verticales) { ligneTampon.set(col, x.v); if (--x.reste <= 0) verticales.delete(col); }
        if (auto) finirLigne();
      } else if ((nom === 'table:table-cell' || nom === 'table:covered-table-cell') && ligneTampon) {
        const colonnes = Math.max(1, Number(attrs['table:number-columns-repeated'] || 1));
        let valeur = '';
        const tv = attrs['office:value-type'];
        if (nom === 'table:table-cell') {
          if (tv === 'date' && attrs['office:date-value']) valeur = attrs['office:date-value'].slice(0, 10);
          else if ((tv === 'float' || tv === 'percentage' || tv === 'currency') && attrs['office:value'] != null) valeur = nombreLisible(attrs['office:value']);
          else if (tv === 'boolean') valeur = attrs['office:boolean-value'] === 'true' ? 'VRAI' : 'FAUX';
          else if (tv === 'time' && attrs['office:time-value']) {
            const m = attrs['office:time-value'].match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
            if (m) valeur = `${Number(m[1] || 0)}h${String(Number(m[2] || 0)).padStart(2, '0')}`;
          }
        }
        if (nom === 'table:covered-table-cell') {
          // Couverte par une fusion : la valeur descendue d'au-dessus est déjà posée, on avance seulement.
          c += colonnes;
          continue;
        }
        cellule = { valeur, texte: [], colonnes, lignes: Math.max(1, Number(attrs['table:number-rows-spanned'] || 1)), aValeur: !!valeur };
        if (auto) finirCellule();
      } else if (nom === 'office:annotation') annotation++;
      else if (nom === 'text:p' && cellule && !annotation) { profondeurP++; cellule.texte.push(''); }
      else if (cellule && profondeurP) {
        if (nom === 'text:s') cellule.texte[cellule.texte.length - 1] += ' '.repeat(Math.max(1, Number(attrs['text:c'] || 1)));
        else if (nom === 'text:tab') cellule.texte[cellule.texte.length - 1] += '\t';
        else if (nom === 'text:line-break') cellule.texte[cellule.texte.length - 1] += '\n';
      }
    } else if (type === 'f') {
      if (nom === 'office:annotation') annotation = Math.max(0, annotation - 1);
      else if (nom === 'text:p' && cellule && !annotation) profondeurP = Math.max(0, profondeurP - 1);
      else if (nom === 'table:table-cell' && cellule) {
        if (!cellule.aValeur) cellule.valeur = cellule.texte.join('\n');
        finirCellule();
      } else if (nom === 'table:table-row') finirLigne();
      else if (nom === 'table:table' && feuille) {
        if (!feuille.masquee) feuilles.push({ nom: feuille.nom, lignes: versLignes(grille) });
        feuille = null; grille = null;
      }
    } else if (type === 't' && cellule && profondeurP && !annotation) cellule.texte[cellule.texte.length - 1] += nom;
  }
  return feuilles;
}

// ---------- Texte (.csv, .tsv, copier-coller) ----------

/** Décode un fichier texte : UTF-8 s'il est valide, sinon Windows-1252 (les CSV d'Excel en français). */
export function decoderTexte(octets) {
  let t;
  try { t = new TextDecoder('utf-8', { fatal: true }).decode(octets); } catch { t = new TextDecoder('windows-1252').decode(octets); }
  return t.replace(/^﻿/, '');
}

function separateurProbable(texte) {
  const debut = texte.split(/\r\n?|\n/).filter((l) => l.trim()).slice(0, 12);
  if (!debut.length) return ',';
  let meilleur = ',', note = -1;
  for (const s of ['\t', ';', ',', '|']) {
    const comptes = debut.map((l) => l.replace(/"[^"]*"/g, '').split(s).length - 1);
    const avec = comptes.filter((n) => n > 0).length;
    if (!avec) continue;
    // Le bon séparateur revient sur presque toutes les lignes, à peu près autant de fois.
    const moyen = comptes.reduce((a, b) => a + b, 0) / comptes.length;
    const regulier = comptes.filter((n) => Math.abs(n - moyen) <= 1).length;
    const n = avec * 10 + regulier + (s === '\t' ? 5 : s === ';' ? 2 : 0);
    if (n > note) { note = n; meilleur = s; }
  }
  return meilleur;
}

/** Lit un texte séparé (CSV, TSV, cellules collées) : guillemets, guillemets doublés, retours à la ligne cités. */
export function lireTexteTabule(texte, separateur) {
  const t = String(texte || '').replace(/^﻿/, '');
  const sep = separateur || separateurProbable(t);
  const lignes = [];
  let ligne = [], champ = '', cite = false, debutChamp = true;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (cite) {
      if (ch === '"') { if (t[i + 1] === '"') { champ += '"'; i++; } else cite = false; } else champ += ch;
      continue;
    }
    if (ch === '"' && debutChamp) { cite = true; debutChamp = false; continue; }
    if (ch === sep) { ligne.push(champ); champ = ''; debutChamp = true; continue; }
    if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && t[i + 1] === '\n') i++;
      ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; debutChamp = true;
      if (lignes.length >= MAX_LIGNES) break;
      continue;
    }
    champ += ch; debutChamp = false;
  }
  if (champ !== '' || ligne.length) { ligne.push(champ); lignes.push(ligne); }
  return nettoyer(lignes);
}

// ---------- Point d'entrée ----------

/**
 * Lit un fichier de tableur. octets : Uint8Array (ou ArrayBuffer) ; nom : pour l'extension.
 * Renvoie { format, feuilles: [{ nom, lignes }] }, les feuilles vides en moins.
 */
export async function lireTableur(octets, nom = '') {
  const o = octets instanceof Uint8Array ? octets : new Uint8Array(octets);
  if (!o.length) throw new ErreurTableur('Ce fichier est vide.', 'vide');
  if (o.length > MAX_OCTETS) throw new ErreurTableur('Ce fichier est trop gros pour un tableur de progression.', 'taille');
  let format, feuilles;
  if (u32(o, 0) === 0x04034b50) {
    const entrees = entreesZip(o);
    if (entrees.has('xl/workbook.xml')) { format = 'xlsx'; feuilles = await lireXlsx(o, entrees); }
    else if (entrees.has('content.xml')) { format = 'ods'; feuilles = lireOds(await texteZip(o, entrees, 'content.xml')); }
    else if (entrees.has('word/document.xml')) throw new ErreurTableur('C’est un document Word : dans Word, copiez le tableau et collez-le dans la case de texte.', 'word');
    else throw new ErreurTableur('Ce fichier zip ne contient pas de tableur.', 'format');
  } else if (u32(o, 0) === 0xe011cfd0) {
    throw new ErreurTableur('C’est un ancien fichier Excel (.xls) : enregistrez-le en .xlsx (Fichier → Enregistrer sous), ou copiez les cellules et collez-les ici.', 'xls');
  } else if (o[0] === 0x25 && o[1] === 0x50 && o[2] === 0x44 && o[3] === 0x46) {
    throw new ErreurTableur('C’est un PDF : ouvrez l’original dans le tableur, ou copiez le tableau et collez-le ici.', 'pdf');
  } else {
    format = /\.tsv$/i.test(nom) ? 'tsv' : 'csv';
    feuilles = [{ nom: nom.replace(/\.[^.]+$/, '') || 'Feuille 1', lignes: lireTexteTabule(decoderTexte(o), format === 'tsv' ? '\t' : undefined) }];
  }
  feuilles = feuilles.filter((f) => f.lignes.some((l) => l.length));
  if (!feuilles.length) throw new ErreurTableur('Ce tableur ne contient aucune cellule remplie.', 'vide');
  return { format, feuilles };
}

// ---------- Écriture d'un .xlsx ----------
// Le strict nécessaire pour qu'Excel, LibreOffice, Numbers et Google Sheets l'ouvrent : textes en
// ligne (pas de table de chaînes), nombres en nombres, première ligne en gras et figée, retours à
// la ligne visibles. Le zip est compressé quand le navigateur sait le faire, stocké sinon.

const TABLE_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
export function crc32(octets) {
  let c = 0xffffffff;
  for (let i = 0; i < octets.length; i++) c = TABLE_CRC[(c ^ octets[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

async function comprimer(octets) {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const flux = new Blob([octets]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(flux).arrayBuffer());
  } catch { return null; }
}

/** Un zip : fichiers = [[nom, texte]]. */
export async function ecrireZip(fichiers) {
  const enc = new TextEncoder(), parties = [], central = [];
  let decalage = 0;
  const entier = (taille, v) => { const b = new Uint8Array(taille); for (let i = 0; i < taille; i++) b[i] = (v >>> (8 * i)) & 0xff; return b; };
  const assembler = (morceaux) => { const n = morceaux.reduce((s, m) => s + m.length, 0), r = new Uint8Array(n); let k = 0; for (const m of morceaux) { r.set(m, k); k += m.length; } return r; };
  for (const [nom, texte] of fichiers) {
    const brut = enc.encode(texte), n = enc.encode(nom), crc = crc32(brut);
    const comprime = await comprimer(brut);
    const [methode, donnees] = comprime && comprime.length < brut.length ? [8, comprime] : [0, brut];
    // Version 2.0, drapeau 0x0800 : noms en UTF-8 ; date fixe (1er janvier 2026, minuit).
    const commun = [entier(2, 20), entier(2, 0x0800), entier(2, methode), entier(2, 0), entier(2, (46 << 9) | (1 << 5) | 1), entier(4, crc), entier(4, donnees.length), entier(4, brut.length), entier(2, n.length), entier(2, 0)];
    const local = assembler([entier(4, 0x04034b50), ...commun, n]);
    central.push(assembler([entier(4, 0x02014b50), entier(2, 20), ...commun, entier(2, 0), entier(2, 0), entier(2, 0), entier(4, 0), entier(4, decalage), n]));
    parties.push(local, donnees);
    decalage += local.length + donnees.length;
  }
  const rep = assembler(central);
  const fin = assembler([entier(4, 0x06054b50), entier(2, 0), entier(2, 0), entier(2, fichiers.length), entier(2, fichiers.length), entier(4, rep.length), entier(4, decalage), entier(2, 0)]);
  return assembler([...parties, rep, fin]);
}

const xmlEsc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');

const ENTETE_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_P = 'http://schemas.openxmlformats.org/package/2006/relationships';

/** Un nom de feuille accepté par Excel : 31 caractères au plus, sans []:*?/\ et sans doublon. */
function nomsDeFeuilles(feuilles) {
  const vus = new Set();
  return feuilles.map((f, k) => {
    const base = String(f.nom || `Feuille ${k + 1}`).replace(/[[\]:*?/\\]/g, ' ').replace(/^'+|'+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 31) || `Feuille ${k + 1}`;
    let nom = base;
    for (let n = 2; vus.has(nom.toLowerCase()); n++) nom = `${base.slice(0, 27)} (${n})`;
    vus.add(nom.toLowerCase());
    return nom;
  });
}

/**
 * feuilles : [{ nom, lignes: [[valeur…]…], largeurs?: [nombre…] }] — la première ligne est l'en-tête.
 * Un nombre reste un nombre ; tout le reste est écrit en texte. Renvoie les octets du .xlsx.
 */
export async function ecrireXlsx(feuilles) {
  const noms = nomsDeFeuilles(feuilles);
