<script type="text/x-carnet-module" data-module="carnet/js/synchro.js">
// Synchronisation : lire Pronote et les agendas perso, mettre les données en commun entre
// appareils (Google Drive), écrire le plan dans les agendas « Carnet ». Une seule synchronisation
// à la fois ; une modification pendant qu'elle tourne en relance une à la fin.
import { CONFIG } from 'carnet/config.js';
import * as G from 'carnet/js/google.js';
import { etat, calc, definirBrut, definirSynchro, fusionnerDocs, modifierReglages, reglages, reglerLocal, niveauClasse } from 'carnet/js/etat.js';
import { fusionner, purger, identiques, VERSION_DONNEES } from 'carnet/js/donnees.js';
import { depuisGoogle, estLienIcal } from 'carnet/js/pronote.js';
import { lireIcs } from 'carnet/js/ics.js';
import { agendasVoulus, evenementsVoulus, comparer, DESCRIPTION_AGENDA } from 'carnet/js/agenda.js';
import { FUSEAU_APPAREIL, aujourdhui, ajouteJours, lundiDe, instantDe, heureDe, heureLisible } from 'carnet/js/dates.js';
import { adresseAppli } from 'carnet/js/installation.js';

const FICHIER = 'carnet-de-bord.json';
let enCours = null, encore = false, fichierId = null, relance = null;

export const urlAppli = () => adresseAppli().replace(/[?#].*$/, '');
const fuseau = () => reglages().fuseau || FUSEAU_APPAREIL;

/** Lance une synchronisation (ou attend celle en cours, puis en relance une). */
export function synchroniser(options = {}) {
  if (enCours) { encore = true; return enCours; }
  enCours = (async () => {
    try { await executer(options); } finally {
      enCours = null;
      if (encore) { encore = false; setTimeout(() => synchroniser(), 300); }
    }
  })();
  return enCours;
}

async function executer({ ecriture = true } = {}) {
  const mode = etat.local.mode;
  if (mode === 'local') return lectureLocale();
  if (mode !== 'google') return;
  if (!G.connecte()) { definirSynchro('connexion', 'Se reconnecter à Google'); return; }
  definirSynchro('cours', 'Synchronisation…');
  try {
    await synchroDrive();
    await lireAgendas();
    let bilan = null;
    if (ecriture && reglages().ecriture && reglages().ecriture.actif) bilan = await ecrireAgendas();
    if (etat.sale) await synchroDrive();
    const h = heureLisible(heureDe(new Date(), fuseau()));
    reglerLocal({ derniereSynchro: Date.now() });
    if (bilan && bilan.enAttente) {
      // Google a refusé de créer un agenda de plus pour l'instant : on réessaie dans deux minutes.
      clearTimeout(relance);
      relance = setTimeout(() => synchroniser(), 2 * 60000);
      definirSynchro('ok', `À jour à ${h} · encore ${bilan.enAttente} agenda${bilan.enAttente > 1 ? 's' : ''} à créer : Google demande d'attendre, nouvel essai dans 2 minutes`);
    } else {
      definirSynchro('ok', bilan && bilan.total ? `À jour à ${h} · ${bilan.total} changement${bilan.total > 1 ? 's' : ''} dans l'agenda` : `À jour à ${h}`);
    }
  } catch (e) {
    // Gardé pour les réglages : de quoi comprendre ce qui s'est passé, même une fois le message parti.
    reglerLocal({ dernierIncident: { le: Date.now(), message: String(e.message || e).slice(0, 300), statut: e.statut || null } });
    if (e.code === 'jeton') definirSynchro('connexion', 'Se reconnecter à Google');
    else definirSynchro('erreur', messageErreur(e));
  }
}

export function messageErreur(e) {
  if (!e) return 'Erreur inconnue.';
  if (G.estLimite(e)) return "Google limite le nombre d'opérations pour l'instant : le Carnet réessaiera dans quelques minutes.";
  if (e.code === 'interdit') return `Google refuse l'accès (${e.message}). Reconnectez-vous en cochant toutes les autorisations.`;
  if (e.code === 'non-configure') return e.message;
  if (e.code === 'popup_failed_to_open') return "Le navigateur a bloqué la fenêtre de connexion Google.";
  if (e.code === 'popup_closed') return 'La fenêtre de connexion Google s’est fermée avant la fin.';
  if (e instanceof TypeError) return 'Pas de réseau : vos changements sont gardés sur cet appareil.';
  return e.message || String(e);
}

// ---------- Drive ----------

/**
 * Lit la sauvegarde du Drive et la fusionne ici, sans rien envoyer. À faire AVANT toute écriture
 * sur un nouvel appareil : sinon ses documents, plus récents, écraseraient ceux de l'autre.
 * Renvoie true si une sauvegarde existait.
 */
export async function recupererDrive() {
  const f = await G.trouverFichier(FICHIER);
  if (!f) return false;
  fichierId = f.id;
  const contenu = await G.lireFichier(f.id);
  const distant = (contenu && contenu.docs) || {};
  fusionnerDocs(distant);
  return Object.keys(distant).length > 0;
}

async function synchroDrive() {
  let f = fichierId ? { id: fichierId } : await G.trouverFichier(FICHIER);
  let distant = {};
  if (f) {
    fichierId = f.id;
    try {
      const contenu = await G.lireFichier(f.id);
      distant = (contenu && contenu.docs) || {};
    } catch (e) {
      if (e.code !== 'absent') throw e;
      fichierId = null; f = null;
    }
  }
  const fus = purger(fusionner(etat.docs, distant));
  if (!identiques(fus, etat.docs)) fusionnerDocs(distant);
  if (!f || !identiques(fus, distant)) {
    const contenu = { format: 'carnet-de-bord', version: VERSION_DONNEES, ecrit: new Date().toISOString(), docs: fus };
    if (f) await G.ecrireFichier(f.id, contenu);
    else { const n = await G.creerFichier(FICHIER, contenu); fichierId = n && n.id; }
  }
  etat.sale = false;
}

// ---------- Lecture ----------
export async function lireAgendas() {
  const r = reglages(), tz = fuseau();
  const liste = await G.listerAgendas();
  const agendas = Object.fromEntries(liste.map((a) => [a.id, { nom: a.nom, couleur: a.couleur, description: a.description, principal: a.principal, role: a.role }]));
  const lundi = lundiDe(aujourdhui(tz));
  const t = (j) => instantDe(j, '00:00', tz).toISOString();
  let pronote = etat.brut.pronote, pronoteMaj = etat.brut.pronoteMaj;
  const src = r.source || {};
  if (src.agendaPronote) {
    // Jusqu'à la fin de l'année scolaire (au moins douze semaines) : c'est ce qui permet de dire où
    // tomberont les évaluations de la programmation.
    const [a, m] = lundi.split('-').map(Number);
    const finAnnee = `${m >= 8 ? a + 1 : a}-07-14`;
    const horizon = finAnnee > ajouteJours(lundi, 7 * 12) ? finAnnee : ajouteJours(lundi, 7 * 12);
    const res = await G.listerEvenements(src.agendaPronote, { timeMin: t(ajouteJours(lundi, -42)), timeMax: t(horizon) });
    pronote = res.evenements.map((e) => depuisGoogle(e, tz)).filter(Boolean);
    pronoteMaj = res.maj || null;
  }
  const perso = [];
  for (const id of src.agendasPerso || []) {
    if (!agendas[id] || agendas[id].description === DESCRIPTION_AGENDA) continue; // les agendas du Carnet ne sont pas de la vie perso
    try {
      const res = await G.listerEvenements(id, { timeMin: t(ajouteJours(lundi, -7)), timeMax: t(ajouteJours(lundi, 7 * 6)) });
      for (const e of res.evenements) {
        const n = depuisGoogle(e, tz);
        if (n && e.status !== 'cancelled' && e.transparency !== 'transparent') {
          // Modifiable depuis le Carnet : un agenda dont on est propriétaire ou rédacteur, et pas
          // l'occurrence d'un rendez-vous dont on n'est qu'invité.
          const invite = (e.attendees || []).some((a) => a.self) && !(e.organizer && e.organizer.self);
          perso.push({ ...n, agenda: agendas[id].nom, agendaId: id, modifiable: ['owner', 'writer'].includes(agendas[id].role) && !invite, repete: !!e.recurringEventId });
        }
      }
    } catch (e) { if (e.code === 'jeton') throw e; }
  }
  definirBrut({ pronote, perso, agendas, lu: Date.now(), pronoteMaj });
  return liste;
}

/** Les agendas qui ressemblent à un export Pronote, les plus probables d'abord. */
export function agendasPronote(liste) {
  const score = (a) => (/pronote|index.?education/i.test(`${a.description} ${a.nom}`) ? 2 : 0) + (/@import\.calendar\.google\.com$/.test(a.id) ? 1 : 0);
  return liste.filter((a) => score(a) > 0).sort((a, b) => score(b) - score(a));
}

// ---------- Écriture ----------
export async function ecrireAgendas({ surProgres } = {}) {
  const c = calc(), r = reglages(), e = r.ecriture || {}, tz = fuseau();
  const niveaux = [...new Set(c.creneaux.map((cr) => niveauClasse(cr.code, c.v)))].sort();
  const voulus = agendasVoulus(e, niveaux);
  const liste = Object.values(etat.brut.agendas || {}).length ? null : await G.listerAgendas();
  const connus = { ...(liste ? Object.fromEntries(liste.map((a) => [a.id, a])) : etat.brut.agendas) };
  const ids = { ...(e.calendriers || {}) };
  const couleurs = { ...(e.couleursAppliquees || {}) };
  // Chaque agenda est noté dès qu'il existe : si la suite échoue, la prochaine synchronisation le
  // reprend au lieu d'en créer un autre du même nom.
  const noter = () => modifierReglages((x) => { x.ecriture = { ...(x.ecriture || {}), calendriers: { ...ids }, couleursAppliquees: { ...couleurs } }; });
  const duCarnet = (id) => !!connus[id] && connus[id].description === DESCRIPTION_AGENDA && (connus[id].role || 'owner') === 'owner';
  let creations = 0, enAttente = 0;
  for (const a of voulus) {
    let id = ids[a.cle];
    if (id && !connus[id]) id = null; // supprimé par l'utilisateur dans Google Agenda
    if (!id) {
      // Un agenda du Carnet de ce nom existe déjà (synchronisation interrompue, autre appareil) : on le reprend.
      id = Object.keys(connus).find((k) => duCarnet(k) && connus[k].nom === a.nom && !Object.values(ids).includes(k)) || null;
      // Sinon, un agenda du Carnet qui ne sert à rien (le doublon d'un agenda gardé, ou un niveau
      // qu'on n'a plus) : on le renomme. Google limite les créations d'agendas, pas les renommages.
      if (!id) {
        const pris = new Set(Object.values(ids));
        const inutile = (k) => duCarnet(k) && !pris.has(k)
          && (!voulus.some((x) => x.nom === connus[k].nom) || Object.values(ids).some((j) => j !== k && connus[j] && connus[j].nom === connus[k].nom));
        const libre = Object.keys(connus).find(inutile);
        if (libre) {
          try {
            await G.renommerAgenda(libre, a.nom);
            connus[libre] = { ...connus[libre], nom: a.nom };
            id = libre;
          } catch (err) { if (err.code === 'jeton') throw err; }
        }
      }
      if (!id) {
        if (enAttente) { enAttente++; continue; }
        try {
          // Google refuse les créations d'agendas trop rapprochées : on les espace.
          if (creations++) await G.attendre(2000);
          id = (await G.creerAgenda(a.nom, DESCRIPTION_AGENDA, tz)).id;
          connus[id] = { nom: a.nom, description: DESCRIPTION_AGENDA, role: 'owner' };
        } catch (err) {
          if (!G.estLimite(err)) throw err;
          enAttente++;
          continue;
        }
      }
      ids[a.cle] = id;
      delete couleurs[a.cle];
      noter();
    }
    if (couleurs[a.cle] !== a.couleur) {
      try { await G.colorerAgenda(id, a.couleur); couleurs[a.cle] = a.couleur; noter(); } catch (err) { if (err.code === 'jeton') throw err; }
    }
  }
  // Les doublons laissés par une synchronisation interrompue : même nom, même description, créés
  // par le Carnet. Leurs cours sont réécrits dans l'agenda gardé ; on les retire.
  const gardes = new Set(Object.values(ids));
  for (const k of Object.keys(connus)) {
    if (!duCarnet(k) || gardes.has(k) || !voulus.some((a) => a.nom === connus[k].nom)) continue;
    try { await G.supprimerAgenda(k); delete connus[k]; } catch (err) { if (err.code === 'jeton') throw err; }
  }

  const auj = aujourdhui(tz);
  const fenetre = { debut: ajouteJours(auj, -7), fin: ajouteJours(auj, 7 * (Number(e.semaines) || 6)), urlAppli: urlAppli() };
  const voulusEv = evenementsVoulus(c, e, fenetre).map((x) => ({ ...x, calId: ids[x.agenda] })).filter((x) => x.calId);
  const existants = [];
  for (const id of new Set(Object.values(ids))) {
    try {
      const res = await G.listerEvenements(id, {
        timeMin: instantDe(fenetre.debut, '00:00', tz).toISOString(),
        timeMax: instantDe(ajouteJours(fenetre.fin, 26 * 7), '00:00', tz).toISOString(),
        prive: 'carnet=1',
      });
      for (const ev of res.evenements) existants.push({ calId: id, ev });
    } catch (err) { if (err.code !== 'absent') throw err; }
  }
  const { creer, modifier, supprimer } = comparer(voulusEv, existants);
  const taches = [
    ...supprimer.map((x) => () => G.supprimerEvenement(x.calId, x.ev.id)),
    ...creer.map((x) => () => G.creerEvenement(x.calId, x.corps)),
    ...modifier.map((x) => () => G.remplacerEvenement(x.calId, x.id, x.corps)),
  ];
  const erreurs = await G.parPaquets(taches, 4, surProgres);
  if (erreurs.length) throw erreurs[0];
  reglerLocal({ derniereEcriture: Date.now() });
  return { creer: creer.length, modifier: modifier.length, supprimer: supprimer.length, total: taches.length, enAttente };
}

/**
 * Les agendas créés par le Carnet qui ne servent plus (un niveau qu'on n'a plus, le reste d'une
 * synchronisation interrompue) : la synchronisation les renomme quand il en faut un nouveau ; ceux
 * qui restent, on peut les supprimer d'ici.
 */
export function agendasInutiles() {
  const e = reglages().ecriture || {};
  const gardes = new Set(Object.values(e.calendriers || {}));
  return Object.entries(etat.brut.agendas || {})
    .filter(([id, a]) => a.description === DESCRIPTION_AGENDA && (a.role || 'owner') === 'owner' && !gardes.has(id))
    .map(([id, a]) => ({ id, nom: a.nom }));
}
export async function retirerInutiles() {
  let n = 0;
  for (const { id } of agendasInutiles()) {
    try { await G.supprimerAgenda(id); n++; } catch (err) { if (err.code === 'jeton') throw err; }
  }
  await lireAgendas();
  return n;
}

/** Retire du Google Agenda tout ce que le Carnet y a écrit, puis ses agendas. */
export async function toutRetirer() {
  const e = reglages().ecriture || {};
  for (const id of new Set(Object.values(e.calendriers || {}))) {
    try { await G.supprimerAgenda(id); } catch (err) { if (err.code === 'jeton') throw err; }
  }
  modifierReglages((x) => { x.ecriture = { ...(x.ecriture || {}), actif: false, calendriers: {}, couleursAppliquees: {} }; });
}

// ---------- Mode local : un lien iCal ou un fichier ----------
export async function lireLienIcal(url) {
  const lien = String(url).trim().replace(/^webcal:\/\//i, 'https://');
  if (!estLienIcal(lien)) throw new Error("Ce n'est pas un lien d'agenda (iCal).");
  let texte = null;
  try {
    const r = await fetch(lien, { cache: 'no-store' });
    if (r.ok) texte = await r.text();
  } catch { /* bloqué par le navigateur (CORS) : on essaie le relais */ }
  if (texte == null && CONFIG.relaisIcal) {
    const r = await fetch(`${CONFIG.relaisIcal}?url=${encodeURIComponent(lien)}`, { cache: 'no-store' });
    if (r.ok) texte = await r.text();
  }
  if (texte == null) {
    const e = new Error("Le navigateur n'a pas le droit de lire ce lien directement (Pronote ne l'autorise pas). Passez par Google Agenda, ou importez le fichier .ics.");
    e.code = 'cors';
    throw e;
  }
  return lireTexteIcal(texte);
}

export function lireTexteIcal(texte) {
  const tz = fuseau();
  const { nom, evenements, repetitions } = lireIcs(texte, { fuseau: tz });
  if (!evenements.length) throw new Error('Aucun événement dans ce fichier.');
  definirBrut({ pronote: evenements, lu: Date.now(), pronoteMaj: new Date().toISOString(), nomIcal: nom });
  return { nom, n: evenements.length, repetitions };
}

// « 212 événements lus (3 répétés, non développés). »
export const bilanLecture = ({ n, repetitions }) => `${n} événements lus${repetitions ? ` (${repetitions} répétés, non développés)` : ''}.`;

async function lectureLocale() {
  const url = etat.local.ics && etat.local.ics.url;
  if (!url) return;
  definirSynchro('cours', 'Lecture de Pronote…');
  try {
    await lireLienIcal(url);
    definirSynchro('ok', `Pronote lu à ${heureLisible(heureDe(new Date(), fuseau()))}`);
  } catch (e) {
    definirSynchro('erreur', e.code === 'cors' ? 'Lien Pronote illisible directement' : messageErreur(e));
  }
}

  const l = aValider();
  if (!l.length) return html`<p class="vide">${icone('valider')} Tous les cours passés sont validés.</p>`;
  return html`<p class="aide">Dites où chaque classe s'est arrêtée : la suite se recale sur les cours suivants.</p>
    <div class="outils">${l.slice(-12).reverse().map((cr) => html`<button class="btn mini" data-action="valider" data-cle="${cr.cle}">${nomClasse(cr.code)} · ${dateCourte(cr.jour)}</button>`)}</div>
    ${l.length > 12 ? html`<p class="aide">… et ${l.length - 12} plus anciens.</p>` : ''}`;
}

function modCahier() {
  const l = cahiersNonSaisis();
  if (!l.length) return html`<p class="vide">${icone('valider')} Tout est saisi.</p>`;
  const c = calc();
  return html`<ul class="liste">${l.slice(-6).reverse().map((cr) => html`<li class="tache-ligne">
      <span><span class="heure">${dateCourte(cr.jour)}</span> ${pastille(cr.code)} ${(c.plan.parCreneau[cr.cle] || {}).aValider ? html`<span class="aide">à valider</span>` : ''}</span>
      <span class="outils"><button class="btn mini" data-action="cdt-copier" data-cle="${cr.cle}" data-quoi="tout" title="Copier le contenu et le travail à faire">${icone('copier')} Copier</button>
        <label class="coche"><input type="checkbox" data-change="coche" data-id="${cleCahier(cr.cle)}"><span>Saisi</span></label></span></li>`)}</ul>
    ${l.length > 6 ? html`<p class="aide">… et ${l.length - 6} autres.</p>` : ''}`;
}

/** Les évaluations des semaines à venir, toutes classes confondues : annoncées ou non. */
function modAnnonces() {
  const c = calc();
  const evals = evaluationsAVenir();
  const alertes = Object.values(c.plan.alertesEval).flat();
  const annonces = {};
  for (const cr of c.creneaux) for (const a of c.plan.annonces[cr.cle] || []) if (cr.jour >= c.auj) annonces[`${a.code}|${a.u}`] = { cr, a };
  if (!evals.length && !alertes.length) return html`<p class="vide">Aucune évaluation prévue dans l'emploi du temps connu.</p>`;
  return html`<ul class="liste">${evals.map((e) => {
    const x = annonces[`${e.code}|${e.u}`];
    const alerte = alertes.find((a) => a.code === e.code && a.u === e.u);
    return html`<li class="annonce${x && x.a.tard ? ' tard' : ''}${e.annoncee ? ' faite' : ''}"><span><span class="heure">${dateCourte(e.jour)}</span> ${pastille(e.code)} ${e.titre}<br>
        <span class="aide">${e.annoncee ? 'annoncée' : x ? `${x.a.tard ? 'à dire dès' : 'à annoncer'} ${jourRelatif(x.cr.jour, c.auj)}` : alerte ? (alerte.occasion ? `annonce non cochée (prévue le ${dateCourte(alerte.occasion)})` : "pas de cours avant pour l'annoncer") : 'à annoncer'}</span></span>
      ${e.annoncee ? '' : html`<button class="btn mini" data-action="annonce-faite" data-code="${e.code}" data-u="${e.u}">Annoncée</button>`}</li>`;
  })}</ul>`;
}

/** L'agenda de l'établissement, comme la tuile « Agenda » de Pronote : réunions, conseils, sorties. */
function modAgenda() {
  const c = calc();
  const l = agendaAVenir();
  if (!l.length) return html`<p class="vide">Rien à l'agenda de l'établissement ce mois-ci.</p>`;
  return html`<ul class="liste agenda-liste">${l.slice(0, 8).map((e) => {
    const j = String(e.jour0).slice(8, 10);
    return html`<li><span class="date-badge"><b>${Number(j)}</b><span>${jourMois(e.jour0).replace(/^\d+\s*/, '')}</span></span>
      <button class="lien-evt" data-action="ouvrir-evenement" data-genre="etab" data-id="${e.id}"><b>${e.titre}</b><span class="aide">${e.debut ? `${dateCourte(e.jour0)} · ${heureLisible(heureDe(e.debut, c.fuseau))}–${heureLisible(heureDe(e.fin, c.fuseau))}` : e.jour1 > e.jour0 ? `du ${jourMois(e.jour0)} au ${jourMois(e.jour1)}` : dateCourte(e.jour0)}</span></button></li>`;
  })}</ul>${l.length > 8 ? html`<p class="aide">… et ${l.length - 8} autres.</p>` : ''}`;
}

function modAujourdhui() {
  const c = calc();
  let jour = c.auj;
  const duJour = (j) => c.tousCreneaux.filter((x) => x.jour === j);
  if (!duJour(jour).length) {
    const prochain = c.tousCreneaux.find((x) => x.jour > c.auj && !x.annule);
    if (prochain) jour = prochain.jour;
  }
  const voirPerso = option('aujourdhui', 'perso') === 'oui';
  const voirLibres = option('aujourdhui', 'libres') === 'oui';
  const items = [];
  for (const cr of duJour(jour)) items.push({ t: cr.debut, h: c.v.classes[cr.code] ? carteCours(cr) : carteInconnue(cr) });
  for (const e of c.etablissement) if (e.jour0 <= jour && e.jour1 >= jour) items.push({ t: e.debut || new Date(0), h: ligneEvenement(e, '') });
  if (voirPerso) for (const e of c.perso) if (e.jour0 <= jour && e.jour1 >= jour) items.push({ t: e.debut || new Date(0), h: ligneEvenement(e, 'perso') });
  if (voirLibres) {
    const evts = [...duJour(jour).flatMap((cr) => cr.parties.map((p) => ({ ...p, pro: true }))), ...c.etablissement.map((e) => ({ ...e, pro: true })), ...c.perso];
    for (const [a, b] of plagesLibres(evts, jour, { fuseau: c.fuseau, min: 30 })) {
      items.push({ t: instantDe(jour, hhmm(a), c.fuseau), h: html`<li class="evt libre"><span class="heure">${hm(a)}–${hm(b)}</span><span>Libre · ${dureeLisible(b - a)}</span></li>` });
    }
  }
  items.sort((a, b) => a.t - b.t);
  const vac = c.coupures.find((k) => k.debut <= c.auj && k.fin >= c.auj);
  return html`
    ${bandeauAValider()}
    ${vac ? html`<p class="aide">${icone('vacances')} ${vac.titre} jusqu'au ${dateLongue(vac.fin)}.</p>` : ''}
    <h3>${jour === c.auj ? dateLongue(jour) : html`Prochain jour de cours : ${dateLongue(jour)}`}</h3>
    ${items.length ? html`<ul class="liste">${items.map((x) => x.h)}</ul>` : html`<p class="vide">Rien à l'emploi du temps.</p>`}`;
}

const hm = (m) => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function carteInconnue(cr) {
  return html`<li class="cours" style="${styleNiveau(cr.code)}"><div class="cours-haut"><span class="heure">${horaires(cr)}</span>${pastille(cr.code)}<span class="aide">classe non suivie</span></div>
    <div class="cours-actions"><button class="btn mini" data-action="suivre-classe" data-code="${cr.code}">${icone('plus')} Suivre cette classe</button></div></li>`;
}

function modPreparer() {
  const c = calc();
  const jours = Number(option('preparer', 'jours'));
  const limite = ajouteJours(c.auj, jours);
  const style = option('preparer', 'style');
  const vides = c.creneaux.filter((cr) => cr.fin > c.maintenant && cr.jour <= limite && ((c.plan.parCreneau[cr.cle] || {}).libre || 0) > 0.01);
  const codes = Object.keys(c.plan.parClasse).filter((k) => c.plan.parClasse[k].prochains.length)
    .sort((a, b) => String(c.plan.parClasse[a].couvertJusqua || '').localeCompare(String(c.plan.parClasse[b].couvertJusqua || '')));
  if (!codes.length) return html`<p class="vide">Aucun cours à venir dans l'emploi du temps lu.</p>`;
  if (style === 'date') {
    return html`<ul class="liste">${codes.map((code) => {
      const pc = c.plan.parClasse[code], d = pc.couvertJusqua;
      const urgent = !d || ecartJours(c.auj, d) < 7;
      const tout = !pc.premierLibre;
      return html`<li class="tache-ligne"><span>${pastille(code)} ${tout ? html`prête jusqu'au dernier cours connu` : d ? html`préparée jusqu'au <b class="${urgent ? 'retard' : ''}">${dateCourte(d)}</b>` : html`<b class="retard">rien de prévu</b>`}</span>
        ${tout ? '' : html`<a class="btn mini" href="#/classes/${code}">Préparer</a>`}</li>`;
    })}</ul>`;
  }
  if (style === 'compteur') {
    const classes = [...new Set(vides.map((x) => x.code))];
    return html`<div class="outils"><span class="compteur${vides.length ? '' : ' ok'}">${vides.length}</span>
      <span>${vides.length ? html`cours à préparer d'ici le ${dateCourte(limite)}` : html`tout est prêt d'ici le ${dateCourte(limite)}`}</span></div>
      ${classes.length ? html`<div class="outils">${classes.map((k) => html`<a class="btn mini" href="#/classes/${k}">${nomClasse(k)}</a>`)}</div>` : ''}`;
  }
  if (!vides.length) return html`<p>${icone('valider')} Tout est prêt d'ici le <b>${dateLongue(limite)}</b>.</p>`;
  return html`<ul class="liste">${vides.slice(0, 8).map((cr) => {
    const pc = c.plan.parCreneau[cr.cle];
    return html`<li class="tache-ligne"><span><span class="heure">${dateCourte(cr.jour)}</span> ${pastille(cr.code)} ${pc.libre >= 0.99 ? 'rien de prévu' : `reste ${seancesLisible(pc.libre)}`}</span>
      <a class="btn mini" href="#/classes/${cr.code}">Préparer</a></li>`;
  })}</ul>${vides.length > 8 ? html`<p class="aide">… et ${vides.length - 8} autres.</p>` : ''}`;
}

function modTaches() {
  const c = calc();
  const disp = option('taches', 'disposition');
  const taches = Object.entries(c.v.taches).map(([id, t]) => ({ id, ...t })).filter((t) => !t.fait)
    .sort((a, b) => String(a.pour || '9999').localeCompare(String(b.pour || '9999')));
  const ligne = (t) => html`<label class="coche"><input type="checkbox" data-change="tache-faite" data-id="${t.id}"><span>${t.texte}${t.pour || t.classe ? html`<br><span class="aide">${t.classe ? nomClasse(t.classe) : ''}${t.classe && t.pour ? ' · ' : ''}${t.pour ? html`<span class="${t.pour < c.auj ? 'retard' : ''}">${jourRelatif(t.pour, c.auj)}</span>` : ''}</span>` : ''}</span></label>`;
  let corps;
  if (!taches.length) corps = html`<p class="vide">Rien en attente.</p>`;
  else if (disp === 'ligne') corps = html`<div class="taches-ligne">${taches.map(ligne)}</div>`;
  else if (disp === 'echeances') {
    const fin = ajouteJours(c.auj, 7);
    const groupes = [['En retard ou aujourd’hui', taches.filter((t) => t.pour && t.pour <= c.auj)], ['Cette semaine', taches.filter((t) => t.pour > c.auj && t.pour <= fin)], ['Plus tard', taches.filter((t) => !t.pour || t.pour > fin)]];
    corps = html`<div class="taches-echeances">${groupes.map(([titre, l]) => html`<div><h3>${titre}</h3>${l.length ? l.map(ligne) : html`<span class="vide petit">—</span>`}</div>`)}</div>`;
  } else corps = html`<div class="liste">${taches.map(ligne)}</div>`;
  return html`<form class="ajout-tache" data-envoi="tache-rapide"><input type="text" name="texte" id="tache-rapide" placeholder="Ajouter : appeler le labo, rendre les copies…" aria-label="Nouvelle tâche" autocomplete="off"><button class="btn plein" type="submit" aria-label="Ajouter">${icone('plus')}</button></form>${corps}
    <a class="aide" href="#/taches">Toutes les tâches</a>`;
}

function modPeloton() {
  const c = calc();
  const niveaux = peloton(c.v, c.plan);
  if (!niveaux.length) return html`<p class="vide">Aucune classe suivie.</p>`;
  return html`<div class="peloton">${niveaux.map((n) => {
    const total = Math.max(1, n.reference.length);
    return html`<div><h3>${n.niveau}</h3><div class="piste">${n.lignes.map((l, k) => {
      const e = l.eid ? c.v.etapes[l.eid] : null;
      const ou = e ? (l.f > EPS ? `reprendre à ${reprise({ de: l.f }, e).texte}` : 'au début') : '';
      const tete = n.lignes[0];
      return html`${pastille(l.code)}<div class="barre" style="${styleNiveau(l.code)}" role="img" aria-label="${nomClasse(l.code)} : étape ${Math.min(total, Math.floor(l.rang) + 1)} sur ${total}">
        <i style="width:${Math.min(100, (l.rang / total) * 100)}%"></i><span class="crans">${Array.from({ length: total }, () => html`<span></span>`)}</span></div>
        <div class="detail">${l.fini ? 'File terminée' : html`${e ? e.titre : ''}${ou ? ` · ${ou}` : ''}`}${k > 0 && l.retard > 0.01 ? html` · <b>${seancesLisible(l.retard)} derrière ${nomClasse(tete.code)}</b>` : ''}</div>`;
    })}</div></div>`;
  })}</div>`;
}

function modPhotocopies() {
  const c = calc();
  const items = aPreparer(c.v, c.plan, c.creneaux, { auj: c.auj, jours: Number(option('photocopies', 'jours')) });
  if (!items.length) return html`<p class="vide">Rien à photocopier ni à sortir.</p>`;
  const ligne = (p) => {
    const e = c.v.etapes[p.eid], fait = !!(c.v.coches[p.id] && c.v.coches[p.id].fait);
    const quoi = [p.pages ? (p.effectif ? `${p.effectif} × ${p.pages} = ${p.effectif * p.pages} copies` : `${p.pages} page(s) par élève`) : '', p.afaire].filter(Boolean).join(' · ');
    return html`<label class="coche${fait ? ' faite' : ''}"><input type="checkbox" data-change="coche" data-id="${p.id}"${fait ? ' checked' : ''}><span><b>${dateCourte(p.jour)}</b> · ${nomClasse(p.code)} — ${e.titre}<br><span class="aide">${quoi}</span></span></label>`;
  };
  return option('photocopies', 'disposition') === 'ligne' ? html`<div class="taches-ligne">${items.map(ligne)}</div>` : html`<div class="liste">${items.map(ligne)}</div>`;
}

function modVacances() {
  const c = calc();
  const prochaine = c.coupures.find((k) => k.debut > c.auj);
  if (!prochaine) return html`<p class="vide">Pas de vacances en vue dans l'emploi du temps lu.</p>`;
  const lignes = Object.keys(c.plan.parClasse).map((code) => ({ code, r: avantCoupure(c.plan, c.creneaux, c.coupures, code, { auj: c.auj, maintenant: c.maintenant }) })).filter((x) => x.r);
  return html`<p><b>${prochaine.titre}</b> le ${dateLongue(prochaine.debut)} <span class="aide">(dans ${ecartJours(c.auj, prochaine.debut)} jours)</span></p>
    <ul class="liste">${lignes.map(({ code, r }) => html`<li class="tache-ligne"><span>${pastille(code)} ${r.seances} cours ·
      ${r.marge >= 0 ? (r.finFile ? html`file finie le ${dateCourte(r.finFile.jour)}` : html`<span>${seancesLisible(r.marge)} de marge</span>`) : html`<b class="retard">il manque ${seancesLisible(-r.marge)}</b>`}</span></li>`)}</ul>`;
}

function modLibres() {
  const c = calc();
  const min = Number(option('libres', 'min'));
  const jours = [...new Set(c.tousCreneaux.filter((x) => x.jour >= c.auj).map((x) => x.jour))].slice(0, 5);
  const lignes = [];
  for (const j of jours) {
    const evts = [...c.tousCreneaux.filter((x) => x.jour === j).flatMap((cr) => cr.parties.map((p) => ({ ...p, pro: true }))), ...c.etablissement.map((e) => ({ ...e, pro: true })), ...c.perso];
    for (const [a, b] of plagesLibres(evts, j, { fuseau: c.fuseau, min })) lignes.push(html`<li class="evt libre"><span class="heure">${dateCourte(j)}</span><span>${hm(a)}–${hm(b)} · ${dureeLisible(b - a)}</span></li>`);
  }
  return lignes.length ? html`<ul class="liste">${lignes}</ul>` : html`<p class="vide">Pas de trou dans les prochains jours.</p>`;
}

function modNotes() {
  return html`<textarea id="bloc-notes" data-saisie="notes" aria-label="Pense-bête" placeholder="Idées, choses à ne pas oublier…">${calc().v.notes}</textarea><p class="aide">Enregistré au fil de la frappe.</p>`;
}

function modSemaine() {
  const c = calc();
  const lundi = semaineUtile(c.tousCreneaux, c.auj);
  return html`<p class="aide">${lundi === lundiDe(c.auj) ? 'Cette semaine' : 'Semaine'} du ${jourMois(lundi)} au ${jourMois(ajouteJours(lundi, 4))} · touchez un cours pour dire où la classe en est</p>
    ${option('semaine', 'presentation') === 'cartes' ? listeSemaine({ compacte: true }) : grille(lundi)}`;
}

const RENDUS = { aujourdhui: modAujourdhui, valider: modValider, preparer: modPreparer, cahier: modCahier, taches: modTaches, peloton: modPeloton, photocopies: modPhotocopies, annonces: modAnnonces, agenda: modAgenda, vacances: modVacances, libres: modLibres, notes: modNotes, semaine: modSemaine };

/** « Emploi du temps (semaine B) » : le titre de la tuile peut dépendre de l'état. */
function titreModule(id) {
  if (id !== 'semaine') return MODULES[id].titre;
  const c = calc(), l = lettreDe(semaineUtile(c.tousCreneaux, c.auj));
  return l ? `Emploi du temps (semaine ${l})` : MODULES.semaine.titre;
}

// ---------- La page ----------

function resume() {
  const c = calc();
  const coursAuj = c.creneaux.filter((x) => x.jour === c.auj && !x.annule);
  const prochain = coursAuj.find((x) => x.fin > c.maintenant);
  const aValider = c.creneaux.filter((x) => (c.plan.parCreneau[x.cle] || {}).aValider).length;
  // Le premier cours sans contenu, toutes classes confondues : c'est lui qu'il faut préparer d'abord.
  const vide = Object.values(c.plan.parClasse).map((p) => p.premierLibre).filter(Boolean).sort((x, y) => x.debut - y.debut)[0];
  const phrases = [];
  if (coursAuj.length) phrases.push(html`Aujourd'hui, <b>${coursAuj.length} cours</b>${prochain ? html`, le prochain à <b>${heureLisible(heureDe(prochain.debut, c.fuseau))}</b> avec la ${nomClasse(prochain.code)}` : ', tous passés'}.`);
  else phrases.push(html`Pas de cours aujourd'hui.`);
  if (aValider) phrases.push(html` <b>${aValider}</b> à valider.`);
  if (vide) phrases.push(html` Prochain cours à préparer : <b>${nomClasse(vide.code)}</b>, ${jourRelatif(vide.jour, c.auj).replace(/\.$/, '')}.`);
  else if (Object.keys(c.plan.parClasse).length) phrases.push(html` Tout est prévu jusqu'au dernier cours connu.`);
  return html`<p class="resume">${phrases}</p>`;
}

export function rendreAccueil() {
  const c = calc();
  const d = disposition();
  const visibles = d.ordre.filter((id) => !d.masques.includes(id));
  const caches = d.ordre.filter((id) => d.masques.includes(id));
  const modules = visibles.map((id, k) => {
    const m = MODULES[id];
    const taille = d.tailles[id] || m.taille;
    const titre = titreModule(id);
    const n = m.compte ? m.compte() : 0;
    return html`<section class="module carte taille-${taille}" data-module="${id}" aria-label="${titre}">
      <header class="module-tete">
        <button class="poignee" data-poignee aria-label="Déplacer « ${m.titre} »" title="Glisser pour déplacer">${icone('poignee')}</button>
        <h2>${icone(m.icone)}${titre}${n ? html` <span class="compte">(${n})</span>` : ''}</h2>
        <div class="droite">
          ${!organiser && m.lien ? html`<a class="tout-voir" href="${m.lien}">Tout voir ${icone('ouvrir')}</a>` : ''}
          <div class="reglage-module">
            <button class="btn-rond" data-action="module-monter" data-id="${id}" aria-label="Monter" ${k === 0 ? 'disabled' : ''}>${icone('haut')}</button>
            <button class="btn-rond" data-action="module-descendre" data-id="${id}" aria-label="Descendre" ${k === visibles.length - 1 ? 'disabled' : ''}>${icone('bas')}</button>
            <span class="segmente" role="group" aria-label="Largeur">${['S', 'M', 'L'].map((t) => html`<button data-action="module-taille" data-id="${id}" data-taille="${t}" aria-pressed="${t === taille}" title="${{ S: 'Étroit', M: 'Moyen', L: 'Pleine largeur' }[t]}">${t}</button>`)}</span>
            ${m.options.length ? html`<button class="btn-rond" data-action="module-options" data-id="${id}" aria-label="Réglages du module">${icone('reglages')}</button>` : ''}
            <button class="btn-rond" data-action="module-masquer" data-id="${id}" aria-label="Masquer">${icone('oeil-barre')}</button>
          </div>
          ${!organiser && m.options.length ? html`<button class="btn-rond petit" data-action="module-options" data-id="${id}" aria-label="Réglages de « ${m.titre} »" title="Réglages">${icone('reglages')}</button>` : ''}
          ${!organiser ? html`<button class="btn-rond petit" data-action="module-fermer" data-id="${id}" aria-label="Retirer « ${m.titre} » de la page d'accueil" title="Retirer de la page d'accueil">${icone('croix')}</button>` : ''}
        </div>
      </header>
      <div class="module-corps">${RENDUS[id]()}</div>
    </section>`;
  });
  return html`
    ${etat.local.mode === 'demo' ? html`<div class="bandeau"><span><strong>Mode démo</strong> — un emploi du temps et des classes fictifs, pour essayer. Tout se règle et se valide.</span><span class="outils"><a class="btn mini plein" href="#/demarrer">Commencer pour de vrai</a><button class="btn mini" data-action="partager">${icone('partager')} Partager</button></span></div>` : ''}
    ${bandeauInstallation(etat.local.installPlusTard)}
    ${c.inconnus.length ? html`<div class="bandeau info"><span><strong>Pronote montre ${c.inconnus.length} classe${c.inconnus.length > 1 ? 's' : ''} non suivie${c.inconnus.length > 1 ? 's' : ''}</strong> : ${c.inconnus.join(', ')}.</span><span class="outils"><button class="btn mini plein" data-action="suivre-toutes">Les suivre</button><button class="btn mini" data-action="ignorer-inconnues">Ignorer</button></span></div>` : ''}
    <h1 class="visuellement-cache">Page d'accueil</h1>
    ${resume()}
    ${organiser ? html`<div class="bandeau info"><span>Glissez les tuiles par leur poignée ${icone('poignee')}, ou utilisez ↑ ↓. S, M, L règlent la largeur. La disposition est propre à cet appareil.</span>
      <span class="modules-caches">${caches.length ? caches.map((id) => html`<button class="btn mini" data-action="module-afficher" data-id="${id}">${icone('plus')} ${MODULES[id].titre}</button>`) : html`<span class="aide">Toutes les tuiles sont affichées.</span>`}
      <button class="btn mini discret" data-action="disposition-defaut">Disposition d'origine</button>
      <button class="btn mini plein" data-action="organiser">${icone('valider')} Terminé</button></span></div>` : ''}
    <div class="tableau${organiser ? ' organiser' : ''}" id="tableau">${modules}</div>`;
}

// ---------- Actions ----------
actions['organiser'] = () => { organiser = !organiser; changer(); };
const deplacer = (id, sens) => {
  const d = disposition();
  const vis = d.ordre.filter((x) => !d.masques.includes(x));
  const k = vis.indexOf(id), j = k + sens;
  if (k < 0 || j < 0 || j >= vis.length) return;
  [vis[k], vis[j]] = [vis[j], vis[k]];
  regler({ ordre: [...vis, ...d.ordre.filter((x) => d.masques.includes(x))] });
};
actions['module-monter'] = (el) => deplacer(el.dataset.id, -1);
actions['module-descendre'] = (el) => deplacer(el.dataset.id, 1);
actions['module-taille'] = (el) => regler({ tailles: { ...disposition().tailles, [el.dataset.id]: el.dataset.taille } });
actions['module-masquer'] = (el) => regler({ masques: [...new Set([...disposition().masques, el.dataset.id])] });
// La croix de la tuile, comme dans Pronote : elle la retire, et « Annuler » la remet.
actions['module-fermer'] = (el) => {
  const id = el.dataset.id;
  regler({ masques: [...new Set([...disposition().masques, id])] });
  toast(`« ${MODULES[id].titre} » retirée de la page d'accueil.`, { action: { libelle: 'Annuler', faire: () => regler({ masques: disposition().masques.filter((x) => x !== id) }) } });
};
actions['module-afficher'] = (el) => regler({ masques: disposition().masques.filter((x) => x !== el.dataset.id) });
actions['disposition-defaut'] = () => { reglerLocal({ disposition: null }); toast('Disposition d’origine rétablie.'); };
export function surGlisser(ordre) {
  const d = disposition();
  regler({ ordre: [...ordre, ...d.ordre.filter((x) => !ordre.includes(x))] });
}

actions['module-options'] = (el) => {
  const id = el.dataset.id, m = MODULES[id];
  ouvrirFeuille(() => ({
    titre: `Réglages · ${m.titre}`,
    corps: html`${m.options.map((o) => html`<fieldset class="section-feuille" style="border:0;padding:0;margin:0"><h3>${o.libelle}</h3>
      ${o.choix.map(([val, lib]) => html`<label class="coche"><input type="radio" name="opt-${o.cle}" data-change="module-option" data-id="${id}" data-cle="${o.cle}" value="${val}"${option(id, o.cle) === val ? ' checked' : ''}><span>${lib}</span></label>`)}</fieldset>`)}`,
    pied: html`<button class="btn plein" data-action="fermer-feuille">Terminé</button>`,
  }));
};
changements['module-option'] = (el) => {
  const { id, cle } = el.dataset;
  const d = disposition();
  regler({ options: { ...d.options, [id]: { ...(d.options[id] || {}), [cle]: el.value } } });
  redessinerFeuille(true);
};

envois['tache-rapide'] = (form) => {
  const texte = form.texte.value.trim();
  if (!texte) return;
  ecrireDoc(`taches/${nouvelId('t')}`, { texte, classe: '', pour: '', fait: false, cree: new Date().toISOString() });
  form.texte.value = '';
  toast('Tâche ajoutée.');
};
changements['tache-faite'] = (el) => {
  modifierDoc(`taches/${el.dataset.id}`, (t) => { t.fait = el.checked; });
  if (el.checked) toast('Bravo, une de moins.', { action: { libelle: 'Annuler', faire: () => modifierDoc(`taches/${el.dataset.id}`, (t) => { t.fait = false; }) } });
};
let minuteurNotes;
saisies['notes'] = (el) => {
  clearTimeout(minuteurNotes);
  const texte = el.value;
  minuteurNotes = setTimeout(() => ecrireDoc('notes', { texte }), 500);
};

export { fermerFeuille, supprimerDoc };
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/semaine.js">
// L'emploi du temps : une grille horaire à la manière de Pronote (par défaut), où cours, vie de
// l'établissement et vie perso se placent à leur heure ; ou une colonne par jour avec la carte
// complète de chaque cours, comme l'emploi du temps de l'ancien carnet (vue « Cartes »).
import { actions } from 'carnet/js/actions.js';
import { html, icone } from 'carnet/js/ui.js';
import { calc, etat, changer, reglerLocal, nomClasse, niveauClasse, couleurNiveau } from 'carnet/js/etat.js';
import { lundiDe, ajouteJours, dateCourte, dateLongue, minutesDe, heureDe, heureLisible, jourMois, jourDe, jourSemaine } from 'carnet/js/dates.js';
import { semaineUtile, placesHoraires, apresMidiLibre, lettreSemaine } from 'carnet/js/moteur.js';
import { carteCours, ligneEvenement, styleNiveau } from 'carnet/js/vues/commun.js';
import { ouvrirFeuille } from 'carnet/js/ui.js';
import { agendasModifiables } from 'carnet/js/vues/rendezvous.js';

let lundiAffiche = null;
const PX = 1.05; // pixels par minute
const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}h${String(m % 60).padStart(2, '0')}`;

/** « A » ou « B » si l'établissement alterne (réglé dans Mes données), sinon ''. */
export function lettreDe(lundi) {
  const c = calc();
  return lettreSemaine(lundi, c.v.reglages.semaineAB, c.coupures);
}

function semaine() {
  const c = calc();
  if (!lundiAffiche) lundiAffiche = semaineUtile(c.tousCreneaux, c.auj);
  return lundiAffiche;
}

const vueChoisie = () => etat.local.vueSemaine || 'grille';

function evenementsDuJour(jour) {
  const c = calc();
  const cours = [];
  for (const cr of c.tousCreneaux) {
    if (cr.jour !== jour) continue;
    for (const p of cr.parties) cours.push({ genre: 'cours', cr, p, debut: p.debut, fin: p.fin });
  }
  const etab = c.etablissement.filter((e) => !e.journee && e.debut && e.jour0 <= jour && e.jour1 >= jour).map((e) => ({ genre: 'etab', e, debut: e.debut, fin: e.fin }));
  const perso = c.perso.filter((e) => !e.journee && e.debut && e.jour0 <= jour && e.jour1 >= jour).map((e) => ({ genre: 'perso', e, debut: e.debut, fin: e.fin }));
  const journees = [
    ...c.coupures.filter((k) => k.debut <= jour && k.fin >= jour).map((k) => ({ genre: 'vac', titre: k.titre })),
    ...c.etablissement.filter((e) => e.journee && e.jour0 <= jour && e.jour1 >= jour).map((e) => ({ genre: 'etab', titre: e.titre })),
    ...c.perso.filter((e) => e.journee && e.jour0 <= jour && e.jour1 >= jour).map((e) => ({ genre: 'perso', titre: e.titre })),
  ];
  return { minutes: [...cours, ...etab, ...perso], journees };
}

/** Colonnes côte à côte pour les événements qui se chevauchent. */
function disposer(evts, fuseau) {
  const l = evts.map((e) => ({ ...e, a: minutesDe(e.debut, fuseau), b: Math.max(minutesDe(e.debut, fuseau) + 15, minutesDe(e.fin, fuseau) || 24 * 60) }))
    .sort((x, y) => x.a - y.a || y.b - x.b);
  let groupe = [], finGroupe = -1;
  const fermer = () => { const n = Math.max(...groupe.map((x) => x.col)) + 1; groupe.forEach((x) => { x.n = n; }); groupe = []; };
  for (const e of l) {
    if (groupe.length && e.a >= finGroupe) fermer();
    const prises = new Set(groupe.filter((x) => x.b > e.a).map((x) => x.col));
    let col = 0; while (prises.has(col)) col++;
    e.col = col; groupe.push(e); finGroupe = Math.max(finGroupe, e.b);
  }
  if (groupe.length) fermer();
  return l;
}

function bloc(x, debutGrille) {
  const c = calc();
  const top = (x.a - debutGrille) * PX, h = Math.max(18, (x.b - x.a) * PX - 2);
  const pos = `top:${top}px;height:${h}px;left:calc(${(x.col / x.n) * 100}% + 2px);width:calc(${100 / x.n}% - 4px)`;
  const heures = `${heureLisible(heureDe(x.debut, c.fuseau))}–${heureLisible(heureDe(x.fin, c.fuseau))}`;
  if (x.genre === 'cours') {
    const pc = c.plan.parCreneau[x.cr.cle];
    const suivie = !!c.v.classes[x.cr.code];
    const seg = pc && pc.segments && pc.segments.find((s) => !s.recul);
    const titre = seg ? (c.v.etapes[seg.eid] || {}).titre : (pc && pc.etat === 'prevu' && pc.libre > 0.01 ? 'À préparer' : '');
    return html`<button class="bloc${x.p.annule ? ' annule' : ''}${pc && pc.etat === 'prevu' && pc.libre > 0.99 ? ' libre-prevu' : ''}" style="${pos};${styleNiveau(x.cr.code)}" data-action="ouvrir-creneau" data-cle="${x.cr.cle}"
      title="${nomClasse(x.cr.code)} ${x.p.groupe || ''} · ${heures}${titre ? ` · ${titre}` : ''}">
      <b>${nomClasse(x.cr.code)}${x.p.groupe ? ` ${x.p.groupe}` : ''}${x.p.annule ? ' · annulé' : ''}</b>
      ${suivie ? (titre ? html`<span>${titre}</span>` : '') : html`<span class="sous">non suivie</span>`}
      <span class="sous"> · ${heures}${x.p.salle ? ` · ${x.p.salle}` : ''}</span></button>`;
  }
  return html`<button class="bloc ${x.genre}" style="${pos}" data-action="ouvrir-evenement" data-genre="${x.genre}" data-id="${x.e.id}" title="${x.e.titre} · ${heures}">
    <b>${x.e.titre}</b><span class="sous">${heures}</span></button>`;
}

/**
 * La grille horaire, à la manière de Pronote : les heures de sonnerie de l'établissement (déduites
 * des cours) en repère, la récréation grisée, le mercredi après-midi hachuré quand il n'y a jamais
 * cours. Aussi le module « Emploi du temps » de l'accueil.
 */
export function grille(lundi = semaine()) {
  const c = calc();
  let jours = [0, 1, 2, 3, 4].map((k) => ajouteJours(lundi, k));
  const we = [5, 6].map((k) => ajouteJours(lundi, k)).filter((j) => evenementsDuJour(j).minutes.some((e) => e.genre !== 'perso'));
  jours = [...jours, ...we];
  const tous = jours.map((j) => ({ jour: j, ...evenementsDuJour(j) }));
  const { places, recres } = placesHoraires(c.cours, c.fuseau);
  const mins = tous.flatMap((d) => d.minutes.map((e) => minutesDe(e.debut, c.fuseau)));
  const maxs = tous.flatMap((d) => d.minutes.map((e) => minutesDe(e.fin, c.fuseau) || 24 * 60));
  // Avec des heures de sonnerie, la grille commence à la première et finit à la dernière, comme
  // dans Pronote ; un rendez-vous plus tôt ou plus tard l'élargit à l'heure ronde.
  const avant = mins.filter((m) => !places.length || m < places[0]).map((m) => Math.floor(m / 60) * 60);
  const apres = maxs.filter((m) => !places.length || m > places[places.length - 1]).map((m) => Math.ceil(m / 60) * 60);
  const debut = Math.max(6 * 60, Math.min(places.length ? places[0] : 8 * 60, ...avant));
  const fin = Math.min(22 * 60, Math.max(places.length ? places[places.length - 1] : 17 * 60, ...apres));
  const hauteur = (fin - debut) * PX;
  const reperes = places.length ? places.filter((m) => m >= debut && m <= fin) : Array.from({ length: Math.floor((fin - debut) / 60) + 1 }, (_, k) => debut + 60 * k);
  if (places.length) { if (reperes[0] !== debut) reperes.unshift(debut); if (reperes[reperes.length - 1] !== fin) reperes.push(fin); }
  const maintenant = minutesDe(c.maintenant, c.fuseau);
  const ecrire = agendasModifiables().length > 0;
  // Le mercredi après-midi : à partir de la fin du dernier cours du mercredi matin.
  const hachure = apresMidiLibre(c.cours, c.fuseau)
    ? Math.max(...c.cours.filter((x) => x && x.type === 'cours' && x.debut && jourSemaine(jourDe(x.debut, c.fuseau)) === 2).map((x) => minutesDe(x.fin, c.fuseau)))
    : null;
  return html`<div class="grille" style="--h:${hauteur}px">
    <div class="grille-heures" style="margin-top:50px;height:${hauteur}px">${reperes.map((m) => html`<span style="top:${(m - debut) * PX}px">${hm(m)}</span>`)}</div>
    <div class="grille-jours">${tous.map((d) => html`<div class="colonne-jour${d.jour === c.auj ? ' auj' : ''}">
      <div class="tete-jour">${dateCourte(d.jour)}${d.journees.length ? html`<div class="bandeau-journee${d.journees.some((x) => x.genre === 'vac') ? ' vac' : ''}" title="${d.journees.map((x) => x.titre).join(' · ')}">${d.journees[0].titre}${d.journees.length > 1 ? ` +${d.journees.length - 1}` : ''}</div>` : ''}</div>
      <div class="corps-jour" style="height:${hauteur}px"${ecrire ? html` data-action="rdv-creneau" data-jour="${d.jour}" data-debut="${debut}" data-px="${PX}" title="Toucher une case vide pour ajouter un rendez-vous"` : ''}>
        ${recres.filter(([a, b]) => a >= debut && b <= fin).map(([a, b]) => html`<div class="recre" style="top:${(a - debut) * PX}px;height:${(b - a) * PX}px" title="Récréation ${hm(a)}–${hm(b)}"></div>`)}
        ${hachure != null && jourSemaine(d.jour) === 2 && hachure < fin ? html`<div class="hachure" style="top:${(Math.max(debut, hachure) - debut) * PX}px;height:${(fin - Math.max(debut, hachure)) * PX}px" title="Pas de cours le mercredi après-midi"></div>` : ''}
        ${reperes.map((m) => html`<div class="ligne-heure" style="top:${(m - debut) * PX}px"></div>`)}
        ${d.jour === c.auj && maintenant >= debut && maintenant <= fin ? html`<div class="maintenant" style="top:${(maintenant - debut) * PX}px"></div>` : ''}
        ${disposer(d.minutes, c.fuseau).map((x) => bloc(x, debut))}
      </div></div>`)}</div>
  </div>`;
}

/**
 * La semaine en colonnes, une par jour, avec la carte complète de chaque cours et, à leur heure,
 * la vie de l'établissement et la vie perso (aussi le module « Ma semaine » de l'accueil).
 */
export function listeSemaine({ compacte = false } = {}) {
  const c = calc();
  const lundi = compacte ? semaineUtile(c.tousCreneaux, c.auj) : semaine();
  const jours = [0, 1, 2, 3, 4].map((k) => ajouteJours(lundi, k));
  const samedi = ajouteJours(lundi, 5);
  if (c.creneaux.some((x) => x.jour === samedi)) jours.push(samedi);
  return html`<div class="jours-liste" style="--n:${jours.length}">${jours.map((j) => {
    const { minutes, journees } = evenementsDuJour(j);
    const elements = [
      ...c.creneaux.filter((x) => x.jour === j).map((cr) => ({ t: cr.debut, h: carteCours(cr) })),
      ...minutes.filter((x) => x.genre !== 'cours').map((x) => ({ t: x.debut, h: ligneEvenement(x.e, x.genre === 'perso' ? 'perso' : '') })),
    ].sort((a, b) => a.t - b.t);
    return html`<section class="jour-liste${j === c.auj ? ' auj' : ''}"><h3>${dateLongue(j)}</h3>
      ${journees.map((x) => html`<p class="aide">${x.genre === 'vac' ? icone('vacances') : ''} ${x.titre}</p>`)}
      ${elements.length ? html`<ul class="liste">${elements.map((x) => x.h)}</ul>` : html`<p class="vide petit">Pas de cours</p>`}</section>`;
  })}</div>`;
}

export function rendreSemaine() {
  const c = calc();
  const lundi = semaine();
  const vendredi = ajouteJours(lundi, 4);
  const niveaux = [...new Set(Object.keys(c.v.classes).map((k) => niveauClasse(k, c.v)))];
  const vue = vueChoisie();
  return html`
    <div class="semaine-outils">
      <button class="btn-rond" data-action="semaine-avant" aria-label="Semaine précédente">${icone('gauche')}</button>
      <h2>Semaine du ${jourMois(lundi)} au ${jourMois(vendredi)}${lettreDe(lundi) ? ` (semaine ${lettreDe(lundi)})` : ''}</h2>
      <button class="btn-rond" data-action="semaine-apres" aria-label="Semaine suivante">${icone('droite')}</button>
      ${lundi !== semaineUtile(c.tousCreneaux, c.auj) ? html`<button class="btn mini" data-action="semaine-auj">${semaineUtile(c.tousCreneaux, c.auj) === lundiDe(c.auj) ? 'Cette semaine' : 'Prochains cours'}</button>` : ''}
      <span class="segmente" role="group" aria-label="Affichage" style="margin-left:auto">
        <button data-action="semaine-vue" data-vue="grille" aria-pressed="${vue === 'grille'}">Grille horaire</button>
        <button data-action="semaine-vue" data-vue="liste" aria-pressed="${vue === 'liste'}">Cartes</button></span>
      <button class="btn mini${etat.local.persoVisible ? ' plein' : ''}" data-action="semaine-perso" aria-pressed="${etat.local.persoVisible}">${icone('personne')} Vie perso</button>
      ${agendasModifiables().length ? html`<button class="btn mini" data-action="rdv-nouveau" data-jour="${lundi >= c.auj ? lundi : c.auj}">${icone('plus')} Rendez-vous</button>` : ''}
    </div>
    <div class="legende">${niveaux.map((n) => html`<span><i style="--c:${couleurNiveau(n, c.v)}"></i>${n}</span>`)}
      <span><i style="--c:var(--etab)"></i>Établissement</span><span><i style="--c:var(--perso)"></i>Perso</span>
      <span><i style="--c:var(--alerte)"></i>À préparer</span></div>
    ${vue === 'grille' ? grille(lundi) : listeSemaine()}`;
}

actions['semaine-avant'] = () => { lundiAffiche = ajouteJours(semaine(), -7); changer(); };
actions['semaine-apres'] = () => { lundiAffiche = ajouteJours(semaine(), 7); changer(); };
actions['semaine-auj'] = () => { lundiAffiche = null; changer(); };
actions['semaine-vue'] = (el) => reglerLocal({ vueSemaine: el.dataset.vue });
actions['semaine-perso'] = () => reglerLocal({ persoVisible: !etat.local.persoVisible });
actions['ouvrir-evenement'] = (el) => {
  const c = calc();
  const source = el.dataset.genre === 'perso' ? c.perso : c.etablissement;
  const e = source.find((x) => x.id === el.dataset.id);
  if (!e) return;
  const perso = el.dataset.genre === 'perso';
  const modifiable = perso && e.modifiable && agendasModifiables().some((a) => a.id === e.agendaId);
  ouvrirFeuille(() => ({
    titre: e.titre,
    corps: html`<p>${dateLongue(e.jour0)}${e.debut ? ` · ${heureLisible(heureDe(e.debut, c.fuseau))}–${heureLisible(heureDe(e.fin, c.fuseau))}` : ''}</p>
      ${e.lieu ? html`<p class="aide">${e.lieu}</p>` : ''}
      ${e.description ? html`<pre class="pronote-texte">${e.description}</pre>` : ''}
      <p class="aide">${perso ? `Agenda personnel${e.agenda ? ` « ${e.agenda} »` : ''}${modifiable ? ' — ce que vous changez ici change aussi dans Google Agenda.' : ' — en lecture seule (agenda partagé, ou invitation).'}` : 'Événement de l’établissement, lu dans Pronote : il se change dans Pronote.'}</p>`,
    pied: modifiable ? html`<button class="btn danger" data-action="rdv-supprimer" data-id="${e.id}">${icone('corbeille')} Supprimer</button>
      <button class="btn plein" data-action="rdv-modifier" data-id="${e.id}">${icone('crayon')} Modifier</button>` : '',
  }));
};
</script>
<script type="text/x-carnet-module" data-module="carnet/js/vues/classes.js">
// Les classes et leurs files d'étapes. Une étape appartient à un NIVEAU : son titre, sa durée,
// ses jalons et son texte Pronote sont les mêmes pour toutes les classes de ce niveau qui la
// font. Ce qui est propre à une classe, c'est l'ordre de sa file et l'endroit où elle en est.
import { actions, changements, envois } from 'carnet/js/actions.js';
import { html, icone, ouvrirFeuille, fermerFeuille, redessinerFeuille, toast } from 'carnet/js/ui.js';
import { calc, etat, reglerLocal, ecrireDoc, modifierDoc, supprimerDoc, nomClasse, niveauClasse, classesDetectees, modifierReglages } from 'carnet/js/etat.js';
import { niveauDe } from 'carnet/js/pronote.js';
import { seancesLisible, jalonsDe, EPS, arretDe, calendrierEtapes, prochainesEvaluations } from 'carnet/js/moteur.js';
import { dateCourte, jourMois, lundiDe, ecartJours } from 'carnet/js/dates.js';
import { nouvelId } from 'carnet/js/donnees.js';
import { pastille, styleNiveau, suggestionsPour, bandeauSuite } from 'carnet/js/vues/commun.js';
import { ouvrirImportProgression } from 'carnet/js/vues/programmation.js';

export const MODELES_JALONS = {
  aucun: { nom: 'Aucun jalon (on compte en quarts de séance)', jalons: [] },
  demarche: { nom: "Démarche d'investigation", jalons: ['Situation déclenchante', 'Problème', 'Hypothèses', 'Protocole', 'Résultats', 'Interprétation', 'Bilan'] },
  documentaire: { nom: 'Activité documentaire', jalons: ['Documents', 'Questions', 'Mise en commun', 'Bilan'] },
  tp: { nom: 'Travaux pratiques', jalons: ['Protocole', 'Manipulation', 'Résultats', 'Interprétation', 'Rangement'] },
  ece: { nom: 'Trame ECE', jalons: ['Problème', 'Stratégie', 'Manipulation', 'Résultats', 'Conclusion'] },
};
const DUREES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5, 6, 8];
// Une durée importée d'un tableur (« 3 semaines » = 4,5 séances) reste proposée telle quelle.
const dureesAvec = (d) => [...new Set([...DUREES, d])].sort((a, b) => a - b);
const ORDRE_NIVEAUX = ['6e', '5e', '4e', '3e', '2nde', '1re', 'Tle', 'Autre'];

/** L'écart entre la semaine où l'étape tombe et celle que visait la programmation. */
function ecartCible(e, jour) {
  if (!e || !e.cible || !jour) return '';
  const n = Math.round(ecartJours(lundiDe(e.cible), lundiDe(jour)) / 7);
  if (!n) return html`<span class="ecart ok" title="Dans la semaine visée">semaine visée</span>`;
  return n > 0
    ? html`<span class="ecart retard" title="Semaine visée : ${dateCourte(lundiDe(e.cible))}">+${n} sem.</span>`
    : html`<span class="ecart avance" title="Semaine visée : ${dateCourte(lundiDe(e.cible))}">${n} sem.</span>`;
}

let edition = null; // { code, u, eid, donnees, nouvelle }

function carteClasse(code, cal) {
  const c = calc();
  const cl = c.v.classes[code];
  const pc = c.plan.parClasse[code];
  const dates = (cal && cal[code]) || {};
  const file = (cl.file || []).filter((it) => c.v.etapes[it.eid]);
  const pos = pc ? pc.position : { i: 0, f: 0 };
  const memeNiveau = Object.entries(c.v.etapes).filter(([id, e]) => e.niveau === cl.niveau && !file.some((it) => it.eid === id));
  const autres = Object.keys(c.v.classes).filter((k) => k !== code && c.v.classes[k].niveau === cl.niveau);
  return html`<section class="carte" id="classe-${code}" style="${styleNiveau(code)}">
    <div class="classe-tete">
      <h2>${pastille(code)}</h2>
      <span class="aide">${code} · ${cl.niveau}${cl.effectif ? ` · ${cl.effectif} élèves` : ''}</span>
      <span class="outils" style="margin-left:auto">
        ${file.length ? html`<button class="btn-rond" data-action="prog-exporter" data-code="${code}" aria-label="Exporter la progression de la ${nomClasse(code)} (Excel)" title="Exporter en Excel">${icone('telecharger')}</button>` : ''}
        <button class="btn-rond" data-action="classe-modifier" data-code="${code}" aria-label="Modifier la classe ${nomClasse(code)}">${icone('crayon')}</button>
      </span>
    </div>
    ${pc && pc.prochains[0] ? html`<p class="aide">Prochain cours : <b>${dateCourte(pc.prochains[0].jour)}</b>${pc.premierLibre ? (pc.couvertJusqua ? html` · préparée jusqu'au ${dateCourte(pc.couvertJusqua)}` : html` · <b class="retard">rien de prévu</b>`) : ' · tout est prévu'}</p>` : ''}
    ${suggestionsPour(code).map((sug) => bandeauSuite(code, sug))}
    <ol class="file">${file.length ? file.map((it, i) => {
      const e = c.v.etapes[it.eid];
      const J = jalonsDe(e);
      const etatEtape = i < pos.i ? 'faite' : i === pos.i ? 'encours' : '';
      const fait = i < pos.i ? 1 : i === pos.i ? pos.f : 0;
      const d = dates[it.u] || {};
      const chapitre = e.chapitre && (i === 0 || (c.v.etapes[file[i - 1].eid] || {}).chapitre !== e.chapitre)
        ? html`<li class="chapitre-file">${e.chapitre}</li>` : '';
      return html`${chapitre}<li class="etape ${etatEtape}">
        <span>${e.eval ? '✎ ' : ''}${e.titre}</span>
        <span class="mini-outils">
          <button data-action="etape-monter" data-code="${code}" data-i="${i}" aria-label="Monter" ${i === 0 ? 'disabled' : ''}>${icone('haut')}</button>
          <button data-action="etape-descendre" data-code="${code}" data-i="${i}" aria-label="Descendre" ${i === file.length - 1 ? 'disabled' : ''}>${icone('bas')}</button>
          <button data-action="etape-editer" data-code="${code}" data-u="${it.u}" aria-label="Modifier « ${e.titre} »">${icone('crayon')}</button>
          <button data-action="etape-retirer" data-code="${code}" data-u="${it.u}" aria-label="Retirer « ${e.titre} » de la file">${icone('croix')}</button>
        </span>
        <span class="meta">${d.debut && etatEtape !== 'faite' ? html`<b>${etatEtape === 'encours' ? 'en cours' : dateCourte(d.debut)}</b> ${ecartCible(e, d.debut)} · ` : ''}${seancesLisible(Number(e.duree) || 1)}${e.photocopies ? ` · ${e.photocopies} p. à photocopier` : ''}${e.afaire ? ` · ${e.afaire}` : ''}${e.devoirs ? ` · travail : ${e.devoirs}` : ''}
          ${J.length ? html`<span class="jalons-apercu">${J.map((j, k) => html`<span class="${(k + 1) / J.length <= fait + EPS ? 'fait' : ''}">${j}</span>`)}</span>` : ''}
          ${i === pos.i && pos.f > EPS && !J.length ? html`<span>fait à ${Math.round(pos.f * 100)} %</span>` : ''}</span>
      </li>`;
    }) : html`<li class="vide">Aucune étape. Ajoutez la première ci-dessous, ou <button class="lien" data-action="prog-importer">importez votre programmation</button>.</li>`}</ol>
    <div class="outils">
      <button class="btn mini plein" data-action="etape-nouvelle" data-code="${code}">${icone('plus')} Nouvelle étape</button>
      ${memeNiveau.length ? html`<select data-change="etape-reprendre" data-code="${code}" aria-label="Reprendre une étape du niveau" style="width:auto">
        <option value="">Reprendre une étape des ${cl.niveau}…</option>${memeNiveau.map(([id, e]) => html`<option value="${id}">${e.titre}</option>`)}</select>` : ''}
      ${autres.length && file.length ? html`<button class="btn mini" data-action="file-copier" data-code="${code}">${icone('dupliquer')} Même file pour…</button>` : ''}
      ${file.length ? html`<button class="btn mini discret" data-action="classe-depart" data-code="${code}">${icone('depart')} Point de départ</button>` : ''}
    </div>
  </section>`;
}

export function rendreClasses(route) {
  const c = calc();
  const codes = Object.keys(c.v.classes).filter((k) => !c.v.classes[k].masquee);
  codes.sort((a, b) => ORDRE_NIVEAUX.indexOf(c.v.classes[a].niveau) - ORDRE_NIVEAUX.indexOf(c.v.classes[b].niveau) || nomClasse(a).localeCompare(nomClasse(b)));
  // #/classes/5G1 ouvre la carte de la classe ; #/classes/calendrier, le calendrier des évaluations.
  const cible = route.param === 'calendrier' ? '' : route.param;
  const vue = route.param === 'calendrier' ? 'calendrier' : cible ? 'classes' : etat.local.vueProgressions || 'classes';
  if (cible) setTimeout(() => document.getElementById(`classe-${cible}`)?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 50);
  const masquees = Object.keys(c.v.classes).filter((k) => c.v.classes[k].masquee);
  const cal = calendrierEtapes(c.plan, c.creneaux);
  const avecFile = codes.some((k) => (c.v.classes[k].file || []).length);
  return html`
    <div class="titre-page"><div><h1>Progressions</h1><p>Chaque classe a sa file d'étapes. Les étapes sont partagées par niveau : une activité écrite pour la 601 sert aussi à la 602.</p></div>
      <div class="outils">
        <button class="btn plein" data-action="prog-importer">${icone('televerser')} Importer une programmation</button>
        ${avecFile ? html`<button class="btn" data-action="prog-exporter">${icone('telecharger')} Exporter (Excel)</button>` : ''}
        <button class="btn" data-action="classe-ajouter">${icone('plus')} Ajouter une classe</button>
      </div></div>
    ${codes.length && avecFile ? html`<div class="segmente" role="group" aria-label="Affichage">
      <button data-action="vue-progressions" data-vue="classes" aria-pressed="${vue === 'classes'}">Par classe</button>
      <button data-action="vue-progressions" data-vue="calendrier" aria-pressed="${vue === 'calendrier'}">Calendrier et évaluations</button></div>` : ''}
    ${!codes.length ? html`<p class="vide">Aucune classe suivie pour l'instant.</p>`
      : vue === 'calendrier' && avecFile ? rendreCalendrier(codes, cal)
      : html`<div class="classes">${codes.map((k) => carteClasse(k, cal))}</div>`}
    ${masquees.length ? html`<p class="aide">Classes masquées : ${masquees.map((k) => html`<button class="lien" data-action="classe-afficher" data-code="${k}">${nomClasse(k)}</button> `)}</p>` : ''}`;
}
actions['vue-progressions'] = (el) => {
  reglerLocal({ vueProgressions: el.dataset.vue });
  if (/^#\/classes\/./.test(location.hash)) location.hash = '#/classes';
};

// ---------- Calendrier : chaque étape, chaque classe, la date où elle tombe ----------

/** Les étapes d'un niveau dans l'ordre des files, les absentes d'une file glissées à leur place. */
function ordreDuNiveau(codes, v) {
  const ordre = [];
  for (const code of codes) {
    let pos = -1;
    for (const it of v.classes[code].file || []) {
      if (!v.etapes[it.eid]) continue;
      const k = ordre.indexOf(it.eid);
      if (k >= 0) { pos = Math.max(pos, k); continue; }
      ordre.splice(pos + 1, 0, it.eid);
      pos++;
    }
  }
  return ordre;
}

function celluleCalendrier(code, eid, cal, v) {
  const it = (v.classes[code].file || []).find((x) => x.eid === eid);
  if (!it) return html`<td class="absent" title="Pas dans la file de la ${nomClasse(code)}">·</td>`;
  const d = (cal[code] || {})[it.u] || {};
  const e = v.etapes[eid];
  const annoncee = e.eval && v.classes[code].annonces && v.classes[code].annonces[it.u];
  if (d.etat === 'faite') return html`<td class="faite">✓${d.debut ? ` ${jourMois(d.debut)}` : ''}</td>`;
  if (d.etat === 'au-dela') return html`<td class="au-dela" title="Au-delà de l'emploi du temps connu">—</td>`;
  return html`<td class="${d.etat}">${d.etat === 'encours' ? 'en cours' : dateCourte(d.debut)}${d.fin && d.fin !== d.debut ? html`<span class="jusqua"> → ${jourMois(d.fin)}</span>` : ''}
    ${ecartCible(e, d.debut)}${e.eval ? html` <span class="etiquette ${annoncee ? 'ok' : 'attente'}">${annoncee ? 'annoncée' : 'à annoncer'}</span>` : ''}</td>`;
}

function rendreCalendrier(codes, cal) {
  const c = calc(), v = c.v;
  const evals = prochainesEvaluations(v, c.plan, c.creneaux, { maintenant: c.maintenant });
  const niveaux = ORDRE_NIVEAUX.filter((n) => codes.some((k) => v.classes[k].niveau === n));
  return html`${evals.length ? html`<section class="carte"><h2>Prochaines évaluations</h2>
      <ul class="liste evals-a-venir">${evals.slice(0, 12).map((e) => html`<li style="${styleNiveau(e.code)}">
        <span class="quand">${dateCourte(e.jour)}</span>${pastille(e.code)}<span class="quoi">${e.titre}</span>
        ${ecartCible(v.etapes[e.eid], e.jour)}<span class="etiquette ${e.annoncee ? 'ok' : 'attente'}">${e.annoncee ? 'annoncée' : 'à annoncer'}</span></li>`)}</ul></section>` : ''}
    ${niveaux.map((n) => {
      const cl = codes.filter((k) => v.classes[k].niveau === n);
      const ordre = ordreDuNiveau(cl, v);
      if (!ordre.length) return '';
      let chapitre = null;
      return html`<section class="carte calendrier-niveau"><h2>${n}</h2>
        <div class="defile-x"><table class="calendrier-etapes">
          <thead><tr><th scope="col">Étape</th><th scope="col">Durée</th><th scope="col">Visée</th>${cl.map((k) => html`<th scope="col">${pastille(k)}</th>`)}</tr></thead>
          <tbody>${ordre.map((eid) => {
            const e = v.etapes[eid];
            const tete = e.chapitre && e.chapitre !== chapitre ? html`<tr class="chapitre"><th colspan="${3 + cl.length}" scope="rowgroup">${e.chapitre}</th></tr>` : '';
            if (e.chapitre) chapitre = e.chapitre;
            return html`${tete}<tr class="${e.eval ? 'eval' : ''}"><th scope="row">${e.eval ? '✎ ' : ''}${e.titre}</th><td class="duree">${seancesLisible(Number(e.duree) || 1)}</td>
              <td class="visee">${e.cible ? jourMois(lundiDe(e.cible)) : ''}</td>${cl.map((k) => celluleCalendrier(k, eid, cal, v))}</tr>`;
          })}</tbody></table></div>
        <p class="aide">Dates calculées sur l'emploi du temps connu : elles bougent dès qu'un cours saute ou qu'une validation change le rythme.</p></section>`;
    })}`;
}

// ---------- Éditeur d'étape ----------
/** Les autres classes suivies du même niveau qui n'ont pas encore cette étape. */
function classesSoeurs(code, eid) {
  const v = calc().v, niveau = niveauClasse(code);
  return Object.keys(v.classes)
    .filter((k) => k !== code && !v.classes[k].masquee && niveauClasse(k) === niveau && !(eid && (v.classes[k].file || []).some((it) => it.eid === eid)))
    .sort((a, b) => nomClasse(a).localeCompare(nomClasse(b), 'fr', { numeric: true }));
}

/** Glisse l'étape dans la file d'une classe, juste avant `avantU` (à la fin s'il est nul). */
function insererDans(code, eid, avantU) {
  const u = nouvelId('u');
  modifierDoc(`classes/${code}`, (cl) => {
    const f = [...(cl.file || [])], k = avantU ? f.findIndex((it) => it.u === avantU) : -1;
    f.splice(k >= 0 ? k : f.length, 0, { u, eid });
    cl.file = f;
    // « Arrêtés au tout début de l'étape X » voulait dire « tout ce qui précède X est fait » :
    // l'arrêt passe au début de la nouvelle étape, sinon elle serait comptée comme déjà faite.
    if (avantU && cl.depart && cl.depart.u === avantU && !(cl.depart.f > EPS)) cl.depart = { ...cl.depart, u };
  });
  if (!avantU) return;
  for (const [cle, j] of Object.entries(calc().v.journal || {})) {
    if (j && j.code === code && j.arret && j.arret.u === avantU && !(j.arret.f > EPS)) modifierDoc(`journal/${cle}`, (x) => { x.arret = { ...x.arret, u }; });
  }
}

/** Les classes (autres que `code`) dont la file contient cette étape. */
function classesAvec(eid, code) {
  const v = calc().v;
  return Object.keys(v.classes).filter((k) => k !== code && !v.classes[k].masquee && (v.classes[k].file || []).some((it) => it.eid === eid))
    .sort((a, b) => nomClasse(a).localeCompare(nomClasse(b), 'fr', { numeric: true }));
}

/** Les étapes voisines, dans la classe d'origine, de l'endroit où se place (ou se trouve) l'étape. */
function reperesDe(ed) {
  const f0 = (calc().v.classes[ed.code] || {}).file || [];
  if (ed.nouvelle) {
    const k = ed.avantU ? f0.findIndex((it) => it.u === ed.avantU) : -1;
    return k >= 0 ? { apres: f0[k].eid, avant: k > 0 ? f0[k - 1].eid : null } : { apres: null, avant: f0.length ? f0[f0.length - 1].eid : null };
  }
  const k = f0.findIndex((it) => it.u === ed.u);
  return { apres: k >= 0 && k + 1 < f0.length ? f0[k + 1].eid : null, avant: k > 0 ? f0[k - 1].eid : null };
}

function feuilleEtape() {
  const e = edition.donnees;
  const v = calc().v;
  const partageuses = edition.nouvelle ? [] : classesAvec(edition.eid, edition.code);
  const niveau = niveauClasse(edition.code);
  const chapitres = [...new Set(Object.values(v.etapes).filter((x) => x.niveau === niveau && x.chapitre).map((x) => x.chapitre))];
  const soeurs = classesSoeurs(edition.code, edition.eid);
  // Cochées d'office : seulement les classes qui en sont au même endroit de la progression
  // (elles ont l'étape voisine). Une classe qui démarre, ou qui suit autre chose, reste décochée.
  const rep = reperesDe(edition);
  const memeEndroit = (k) => { const fk = (v.classes[k].file || []); return [rep.avant, rep.apres].some((x) => x && fk.some((it) => it.eid === x)); };
  const cochees = edition.aussi || (edition.nouvelle ? soeurs.filter(memeEndroit) : []);
  return {
    titre: edition.nouvelle ? `Nouvelle étape · ${nomClasse(edition.code)}` : 'Modifier l’étape',
    corps: html`<form class="section-feuille" data-envoi="etape-enregistrer" id="form-etape">
      <label class="champ"><span>Intitulé</span><input type="text" name="titre" value="${e.titre || ''}" required autofocus placeholder="Activité 5 – Le sol, un milieu vivant"></label>
      <label class="champ"><span>Chapitre ou séquence</span><input type="text" name="chapitre" value="${e.chapitre || ''}" list="chapitres-niveau" placeholder="Chapitre 2 — Le sol, un milieu vivant">
        <datalist id="chapitres-niveau">${chapitres.map((x) => html`<option value="${x}"></option>`)}</datalist></label>
      <div class="grille-champs">
        <label class="champ"><span>Durée</span><select name="duree">${dureesAvec(Number(e.duree) || 1).map((d) => html`<option value="${d}"${Math.abs(d - (Number(e.duree) || 1)) < EPS ? ' selected' : ''}>${seancesLisible(d)}</option>`)}</select></label>
        <label class="champ"><span>Photocopies (pages par élève)</span><input type="number" name="photocopies" min="0" max="20" value="${Number(e.photocopies) || 0}"></label>
      </div>
      ${soeurs.length ? html`<fieldset class="champ aussi"><legend>${edition.nouvelle ? 'Prévoir aussi pour' : 'Ajouter aussi à'}</legend>
        <div class="outils">${soeurs.map((k) => html`<label class="coche"><input type="checkbox" name="aussi" value="${k}"${cochees.includes(k) ? ' checked' : ''}><span>${nomClasse(k)}</span></label>`)}</div>
        <p class="aide">Elle se place au même endroit de leur progression : elles y arriveront à leur rythme.</p></fieldset>` : ''}
      <label class="coche"><input type="checkbox" name="eval"${e.eval ? ' checked' : ''}><span>C'est une évaluation — le Carnet rappelle de l'annoncer, et ne la coupe pas sur deux cours</span></label>
      <label class="champ"><span>Déroulé de la séance — une ligne par moment</span><textarea name="jalons" rows="5" placeholder="Faire l'appel&#10;Correction des exercices&#10;Activité : lecture du document&#10;Bilan">${(e.jalons || []).join('\n')}</textarea>
        <span class="aide">« Où en est-on ? » propose ces moments pour dire où la classe s'est arrêtée.</span></label>
      <label class="champ"><span>Matériel à prévoir</span><input type="text" name="afaire" value="${e.afaire || ''}" placeholder="Microscopes, lames, épiderme d'oignon"></label>
      <label class="champ"><span>Texte pour le cahier de textes Pronote</span><textarea name="pronote" placeholder="Écrit une fois, repris pour toutes les classes du niveau">${e.pronote || ''}</textarea></label>
      <div class="grille-champs">
        <label class="champ"><span>Travail à faire (donné à la fin de l'étape)</span><input type="text" name="devoirs" value="${e.devoirs || ''}" placeholder="Apprendre le bilan"></label>
        <label class="champ"><span>Semaine visée (facultatif)</span><input type="date" name="cible" value="${e.cible || ''}"></label>
      </div>
      ${partageuses.length ? html`<fieldset class="champ aussi"><legend>Modifier aussi pour</legend>
        <div class="outils">${partageuses.map((k) => html`<label class="coche"><input type="checkbox" name="pour" value="${k}"><span>${nomClasse(k)}</span></label>`)}</div>
        <p class="aide">Décochée, une classe garde sa version telle quelle : vos changements ne valent que pour la ${nomClasse(edition.code)}.</p></fieldset>` : ''}
    </form>`,
    // Pas de bouton « Annuler » : fermer la feuille enregistre ce qui a été tapé.
    pied: html`${!edition.nouvelle ? html`<button class="btn danger" data-action="etape-supprimer">Retirer de la ${nomClasse(edition.code)}</button>` : ''}
      <button class="btn plein" type="submit" form="form-etape">${icone('valider')} Enregistrer</button>`,
  };
}

actions['etape-nouvelle'] = (el) => {
  const code = el.dataset.code;
  // La nouvelle étape reprend le chapitre de la dernière de la file : on écrit souvent à la suite.
  const c = calc(), file = (c.v.classes[code].file || []).filter((it) => c.v.etapes[it.eid]);
  const dernier = file.length ? c.v.etapes[file[file.length - 1].eid].chapitre || '' : '';
  edition = { code, u: null, eid: null, nouvelle: true, donnees: { titre: '', chapitre: dernier, duree: 1, format: 'indiff', eval: false, jalons: [], photocopies: 0, afaire: '', pronote: '', devoirs: '', cible: '' } };
  ouvrirFeuille(feuilleEtape, { surFermeture: fermetureEtape });
};
// Depuis un cours de l'emploi du temps : l'étape se glisse dans la file à l'endroit où ce cours
// commence, et tombe donc sur lui (les étapes d'après glissent d'un cran).
export function nouvelleEtapeAuCours(cle) {
  const c = calc();
  const cr = c.tousCreneaux.find((x) => x.cle === cle);
  if (!cr || !c.v.classes[cr.code]) return;
  const segs = ((c.plan.parCreneau[cle] || {}).segments || []).filter((s) => !s.recul);
  const file = c.v.classes[cr.code].file || [];
  let avantU = null;
  if (segs.length) {
    const k = file.findIndex((it) => it.u === segs[0].u);
    // Une étape commencée dans un cours précédent se finit d'abord : on se place juste après.
    const j = segs[0].de < EPS ? k : k + 1;
    avantU = j >= 0 && j < file.length ? file[j].u : null;
  }
  const precedente = avantU ? file[file.findIndex((it) => it.u === avantU) - 1] : file[file.length - 1];
  edition = {
    code: cr.code, u: null, eid: null, nouvelle: true, avantU, jour: cr.jour,
    donnees: { titre: '', chapitre: (precedente && (c.v.etapes[precedente.eid] || {}).chapitre) || '', duree: 1, format: 'indiff', eval: false, jalons: [], photocopies: 0, afaire: '', pronote: '', devoirs: '', cible: '' },
  };
  ouvrirFeuille(feuilleEtape, { surFermeture: fermetureEtape });
}
actions['etape-ici'] = (el) => nouvelleEtapeAuCours(el.dataset.cle);
actions['etape-editer'] = (el) => {
  const { code, u } = el.dataset;
  const c = calc();
  const it = (c.v.classes[code].file || []).find((x) => x.u === u);
  if (!it) return;
  edition = { code, u, eid: it.eid, nouvelle: false, donnees: structuredClone(c.v.etapes[it.eid]) };
  ouvrirFeuille(feuilleEtape, { surFermeture: fermetureEtape });
};
// Fermer la feuille (croix, Échap, clic à côté) enregistre ce qui a été tapé : rien ne se perd.
function fermetureEtape(f) {
  if (edition && !edition.fait && f) enregistrerEtape(f, { enFermant: true });
  edition = null;
}
const CHAMPS_ETAPE = ['titre', 'duree', 'eval', 'photocopies', 'jalons', 'afaire', 'pronote', 'chapitre', 'devoirs', 'cible'];
envois['etape-enregistrer'] = (f) => enregistrerEtape(f);
function enregistrerEtape(f, { enFermant = false } = {}) {
  if (!edition || edition.fait) return;
  const d = {
    ...edition.donnees,
    titre: f.titre.value.trim(),
    duree: Number(f.duree.value) || 1,
    eval: f.eval.checked,
    photocopies: Math.max(0, Math.round(Number(f.photocopies.value) || 0)),
    jalons: f.jalons.value.split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 20),
    afaire: f.afaire.value.trim(),
    pronote: f.pronote.value.trim(),
    chapitre: f.chapitre.value.trim(),
    devoirs: f.devoirs.value.trim(),
    // La semaine, pas le jour : on garde son lundi, c'est à lui qu'on compare la date prévue.
    cible: /^\d{4}-\d{2}-\d{2}$/.test(f.cible.value) ? lundiDe(f.cible.value) : '',
    niveau: niveauClasse(edition.code),
  };
  delete d._m;
  const aussi = [...f.querySelectorAll('[name="aussi"]:checked')].map((x) => x.value);
  const pour = [...f.querySelectorAll('[name="pour"]:checked')].map((x) => x.value);
  const modifiee = CHAMPS_ETAPE.some((k) => String(d[k] ?? '') !== String(edition.donnees[k] ?? ''));
  if (enFermant) {
    // Rien de tapé (ou rien de changé) : rien à enregistrer.
    const vide = !['titre', 'afaire', 'pronote', 'devoirs'].some((k) => d[k]) && !d.jalons.length;
    if (edition.nouvelle ? vide : !(modifiee || aussi.length)) return;
  }
  if (!d.titre) {
    if (!enFermant) { toast('Donnez un intitulé à l’étape.'); return; }
    d.titre = d.pronote.split('\n')[0].slice(0, 80) || d.jalons[0] || d.afaire.slice(0, 80) || 'Étape sans titre';
  }
  // Marquée faite (et non effacée) : la feuille peut encore se redessiner avant de se fermer.
  const ed = edition; ed.fait = true;
  const { nouvelle, code, avantU, jour } = ed;
  const reperes = reperesDe(ed);
  let eid = ed.eid || nouvelId(`e${d.niveau}-`);
  // Une étape partagée qu'on modifie pour cette classe seulement (ou quelques-unes) : elles
  // reçoivent leur propre copie, les autres gardent la leur, intacte.
  const separer = !nouvelle && modifiee && classesAvec(eid, code).some((k) => !pour.includes(k));
  if (separer) {
    const neuf = nouvelId(`e${d.niveau}-`);
    ecrireDoc(`etapes/${neuf}`, d);
    for (const k of [code, ...pour]) modifierDoc(`classes/${k}`, (cl) => { cl.file = (cl.file || []).map((it) => (it.eid === eid ? { ...it, eid: neuf } : it)); });
    eid = neuf;
  } else if (nouvelle || modifiee) ecrireDoc(`etapes/${eid}`, d);
  if (nouvelle) insererDans(code, eid, avantU);
  // Les autres classes du niveau : au même endroit de leur file, repéré par les étapes voisines.
  for (const autre of aussi) {
